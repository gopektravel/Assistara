<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Payment confirmed | Assistara Academy</title><link rel="icon" type="image/svg+xml" href="/assistara-logo.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#fbfaf6,#fff3a3);color:#151515;font-family:Inter,system-ui,sans-serif}.card{width:min(650px,calc(100% - 28px));background:#fff;border:1px solid #dfdcd5;border-radius:30px;padding:42px;text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.08)}.logo{width:48px;height:48px}.check{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;margin:24px auto 18px;background:#ffd51f;font-size:30px;font-weight:900}h1{font-size:clamp(40px,8vw,60px);line-height:1;letter-spacing:-.055em;margin:0 0 14px}p{color:#66605a;font-size:17px;line-height:1.6;margin:0 auto 26px;max-width:500px}.btn{display:none;align-items:center;justify-content:center;border-radius:999px;padding:16px 23px;background:#171717;color:#fff;text-decoration:none;font-weight:900}.status{font-weight:800;color:#716b63}.error{display:none;background:#fee2e2;color:#8c1d1d;border-radius:13px;padding:13px 15px;margin-top:18px;text-align:left}@media(max-width:600px){.card{padding:30px 22px;border-radius:24px}}
</style></head><body><main class="card"><img class="logo" src="/assistara-logo.svg" alt="Assistara"><div class="check">✓</div><h1>Payment received.</h1><p id="copy">We are confirming your enrollment now. This normally takes only a moment.</p><div id="status" class="status">Verifying payment...</div><a id="next" class="btn" href="#">Continue to onboarding</a><div id="error" class="error"></div></main><script>
const API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/payment-complete';const session=new URLSearchParams(location.search).get('session_id')||'';const status=document.getElementById('status'),next=document.getElementById('next'),copy=document.getElementById('copy'),err=document.getElementById('error');
(async()=>{try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Could not verify payment');status.textContent='Enrollment confirmed ✓';copy.textContent=`Welcome${j.name?' '+j.name.split(/\s+/)[0]:''}. Your place in Assistara Academy is secured. One last step: set up your account and onboarding details.`;next.href=j.onboarding_url;next.style.display='inline-flex'}catch(e){status.style.display='none';err.style.display='block';err.textContent=e.message+' If you were charged, do not pay again. Contact academy@getassistara.com.'}})();
</script></body></html>
