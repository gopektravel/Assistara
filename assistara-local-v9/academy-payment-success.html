<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Payment confirmed | Assistara Academy</title>
<link rel="icon" type="image/svg+xml" href="/assistara-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--muted:#6d675f;--line:#dedbd3;--red:#fee2e2;--red-ink:#8c1d1d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}
.shell{width:min(760px,calc(100% - 28px));margin:0 auto;padding:28px 0 64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-size:18px;font-weight:700;margin-bottom:34px}
.brand img{width:38px;height:38px}
.card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:42px 38px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.06)}
.check{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 22px;background:var(--yellow);font-size:26px;font-weight:800}
h1{font-size:clamp(38px,7vw,52px);line-height:1.02;letter-spacing:-.045em;margin:0 0 14px;font-weight:800}
p{color:var(--muted);font-size:17px;line-height:1.6;margin:0 auto 24px;max-width:520px}
.status{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:16px}
.btn{display:none;align-items:center;justify-content:center;border-radius:999px;padding:15px 22px;background:var(--ink);color:#fff;text-decoration:none;font:700 15px "DM Sans",Arial,sans-serif}
.error{display:none;background:var(--red);color:var(--red-ink);border-radius:13px;padding:13px 15px;margin-top:18px;text-align:left;font-size:14px;line-height:1.5}
@media(max-width:600px){.shell{padding-top:18px}.brand{margin-bottom:22px}.card{padding:30px 22px;border-radius:22px}h1{font-size:40px}}
</style>
</head>
<body>
<div class="shell">
<a class="brand" href="/academy"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Academy</span></a>
<main class="card">
<div class="check">✓</div>
<h1>Payment received.</h1>
<p id="copy">We are confirming your enrollment now. This normally takes only a moment.</p>
<div id="status" class="status">Verifying payment...</div>
<a id="next" class="btn" href="#">Continue to onboarding</a>
<div id="error" class="error"></div>
</main>
</div>
<script>
const API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/payment-complete';
const session=new URLSearchParams(location.search).get('session_id')||'';
const status=document.getElementById('status'),next=document.getElementById('next'),copy=document.getElementById('copy'),err=document.getElementById('error');
(async()=>{try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error||'Could not verify payment');status.textContent='Enrollment confirmed';copy.textContent=`Welcome${j.name?' '+j.name.split(/\s+/)[0]:''}. Your place in Assistara Academy is secured. One last step: set up your account and onboarding details.`;next.href=j.onboarding_url;next.style.display='inline-flex'}catch(e){status.style.display='none';err.style.display='block';err.textContent=e.message+' If you were charged, do not pay again. Contact academy@getassistara.com.'}})();
</script>
</body>
</html>
