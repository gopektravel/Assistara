<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Payment received | Assistara Academy</title>
<link rel="icon" type="image/svg+xml" href="/assistara-logo.svg"/>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbfaf6;color:#151515;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(620px,calc(100% - 28px));background:#fff;border:1px solid #dfdcd5;border-radius:28px;padding:40px;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.08)}.logo{width:48px;height:48px}.check{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:24px auto 18px;background:#ffd51f;font-size:30px;font-weight:900}h1{font-size:clamp(38px,8vw,58px);line-height:1;letter-spacing:-.05em;margin:0 0 14px}p{color:#66605a;font-size:17px;line-height:1.6;margin:0 auto 26px;max-width:480px}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:15px 22px;background:#171717;color:#fff;text-decoration:none;font-weight:850}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/assistara-logo.svg" alt="Assistara">
  <div class="check">✓</div>
  <h1>Payment received.</h1>
  <p>Your Stripe checkout was completed successfully. We will use your enrollment details for the next onboarding steps.</p>
  <a class="btn" href="/academy">Back to Assistara Academy</a>
</main>
</body>
</html>
