<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opening Google Meet | Assistara</title>
  <link rel="icon" href="/assistara-logo.svg" type="image/svg+xml" />
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f8f5;color:#101311;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.box{text-align:center;padding:28px;max-width:440px}.logo{width:44px;height:44px;margin-bottom:18px}.spinner{width:28px;height:28px;border:3px solid #e1e5e0;border-top-color:#111713;border-radius:50%;margin:22px auto;animation:spin .7s linear infinite}h1{font-size:25px;letter-spacing:-.03em;margin:0 0 8px}p{color:#69706b;line-height:1.5;margin:0}.fallback{display:none;margin-top:18px;color:#101311;font-weight:700}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="box">
    <img class="logo" src="/assistara-logo.svg" alt="Assistara" />
    <h1>Opening Google Meet</h1>
    <p>Your masterclass access is being opened now.</p>
    <div class="spinner" aria-hidden="true"></div>
    <a class="fallback" id="fallback" href="https://meet.google.com/">Open Google Meet</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || 'ASSISTARA-DEMO-001';
    const destination = 'https://meet.google.com/';

    // Demo only. In production, the token will be recorded server-side before redirecting.
    try {
      sessionStorage.setItem('assistara_demo_join_token', token);
      sessionStorage.setItem('assistara_demo_join_clicked_at', new Date().toISOString());
    } catch (e) {}

    setTimeout(() => window.location.replace(destination), 250);
    setTimeout(() => document.getElementById('fallback').style.display = 'inline-block', 1800);
  </script>
</body>
</html>
