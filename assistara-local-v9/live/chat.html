<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Assistara Live Chat</title>
<link rel="icon" type="image/svg+xml" href="/assistara-logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--ink:#151515;--cream:#fbfaf6;--yellow:#ffd51f;--line:#e2ded4;--muted:#8a857e}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#dfdcd5;color:var(--ink);font-family:"Manrope",sans-serif}
  .presenter{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto;background:var(--cream);box-shadow:0 0 0 1px var(--line)}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 10px;background:#fff;border-bottom:1px solid var(--line)}
  .top .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:-.02em}
  .top .brand img{width:24px;height:24px;object-fit:contain}
  .top .tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  /* One clean header + connection indicator (no inner header) */
  .chat{flex:1;display:flex;flex-direction:column;min-height:0;background:var(--cream)}
  .chat-head{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:.05em;background:#fff}
  .chat-conn{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--muted);text-transform:none;letter-spacing:0}
  .chat-conn-dot{width:8px;height:8px;border-radius:50%;background:#8a857e;flex:0 0 auto;transition:background .2s ease}
  .chat-conn-dot.is-connected{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  .chat-conn-dot.is-connecting{background:var(--yellow);animation:chatPulse 1.4s infinite}
  .chat-conn-dot.is-disconnected{background:#ef4444}
  .chat-conn-text{font-weight:700}
  @keyframes chatPulse{0%,100%{opacity:1}50%{opacity:.45}}
  .chat-frame-wrapper{flex:1;min-height:0;display:flex;flex-direction:column}
</style>
</head>
<body>
  <div class="presenter">
    <header class="top">
      <span class="brand"><img src="/assistara-logo.svg" alt=""/> Assistara</span>
      <span class="tag">Presenter</span>
    </header>
    <aside class="chat" id="presenterChat">
      <div class="chat-head">
        <span>LIVE CHAT</span>
        <span class="chat-conn"><i class="chat-conn-dot"></i><span class="chat-conn-text">Connecting…</span></span>
      </div>
      <div id="assistara-live-chat" class="chat-frame-wrapper"></div>
    </aside>
  </div>
  <script src="/assistara-chat-client.js"></script>
  <script>
    // Presenter view shares the ONE Railway room with the /live embed.
    // HOST comes from a private presenter link (?presenter=<secret>) or, for a
    // logged-in admin, from the admin-authed presenter_key action. Anyone else
    // joins as a normal first-name guest — never host by nickname.
    (function () {
      var params = new URLSearchParams(location.search);
      var hostToken = (params.get("presenter") || "").trim() || null;
      var admin = null;
      try { admin = localStorage.getItem("assistara_admin_token") || sessionStorage.getItem("assistara_admin_token"); } catch (e) {}
      function mount() {
        window.initAssistaraChat(document.getElementById("assistara-live-chat"), { identity: null, hostToken: hostToken });
      }
      if (!hostToken && admin) {
        fetch("/api/masterclass-youtube", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + admin },
          body: JSON.stringify({ action: "presenter_key", event_key: "founding-masterclass-2026" }),
          cache: "no-store",
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.ok && d.hostToken) hostToken = d.hostToken;
          mount();
        }).catch(mount);
      } else {
        mount();
      }
    })();
  </script>
</body>
</html>
