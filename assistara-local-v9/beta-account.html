<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Beta account | Assistara Academy</title><link rel="icon" href="/assistara-logo.svg"><style>body{margin:0;background:#fbfaf6;color:#171717;font-family:Arial,sans-serif}.wrap{width:min(560px,calc(100% - 28px));margin:40px auto}.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;margin-bottom:28px}.brand img{width:40px;height:40px}.card{background:white;border:1px solid #dedbd3;border-radius:26px;padding:32px}.tag{font-size:11px;font-weight:800;letter-spacing:.12em;color:#716b63}h1{font-size:42px;line-height:1;margin:10px 0 12px}p{color:#716b63;line-height:1.55}.form{display:grid;gap:15px;margin-top:24px}label{display:grid;gap:7px;font-size:13px;font-weight:700}input{padding:15px;border:1px solid #dedbd3;border-radius:13px;font-size:16px}button{border:0;border-radius:999px;padding:16px;background:#ffd51f;font-weight:800;font-size:15px;cursor:pointer}.msg{display:none;padding:12px;border-radius:12px;background:#fee2e2;color:#8c1d1d;font-size:13px;font-weight:700}</style></head><body><div class="wrap"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Academy</span></div><main class="card"><div class="tag">BETA TEST</div><h1>Create your real Academy account.</h1><p>This beta uses the live Assistara Academy authentication system. The account you create here is a real account and will take you into the real Academy portal.</p><form id="form" class="form"><label>Full name<input id="name" autocomplete="name" required></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input id="confirm" type="password" minlength="8" autocomplete="new-password" required></label><button id="btn">Create account & enter Academy</button><div id="msg" class="msg"></div></form></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>(()=>{const client=supabase.createClient('https://jhmmwleejgidrxavzdlq.supabase.co','sb_publishable_-hXhNTcQ7T2yW0SgVAXSrg_2FaPui1E');const form=document.getElementById('form'),msg=document.getElementById('msg'),btn=document.getElementById('btn');form.addEventListener('submit',async e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){msg.style.display='block';msg.textContent='Passwords do not match.';return}btn.disabled=true;btn.textContent='Creating real account...';msg.style.display='none';const {data,error}=await client.auth.signUp({email,password,options:{data:{name,role:'academy_student',beta_tester:true}}});if(error){msg.style.display='block';msg.textContent=error.message;btn.disabled=false;btn.textContent='Create account & enter Academy';return}if(data.session){location.href='/academy/dashboard';return}const login=await client.auth.signInWithPassword({email,password});if(login.error){msg.style.display='block';msg.textContent='Account created. Check your email if confirmation is required, then log in.';btn.disabled=false;btn.textContent='Account created';return}location.href='/academy/dashboard'})})();</script></body></html>
