<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Beta account setup closed | Assistara Academy</title>
  <link rel="icon" href="/assistara-logo.svg">
  <style>
    :root{font-family:"DM Sans",sans-serif;color:#171717;background:#fbfaf6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(560px,100%);padding:32px;background:#fff;border:1px solid #dedbd3;border-radius:26px}
    .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;margin-bottom:28px}
    .brand img{width:40px;height:40px}
    .tag{font-size:11px;font-weight:800;letter-spacing:.12em;color:#716b63}
    h1{font-size:36px;line-height:1.05;margin:10px 0 12px}
    p{color:#716b63;line-height:1.55}
    nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
    a{display:inline-block;padding:14px 20px;border-radius:999px;background:#ffd51f;color:#171717;text-decoration:none;font-weight:800}
    a.secondary{background:#f2f0eb}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Academy</span></div>
    <div class="tag">BETA ACCOUNT SETUP</div>
    <h1>Public beta account creation is closed.</h1>
    <p>A Supabase login account alone does not grant Academy access. Access requires an accepted application and authorized enrollment. Existing learners can use the normal login page.</p>
    <nav>
      <a href="/login">Academy login</a>
      <a class="secondary" href="/academy/apply">Apply to the Academy</a>
    </nav>
  </main>
</body>
</html>
