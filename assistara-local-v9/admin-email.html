<div class="toolRoot" id="toolRoot"><div class="shell" style="padding-top:14px;padding-bottom:60px"><div class="head"><h1>Email Command Center</h1><div class="sub">Sending acceptance is measured; delivery/bounces from webhooks; opens/clicks first-party.</div><div class="controls"><select class="btn" id="range"></select><button class="btn" id="refresh">Refresh</button></div></div><div class="tabs" id="tabs"></div><div id="view"></div></div></div></main></div>
<script>
const API="https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-email";const token=(()=>{try{return localStorage.getItem("assistara_admin_token")||sessionStorage.getItem("assistara_admin_token")||"";}catch{return"";}})();const $=(x)=>document.getElementById(x);const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));if(!token)location.href="/admin";
async function req(action,p={}){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({action,...p})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Request failed");return j;}
function toast(s){const t=$("toast");t.textContent=s;t.className="toast show";setTimeout(()=>t.className="toast",2200);}
const n=(v)=>(v===null||v===undefined||Number.isNaN(v)?"Unavailable":Number(v).toLocaleString());const dt=(v)=>(v?new Date(v).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}):"—");const dayKey=(v)=>(v?new Date(v).toISOString().slice(0,10):"");
const state={tab:"overview",provider:"",campaign:"",live:false,liveTimer:null,since:new Date(Date.now()-300000).toISOString()};
const TABS=[["overview","Overview"],["reminder30","30-Min Reminder"],["campaigns","Campaigns"],["recipients","Recipients"],["providers","Providers"],["activity","Live activity"],["setup","Setup Required"],["acquisition","Acquisition"]];
function rangeSelect(){const sel=$("range");const opts=[["7","Last 7 days"],["30","Last 30 days"],["90","Last 90 days"],["all","All time"]];sel.innerHTML=opts.map(([v,l])=>`<option value="${v}"${v==="30"?" selected":""}>${l}</option>`).join("");}
function rangeParams(){const v=$("range").value;if(v==="all")return{from:"2020-01-01T00:00:00.000Z",to:new Date(Date.now()+86400000).toISOString()};return{from:new Date(Date.now()-Number(v)*86400000).toISOString(),to:new Date().toISOString()};}
function renderTabs(){$("tabs").innerHTML=TABS.map(([id,lab])=>`<button class="btn${state.tab===id?" primary":""}" data-tab="${id}">${lab}</button>`).join("");}
// Shared sidebar state
const SIDEBAR_KEY="assistara_admin_sidebar";function applySidebarState(){try{const c=localStorage.getItem(SIDEBAR_KEY)==="1";$("sidebar").classList.toggle("collapsed",c);}catch{}}applySidebarState();
// Load default view render
document.addEventListener("DOMContentLoaded",()=>{rangeSelect();renderTabs();});
</script>
