<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Dashboard | Assistara Academy</title><link rel="icon" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--line:#dedbd3;--muted:#716b63}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{width:min(1100px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.nav{background:#171717;color:#fff;border-radius:20px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}.brand img{width:36px;height:36px}.logout{border:0;background:#fff;color:#171717;border-radius:999px;padding:10px 15px;font:700 13px "DM Sans";cursor:pointer}.main{padding:54px 0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;color:#7a7369}h1{font-size:clamp(42px,7vw,68px);line-height:1;letter-spacing:-.05em;margin:10px 0 14px}.lead{color:var(--muted);font-size:18px;line-height:1.6;max-width:620px}.empty{margin-top:32px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px}.empty strong{display:block;font-size:20px;margin-bottom:7px}.loading{padding:70px 0;text-align:center;color:var(--muted)}</style></head><body><div class="shell top"><div class="nav"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Academy</span></div><button id="logout" class="logout">Log out</button></div></div><main class="shell"><div id="loading" class="loading">Loading your Academy account...</div><section id="content" class="main" hidden><div class="eyebrow">ACADEMY DASHBOARD</div><h1>Welcome, <span id="name">student</span>.</h1><p class="lead">Your Academy account is active. Lessons and resources will appear here as the program is built out.</p><div class="empty"><strong>Your account is ready.</strong><span>There is nothing you need to do here yet.</span></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script><script>(()=>{const client=supabase.createClient('https://jhmmwleejgidrxavzdlq.supabase.co','sb_publishable_-hXhNTcQ7T2yW0SgVAXSrg_2FaPui1E');client.auth.getSession().then(({data})=>{if(!data.session){location.href='/login';return}const user=data.session.user;document.getElementById('name').textContent=(user.user_metadata?.name||user.email||'student').split(/\s+/)[0];document.getElementById('loading').hidden=true;document.getElementById('content').hidden=false});document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.href='/login'}})();</script></body></html>
