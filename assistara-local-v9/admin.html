<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin | Assistara</title>
    <link rel="icon" href="/assistara-logo.svg" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #171717;
        --cream: #f7f5ef;
        --line: #e2ded4;
        --muted: #746e65;
        --yellow: #ffd51f;
        --green: #e8f7ed;
        --greenInk: #1d6a3b;
        --red: #fde9e7;
        --redInk: #8b2825;
        --orange: #fff0db;
      }
      * {
        box-sizing: border-box;
      }
      button,
      input,
      select,
      textarea {
        font-family: "DM Sans", sans-serif;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      .shell {
        width: min(1120px, calc(100% - 28px));
        margin: auto;
      }
      .top {
        margin-top: 16px;
        background: #171717;
        color: #fff;
        border-radius: 18px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }
      .brand img {
        width: 34px;
      }
      .top .actions {
        margin: 0;
        align-items: center;
      }
      .top button {
        min-height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.26);
        background: transparent;
        color: #fff;
        border-radius: 999px;
        padding: 9px 15px;
        font-weight: 800;
        cursor: pointer;
      }
      .top button:hover {
        background: #2c2c2c;
      }
      .top #testPortal {
        border-color: var(--yellow);
        background: var(--yellow);
        color: var(--ink);
      }
      .top #testPortal,
      .top #logout {
        font: 700 13px/1 "DM Sans", sans-serif;
      }
      .top #logout {
        min-height: 40px;
        border-color: #3c3c3c;
        background: #2a2a2a;
        color: #fff;
        border-radius: 999px;
        padding: 9px 15px;
        box-shadow: none;
        transition: background 0.16s ease, border-color 0.16s ease;
      }
      .top #logout:hover,
      .top #logout:focus-visible {
        background: #383838;
        border-color: #515151;
        color: #fff;
        outline: 0;
        transform: none;
      }
      .login {
        max-width: 460px;
        margin: 70px auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 30px;
      }
      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }
      .field input {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .main {
        width: 100%;
        margin-top: 15px;
        background: var(--yellow);
        border: 0;
        border-radius: 10px;
        padding: 13px;
        font-weight: 800;
        cursor: pointer;
        transition: background 0.12s ease, transform 0.08s ease, box-shadow 0.12s ease;
        box-shadow: 0 2px 0 rgba(23, 23, 23, 0.18);
      }
      .main:hover {
        background: #e8bf00;
      }
      .main:active {
        background: #cfa900;
        transform: translateY(2px);
        box-shadow: 0 0 0 rgba(23, 23, 23, 0);
      }
      .main:focus-visible {
        outline: 3px solid rgba(23, 23, 23, 0.22);
        outline-offset: 2px;
      }
      .dash {
        display: none;
        padding: 24px 0 60px;
      }
      .nav {
        margin: 18px 0 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        display: flex;
        gap: 18px;
        padding: 0 14px;
        overflow: auto;
      }
      .nav button {
        border: 0;
        background: none;
        padding: 15px 2px;
        font-weight: 700;
        white-space: nowrap;
      }
      .nav button.active {
        border-bottom: 3px solid #171717;
      }
      .alert {
        background: #fff8dc;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        padding: 17px;
        margin: 14px 0;
      }
      .payment,
      .card,
      .student {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-top: 10px;
      }
      .payment {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .actions button {
        min-height: 38px;
        border: 1px solid #d7d2c8;
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 9px 14px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .actions button:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(23, 23, 23, 0.1);
      }
      .actions .success {
        background: var(--green);
        color: var(--greenInk);
        border-color: #b9e4c8;
      }
      .actions .danger {
        background: var(--red);
        color: var(--redInk);
        border-color: #efb8b3;
      }
      .actions .accept {
        background: var(--yellow);
        border-color: #e6ba00;
      }
      .signupGoal { background:#171717; color:#fff; border-radius:16px; padding:16px; margin:0 0 14px; }
      .signupGoalTop { display:flex; justify-content:space-between; align-items:end; gap:12px; }
      .signupGoalTop b { font-size:24px; }
      .signupGoalTop span { font-size:12px; color:#c9c5bc; }
      .signupGoalTrack { height:12px; background:#353535; border-radius:999px; overflow:hidden; margin-top:11px; }
      .signupGoalFill { height:100%; background:var(--yellow); border-radius:999px; }
      .signupSource { cursor:pointer; }
      .signupSource .studentBody { font-size:12px; }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .stat b {
        display: block;
        font-size: 26px;
      }
      .stat span,
      .sub {
        font-size: 12px;
        color: var(--muted);
      }
      .cards {
        display: grid;
        gap: 10px;
      }
      .cardtop,
      .studentHead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .name {
        font-size: 18px;
        font-weight: 800;
      }
      .badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 6px;
        background: #efede8;
      }
      .badge.paid,
      .badge.active_account {
        background: var(--green);
        color: var(--greenInk);
        border: 1px solid #b9e4c8;
      }
      .badge.pending,
      .badge.payment_pending,
      .badge.waiting_for_payment {
        background: var(--orange);
        color: #8a4b00;
        border: 1px solid #f1c889;
      }
      .detail {
        margin: 12px 0;
        padding: 11px;
        background: #faf9f5;
        border-radius: 10px;
        font-size: 13px;
      }
      .studentHead {
        cursor: pointer;
      }
      .studentBody {
        display: none;
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .student.open .studentBody {
        display: block;
      }
      .empty {
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 14px;
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 13px 16px;
        border-radius: 12px;
        background: #171717;
        color: #fff;
        display: none;
      }
      .toast.show {
        display: block;
      }
      .error {
        color: var(--redInk);
        margin-top: 10px;
      }
      .search {
        margin: 0 0 14px;
        width: 100%;
        max-width: 360px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      @media (max-width: 650px) {
        .top {
          padding: 10px 11px;
          gap: 10px;
        }
        .brand {
          gap: 7px;
          min-width: 0;
          font-size: 13px;
          white-space: nowrap;
        }
        .brand img {
          width: 28px;
        }
        .top .actions {
          margin-left: auto;
          flex-wrap: nowrap;
          gap: 5px;
        }
        .top #testPortal,
        .top #logout {
          min-height: 34px;
          height: 34px;
          padding: 0 10px;
          white-space: nowrap;
          font-size: 11px;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .payment,
        .cardtop {
          display: block;
        }
        .payment .actions {
          margin-top: 10px;
        }
      }
      .quick {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        margin: 0;
      }
      .quick a {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 8px;
        padding: 6px 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .quick svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .quick a:hover {
        background: #fff;
        border-color: var(--line);
      }
      .adminHead {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: end;
        flex-wrap: wrap;
      }
      .callDetail {
        display: none;
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .card.open .callDetail {
        display: block;
      }
      .callDetail input,
      .callDetail select,
      .callDetail textarea {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px;
        font: inherit;
        width: 100%;
        margin-top: 5px;
      }
      .callDetail textarea {
        min-height: 70px;
      }
      .callGrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .callFact,
      .answers {
        background: #faf9f5;
        border-radius: 10px;
        padding: 10px;
        font-size: 12px;
      }
      .answers {
        margin: 10px 0;
      }
      .answers div {
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
      }
      .badge.Booked {
        background: var(--orange);
      }
      .badge.Attended,
      .badge.Qualified,
      .badge.Won {
        background: var(--green);
      }
      .badge.No-show,
      .badge.Lost {
        background: var(--red);
      }
      @media (max-width: 650px) {
        .callGrid {
          grid-template-columns: 1fr;
        }
      }
      .cardMeta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .answersPanel {
        display: block;
      }
      .answerGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 9px;
        align-items: start;
      }
      .answerItem {
        background: #faf9f5;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        min-width: 0;
      }
      .answerItem.wide {
        grid-column: 1 / -1;
      }
      .answerQ {
        margin: 0 0 5px;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.4;
        color: var(--muted);
      }
      .answerA {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .answerA.empty {
        color: #a49c8e;
        font-style: italic;
      }
      .answerNote {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      .notesHint {
        margin: 0 0 7px;
        font-size: 12px;
        color: var(--muted);
      }
      .notesInput {
        display: block;
        width: 100%;
        box-sizing: border-box;
        min-height: 74px;
        resize: vertical;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink);
      }
      .notesInput:focus {
        outline: 2px solid #171717;
        outline-offset: 1px;
        border-color: #171717;
      }
      .notesRow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 9px;
        flex-wrap: wrap;
      }
      .notesSave {
        border: 1px solid #171717;
        background: #171717;
        color: #fff;
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .notesSave:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .notesStatus {
        font-size: 12px;
        color: var(--muted);
      }
      .notesStatus.ok {
        color: #1c7a4a;
        font-weight: 800;
      }
      .notesStatus.bad {
        color: #b4232a;
        font-weight: 800;
      }
      .applicationCardHead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }
      .applicationIdentity { min-width: 0; }
      .applicationIdentity .name,
      .applicationIdentity .sub { overflow-wrap: anywhere; }
      .applicationHeadRight {
        display: flex;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 10px;
        min-width: 0;
      }
      .applicationHeadRight .badges { justify-content: flex-end; }
      .expandArrow {
        flex: 0 0 34px;
        width: 34px;
        height: 34px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        font: 700 18px/1 "DM Sans", sans-serif;
        cursor: pointer;
      }
      .expandArrow:hover,
      .expandArrow:focus-visible { background: #faf9f5; border-color: #a9a398; }
      .applicationActions { margin-top: 10px; }
      .appPanel { display: none; margin-top: 14px; border-top: 1px solid var(--line); }
      .appPanel.open { display: block; }
      .recordSection { padding: 14px 0; border-bottom: 1px solid var(--line); min-width: 0; }
      .recordSection:last-child { border-bottom: 0; padding-bottom: 0; }
      .recordSection h3 {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .06em;
      }
      .recordSection .answerGrid { grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
      .notesEditor { min-width: 0; }
      .recordFacts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
      .recordFacts > div { min-width: 0; border-radius: 10px; background: #faf9f5; padding: 9px 11px; }
      .recordFacts dt { color: var(--muted); font-size: 11px; font-weight: 700; }
      .recordFacts dd { margin: 3px 0 0; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
      .accountState { display: inline-flex; margin: 0; padding: 7px 10px; border-radius: 8px; background: #f5f3ee; font-size: 12px; font-weight: 800; }
      .activityTimeline { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
      .activityTimeline li { display: grid; grid-template-columns: minmax(105px, auto) 1fr; gap: 10px; font-size: 12px; }
      .activityTimeline time { color: var(--muted); }
      .recordEmpty { margin: 0; color: var(--muted); font-size: 12px; }
      @media (max-width: 650px) {
        .cardMeta {
          justify-content: flex-start;
          margin-top: 10px;
        }
        .answerGrid {
          grid-template-columns: 1fr;
        }
        .applicationCardHead { align-items: flex-start; }
        .applicationHeadRight { gap: 7px; }
        .applicationHeadRight .badges { max-width: 220px; }
        .recordSection .answerGrid { grid-template-columns: 1fr; }
        .recordFacts { grid-template-columns: 1fr; }
        .activityTimeline li { grid-template-columns: 92px minmax(0, 1fr); gap: 7px; }
      }
    </style>

</head>
  <body>
    <div class="shell">
      <div class="top">
        <div class="brand">
          <img src="/assistara-logo.svg" /><span>Assistara Admin</span>
        </div>
        <div class="actions">
          <button id="testPortal" style="display: none">
            Test student portal
          </button>
          <button id="logout" style="display: none">Log out</button>
        </div>
      </div>
      <section id="login" class="login">
        <h1>Admin login</h1>
        <p>Manage Assistara operations.</p>
        <label class="field"
          ><span>Username</span><input id="username" value="admin" /></label
        ><label class="field"
          ><span>Password</span><input id="password" type="password" /></label
        ><button id="loginBtn" class="main">Log in</button>
        <div id="loginError" class="error"></div>
      </section>
      <section id="dash" class="dash">
        <div class="adminHead">
          <div>
            <h1>Admin</h1>
            <div class="sub">
              Applications, students, acquisition tracking and B2B discovery calls.
            </div>
          </div>
          <div class="quick">
            <a href="https://mail.nameslink.com/" target="_blank"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a
            ><a
              href="https://app.clickup.com/1300450000003242/v/s/1300450000016533"
              target="_blank"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 7 7 7 7-7"/><path d="m8 12 4 4 4-4"/><path d="m11 17 1 1 1-1"/></svg>ClickUp</a
            ><a
              href="https://supabase.com/dashboard/project/jhmmwleejgidrxavzdlq"
              target="_blank"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="3"/><path d="M5 5.5v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/><path d="M5 12.5v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Database</a
            ><a
              href="https://drive.google.com/drive/folders/1JoAQPRC9PsPw3ccEgZ7GXRtXt72ahIwQ"
              target="_blank"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5h6l1.8 2H20a1.5 1.5 0 0 1 1.5 1.5v6.5A1.5 1.5 0 0 1 20 19H4a1.5 1.5 0 0 1-1.5-1.5V9A1.5 1.5 0 0 1 4 7.5Z"/><path d="M3 10h18"/></svg>Drive</a
            >
          </div>
        </div>
        <div class="nav">
          <button class="active" data-tab="applicants">
            Applications <span id="payCount"></span></button
          ><button data-tab="students">Students</button
          ><button data-tab="webinar">Webinar Signups</button
          ><button type="button" onclick="location.href='/admin/acquisition'">Acquisition Tracker</button
          ><button data-tab="b2b">B2B</button>
        </div>
        <div id="pendingBox"></div>
        <input id="search" class="search" placeholder="Search..." />
        <div id="signupGoal"></div><div id="stats" class="stats"></div>
        <div id="cards" class="cards"></div>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script>
      const LOGIN =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api",
        API =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications",
        ACC =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-accounts",
        PAY =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-gcash-payment",
        DEL =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-delete-application",
        ONBOARD =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-send-onboarding",
        ANSWERS = "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api",
        NOTES = "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api";
      let token = sessionStorage.getItem("assistara_admin_token") || "",
        apps = [],
        web = [],
        b2b = [],
        accounts = [],
        acquisitionLinks = [],
        tab = "applicants";
      // Every application card keeps its own expand state so reviewing one
      // applicant never opens or closes another.
      const openApps = new Set(),
        answerCache = new Map(),
        answerQueue = new Set(),
        // Reviewer notes are internal only and live behind their own
        // admin-only endpoint, never inside the seven-question answers panel.
        noteCache = new Map(),
        noteQueue = new Set(),
        dirtyNotes = new Set(),
        noteDrafts = new Map(),
        SAFE_APP_ID = /^[A-Za-z0-9_-]{1,64}$/;

        const payment = String(x.payment_status || "not_requested").toLowerCase();
        if (x.suspended_at) return "SUSPENDED";
        if (status === "onboarded" && payment === "paid" && x.onboarding_completed_at && x.auth_user_id) return "ACTIVE LEARNER";
        if (payment === "paid") return "PAID — ACCOUNT SETUP PENDING";
        if (payment === "pending") return "PAYMENT PENDING";
        if (currentDecision(x) === "accepted") return "WAITING FOR PAYMENT";
        return "NOT ELIGIBLE YET";
      }
      function activityTimeline(x) {
        const events = [
          [x.created_at, "Applied"],
          [x.reviewed_at, "Reviewed"],
          [x.accepted_at, "Accepted"],
          [x.declined_at, "Declined"],
          [x.payment_requested_at, "Payment requested"],
          [x.gcash_submitted_at, "GCash payment submitted"],
          [x.gcash_reviewed_at, "GCash payment reviewed"],
          [x.paid_at, "Payment received"],
          [x.onboarding_completed_at, "Account setup completed"],
        ].filter(([date]) => date && Number.isFinite(Date.parse(date))).sort((a, b) => Date.parse(a[0]) - Date.parse(b[0]));
        if (!events.length) return '<p class="recordEmpty">No dated activity recorded.</p>';
        return `<ol class="activityTimeline">${events.map(([date, label]) => `<li><time datetime="${esc(date)}">${esc(formatDate(date))}</time><span>${esc(label)}</span></li>`).join("")}</ol>`;
      }
      function formatDate(value) {
        if (!value) return "";
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "" : date.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
      }
      function studentCard(x) {
        const suspended = !!x.suspended_at;
        return `<div class="student" id="student-${x.id}"><div class="studentHead" onclick="toggleStudent('${x.id}')"><div class="name">${esc(x.name || "Student")}</div><span>⌄</span></div><div class="studentBody"><div class="sub">${esc(x.email || "")}</div><div class="detail"><b>Account:</b> ${suspended ? "Suspended" : "Active"}${x.receipt_number ? `<br><b>Receipt:</b> ${esc(x.receipt_number)}` : ""}</div><div class="actions"><button onclick="resetPw('${x.id}')">Password reset</button><button onclick="suspend('${x.id}',${suspended ? "false" : "true"})">${suspended ? "Reactivate" : "Suspend"} account</button><button class="danger" onclick="deleteAccount('${x.id}')">Delete account</button></div></div></div>`;
      }
      function render() {
        drawPending();
        if (tab === "applicants") {
          const a = activeApps().filter(match);
          stat([
            [a.length, "Applications"],
            [
              a.filter((x) => currentDecision(x) === "accepted" && String(x.payment_status || "not_requested").toLowerCase() !== "paid").length,
              "Waiting for payment",
            ],
            [
              a.filter((x) => String(x.payment_status || "").toLowerCase() === "paid" && !(String(x.status || "").toLowerCase() === "onboarded" && x.onboarding_completed_at && x.auth_user_id && !x.suspended_at)).length,
              "Paid",
            ],
            [
              a.filter((x) => String(x.status || "").toLowerCase() === "onboarded" && String(x.payment_status || "").toLowerCase() === "paid" && x.onboarding_completed_at && x.auth_user_id && !x.suspended_at).length,
              "Active accounts",
            ],
          ]);
          $("cards").innerHTML = a.length
            ? a.map(appCard).join("")
            : '<div class="empty">No applications found.</div>';
          hydrateOpenApps();
          hydrateOpenNotes();
          return;
        }
        if (tab === "students") {
          const studentIds=new Set(accounts.map(a=>String(a.id||'')));const s = apps.filter((x) => x.auth_user_id && studentIds.has(String(x.auth_user_id))).filter(match);
          stat([
            [s.length, "Students"],
            [s.filter((x) => !x.suspended_at).length, "Active"],
            [s.filter((x) => x.suspended_at).length, "Suspended"],
            [s.filter((x) => x.onboarding_completed_at).length, "Onboarded"],
          ]);
          $("cards").innerHTML = s.length
            ? s.map(studentCard).join("")
            : '<div class="empty">No students yet.</div>';
          return;
        }
        if (tab === "webinar") {
          const visibleWeb=web.filter(x=>!/^diag(?:nostic)?[-_]/i.test(String(x.email||""))&&!/diagnostic/i.test(String(x.name||""))&&!/diagnostic/i.test(String(x.source||""))),goal=400,pct=Math.min(100,Math.round((visibleWeb.length/goal)*100));
          $("signupGoal").innerHTML=`<div class="signupGoal"><div class="signupGoalTop"><div><b>${visibleWeb.length} / ${goal}</b><div><span>Webinar signup goal</span></div></div><b>${pct}%</b></div><div class="signupGoalTrack"><div class="signupGoalFill" style="width:${pct}%"></div></div></div>`;
          stat([
            [visibleWeb.length, "Registered"],
            [visibleWeb.filter((x) => x.attended).length, "Attended"],
            [visibleWeb.filter((x) => x.application_id).length, "Applied"],
            [visibleWeb.filter((x) => x.purchased).length, "Purchased"],
          ]);
          const w = visibleWeb.filter(match);
          const sourceFor=x=>{if(!x.tracking_token)return "Unknown / untracked";const t=String(x.tracking_token).trim();const link=acquisitionLinks.find(l=>String(l.token||"").trim()===t||String(l.id||"").trim()===t);return link?(link.channel+" → "+link.placement+(link.label?" · "+link.label:"")):"Unknown / untracked"};
          $("cards").innerHTML = w.length
            ? w.map((x,i) => {const source=sourceFor(x);return `<div class="student signupSource" id="signup-${i}"><div class="studentHead" onclick="document.getElementById('signup-${i}').classList.toggle('open')"><div><div class="name">${esc(x.name || "Website signup")}</div><div class="sub">${esc(source)}</div></div><span>⌄</span></div><div class="studentBody"><div class="detail"><b>Email:</b> ${esc(x.email||"—")}${x.phone?"<br><b>Phone:</b> "+esc(x.phone):""}<br><b>Registered:</b> ${x.created_at?new Date(x.created_at).toLocaleString():"—"}<br><b>Source:</b> ${esc(source)}</div><div class="actions"><button class="danger" onclick="event.stopPropagation();deleteWebinarSignup('${x.id}',decodeURIComponent('${encodeURIComponent(String(x.name||"Website signup"))}'),decodeURIComponent('${encodeURIComponent(String(x.email||""))}'))">Delete signup</button></div></div></div>`}).join("")
            : '<div class="empty">No webinar signups yet.</div>';
          return;
        }
        $("signupGoal").innerHTML="";
        stat([
          [b2b.length, "Leads"],
          [b2b.filter((x) => x.status === "responded").length, "Responded"],
          [b2b.filter((x) => x.status === "qualified").length, "Qualified"],
          [b2b.filter((x) => x.status === "won").length, "Won"],
        ]);
        $("cards").innerHTML =
          b2b
            .filter(match)
            .map(
              (x) =>
                `<div class="card"><div class="name">${esc(x.company || x.name || "B2B lead")}</div><div class="sub">${esc(x.name)} · ${esc(x.email)}</div>${badge(x.status || "new")}</div>`,
            )
            .join("") || '<div class="empty">No B2B leads.</div>';
      }
      async function load() {
        const d = await req("list");
        apps = d.applications || [];
        web = d.signups || [];
        b2b = d.b2b || [];
        try { const a=await fetch("https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-acquisition",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({action:"list"})}); const aj=await a.json(); acquisitionLinks=a.ok?(aj.links||[]):[] } catch { acquisitionLinks=[] }
        try {
          accounts = (await req("list", {}, ACC)).accounts || [];
        } catch {
          accounts = [];
        }
        render();
      }
      window.toggleStudent = (id) => {
        const e = $("student-" + id);
        if (e) e.classList.toggle("open");
      };
      // One record expander per application; all record sections live inside it.
      $("cards").addEventListener("click", (event) => {
        if (!(event.target instanceof Element)) return;
        const saver = event.target.closest("[data-save-note]");
        if (saver) {
          event.preventDefault();
          event.stopPropagation();
          window.saveAppNote(saver.dataset.saveNote, saver);
          return;
        }
        const expander = event.target.closest("[data-toggle-app]");
        if (expander) {
          event.preventDefault();
          window.toggleApp(expander.dataset.toggleApp);
        }
      });
      // Marks a note as unsaved so a rebuild of the card list cannot discard
      // what the reviewer has typed.
      $("cards").addEventListener("input", (event) => {
        if (!(event.target instanceof Element)) return;
        const input = event.target.closest(".notesInput");
        if (!input) return;
        const id = input.id.replace(/^note-/, "");
        noteDrafts.set(id, input.value);
        dirtyNotes.add(id);
        setNoteStatus(id, "Unsaved changes", "");
      });
      $("cards").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " " && event.key !== "Spacebar") return;
        if (!(event.target instanceof Element)) return;
        // Let the textarea keep Enter for newlines.
        if (event.target.closest(".notesInput")) return;
        const expander = event.target.closest("[data-toggle-app]");
        if (!expander) return;
        event.preventDefault();
        window.toggleApp(expander.dataset.toggleApp);
      });
      window.approvePay = async (id) => {
        if (!confirm("Approve this GCash payment as ₱6,900 PAID?")) return;
        try {
          const d = await req("approve", { id }, PAY);
          toast(
            d.email_sent
              ? "Payment approved + applicant emailed"
              : "Payment approved",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.rejectPay = async (id) => {
        if (
          !confirm(
            "Could not verify this payment? The applicant will be asked for a screenshot.",
          )
        )
          return;
        try {
          const d = await req("reject", { id }, PAY);
          toast(
            d.email_sent
              ? "Screenshot requested by email"
              : "Screenshot requested",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.noResponsePay = async (id) => {
        if (
          !confirm(
            "Send the one final follow-up email? After this, this payment leaves the action-required box and is marked Unverified payment.",
          )
        )
          return;
        try {
          const d = await req("no_response", { id }, PAY);
          toast(
            d.email_sent
              ? "Final follow-up sent. Payment archived as unverified."
              : "Payment archived as unverified.",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.decision = async (id, d, resend = false, name = "Unknown", email = "No email") => {
        try {
          const action = resend
            ? "Resend the acceptance/payment email?"
            : d === "accepted"
              ? "Accept this application and send the acceptance email?"
              : "Decline this application and send the decline email?";
          if (!confirm(`${action}\n\nName: ${name}\nEmail: ${email}`)) return;
          await req(resend ? "resend_decision" : "decision", {
            id,
            decision: d,
          });
          toast(
            resend
              ? "Email resent"
              : d === "declined"
                ? "Declined"
                : "Accepted + email sent",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.onboard = async (id) => {
        try {
          await req("", { id }, ONBOARD);
          toast("Account setup email sent");
        } catch (e) {
          alert(e.message);
        }
      };
      window.resetPw = async (id) => {
        try {
          await req("send_password_reset", { id });
          toast("Password reset sent");
        } catch (e) {
          alert(e.message);
        }
      };
      window.suspend = async (id, suspended) => {
        try {
          await req("suspend_account", { id, suspended });
          toast(suspended ? "Account suspended" : "Account reactivated");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteAccount = async (id) => {
        if (!confirm("Delete this Academy login account?")) return;
        try {
          await req("delete_account", { id }, ACC);
          toast("Account deleted");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteWebinarSignup = async (id, name, email) => {
        if (!confirm(`Are you sure you want to delete ${name} - ${email}?`)) return;
        try {
          await req("delete_signup", { id });
          toast("Webinar signup deleted");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteApplication = async (id, isTest = false, name = "Unknown", email = "No email") => {
        let confirmation = "";
        const who = `${name} (${email})`;
        if (isTest) {
          if (!confirm(`Are you sure you want to delete this TEST application?\n\nName: ${name}\nEmail: ${email}\n\nThis also permanently deletes its test payment records.`)) return;
          confirmation = prompt(`Final confirmation for ${who}\n\nType DELETE TEST to continue.`) || "";
          if (confirmation !== "DELETE TEST") return;
        } else if (!confirm(`Are you sure you want to delete this application?\n\nName: ${name}\nEmail: ${email}\n\nThis cannot be undone.`)) return;
        try {
          await req("", { id, confirmation }, DEL);
          toast(isTest ? "Test record deleted" : "Application deleted");
          await load();
        } catch (e) { alert(e.message); }
      };
      document.querySelectorAll(".nav button[data-tab]").forEach(
        (b) =>
          (b.onclick = () => {
            tab = b.dataset.tab;
            document
              .querySelectorAll(".nav button")
              .forEach((x) => x.classList.toggle("active", x === b));
            render();
          }),
      );
      $("search").oninput = render;
      $("loginBtn").onclick = async () => {
        try {
          const d = await req(
            "login",
            { username: $("username").value, password: $("password").value },
            LOGIN,
          );
          token = d.token;
          sessionStorage.setItem("assistara_admin_token", token);
          show();
          await load();
        } catch (e) {
          $("loginError").textContent = e.message;
        }
      };
      $("logout").onclick = async () => {
        sessionStorage.removeItem("assistara_admin_token");
        try { await syncTestPortalCookie("logout"); } catch {}
        location.reload();
      };
      $("testPortal").onclick = async () => {
        try {
          await syncTestPortalCookie();
          location.href = "/academy/test-portal";
        } catch (e) {
          alert(e.message);
        }
      };
      function show() {
        $("login").style.display = "none";
        $("dash").style.display = "block";
        $("logout").style.display = "block";
        $("testPortal").style.display = "block";
      }
      if (token) {
        show();
        load().catch((e) => alert(e.message));
      }
      (() => {
        const B =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-b2b-calls";
        let calls = [];
        const previousLoad = load,
          previousRender = render;
        function card(x) {
          const a = Object.entries(x.qualifying_answers || {})
            .map(
              ([k, v]) =>
                "<div><b>" +
                esc((v && v.label) || k) +
                "</b><br>" +
                esc(
                  typeof v === "object"
                    ? (v.value ?? v.answer ?? JSON.stringify(v))
                    : v,
                ) +
                "</div>",
            )
            .join("");
          return (
            '<div class="card" id="call-' +
            x.id +
            '"><div class="cardtop"><div><div class="name">' +
            esc(x.business_name || x.contact_name) +
            '</div><div class="sub">' +
            esc(x.contact_name) +
            " · " +
            esc(x.contact_email) +
            "<br>" +
            esc(
              x.call_start_at
                ? new Date(x.call_start_at).toLocaleString()
                : "Time not supplied",
            ) +
            '</div></div><div class="badges">' +
            badge(x.pipeline_status) +
            badge(x.cal_booking_status) +
            '</div></div><div class="actions"><button onclick="toggleCall(\'' +
            x.id +
            '\')">Open prospect</button></div><div class="callDetail"><div class="callGrid"><div class="callFact"><b>Phone</b><br>' +
            esc(x.contact_phone || "Not supplied") +
            '</div><div class="callFact"><b>Cal.com booking</b><br>' +
            esc(x.cal_booking_id) +
            '</div></div><div class="answers"><b>Qualifying answers</b>' +
            a +
            '</div><div class="callGrid"><label>Pipeline status<select id="s-' +
            x.id +
            '">' +
            [
              "Booked",
              "Attended",
              "No-show",
              "Qualified",
              "Proposal",
              "Won",
              "Lost",
            ]
              .map(
                (s) =>
                  "<option " +
                  (x.pipeline_status === s ? "selected" : "") +
                  ">" +
                  s +
                  "</option>",
              )
              .join("") +
            '</select></label><label>Follow-up date<input id="f-' +
            x.id +
            '" type="datetime-local" value="' +
            (x.follow_up_at ? x.follow_up_at.slice(0, 16) : "") +
            '"></label><label>Deal value<input id="v-' +
            x.id +
            '" type="number" value="' +
            esc(x.deal_value ?? "") +
            '"></label><label>Lost reason<input id="l-' +
            x.id +
            '" value="' +
            esc(x.lost_reason || "") +
            '"></label></div><label>Internal notes<textarea id="n-' +
            x.id +
            '">' +
            esc(x.internal_notes || "") +
            '</textarea></label><div class="actions"><button class="accept" onclick="saveCall(\'' +
            x.id +
            "')\">Save changes</button></div></div></div>"
          );
        }
        load = async () => {
          await previousLoad();
          try {
            calls = (await req("list", {}, B)).calls || [];
          } catch {
            calls = [];
          }
          if (tab === "b2b") render();
        };
        render = () => {
          if (tab !== "b2b") return previousRender();
          $("payCount").textContent = "";
          $("pendingBox").innerHTML = "";
          const list = calls.filter(match),
            up = list.filter(
              (x) =>
                x.cal_booking_status === "scheduled" &&
                x.call_start_at &&
                new Date(x.call_start_at) > new Date(),
            );
          stat([
            [list.length, "Discovery calls"],
            [up.length, "Upcoming"],
            [
              list.filter((x) => x.pipeline_status === "Qualified").length,
              "Qualified",
            ],
            [list.filter((x) => x.pipeline_status === "Won").length, "Won"],
          ]);
          $("cards").innerHTML =
            list.map(card).join("") ||
            '<div class="empty">No discovery calls yet. Your first Cal.com booking will appear here automatically.</div>';
        };
        window.toggleCall = (id) => $("call-" + id).classList.toggle("open");
        window.saveCall = async (id) => {
          try {
            await req(
              "update",
              {
                id,
                pipeline_status: $("s-" + id).value,
                follow_up_at: $("f-" + id).value
                  ? new Date($("f-" + id).value).toISOString()
                  : "",
                deal_value: $("v-" + id).value,
                internal_notes: $("n-" + id).value,
                lost_reason: $("l-" + id).value,
              },
              B,
            );
            toast("Discovery call updated");
            await load();
          } catch (e) {
            alert(e.message);
          }
        };
      })();
    </script>
  </body>
</html>
