<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin | Assistara</title>
    <link rel="icon" href="/assistara-logo.svg" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #171717;
        --cream: #f7f5ef;
        --line: #e2ded4;
        --muted: #746e65;
        --yellow: #ffd51f;
        --green: #e8f7ed;
        --greenInk: #1d6a3b;
        --red: #fde9e7;
        --redInk: #8b2825;
        --orange: #fff0db;
      }
      * {
        box-sizing: border-box;
      }
      button,
      input,
      select,
      textarea {
        font-family: "DM Sans", sans-serif;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", sans-serif;
      }
      .shell {
        width: min(1120px, calc(100% - 28px));
        margin: auto;
      }
      .top {
        margin-top: 16px;
        background: #171717;
        color: #fff;
        border-radius: 18px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }
      .brand img {
        width: 34px;
      }
      .top .actions {
        margin: 0;
        align-items: center;
      }
      .top button {
        min-height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.26);
        background: transparent;
        color: #fff;
        border-radius: 999px;
        padding: 9px 15px;
        font-weight: 800;
        cursor: pointer;
      }
      .top button:hover {
        background: #2c2c2c;
      }
      .top #testPortal {
        border-color: var(--yellow);
        background: var(--yellow);
        color: var(--ink);
      }
      .top #testPortal,
      .top #logout {
        font: 700 13px/1 "DM Sans", sans-serif;
      }
      .top #logout {
        min-height: 40px;
        border-color: #3c3c3c;
        background: #2a2a2a;
        color: #fff;
        border-radius: 999px;
        padding: 9px 15px;
        box-shadow: none;
        transition: background 0.16s ease, border-color 0.16s ease;
      }
      .top #logout:hover,
      .top #logout:focus-visible {
        background: #383838;
        border-color: #515151;
        color: #fff;
        outline: 0;
        transform: none;
      }
      .login {
        max-width: 460px;
        margin: 70px auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 30px;
      }
      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }
      .field input {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .main {
        width: 100%;
        margin-top: 15px;
        background: var(--yellow);
        border: 0;
        border-radius: 10px;
        padding: 13px;
        font-weight: 800;
      }
      .dash {
        display: none;
        padding: 24px 0 60px;
      }
      .nav {
        margin: 18px 0 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        display: flex;
        gap: 18px;
        padding: 0 14px;
        overflow: auto;
      }
      .nav button {
        border: 0;
        background: none;
        padding: 15px 2px;
        font-weight: 700;
        white-space: nowrap;
      }
      .nav button.active {
        border-bottom: 3px solid #171717;
      }
      .alert {
        background: #fff8dc;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        padding: 17px;
        margin: 14px 0;
      }
      .payment,
      .card,
      .student {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-top: 10px;
      }
      .payment {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .actions button {
        min-height: 38px;
        border: 1px solid #d7d2c8;
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 9px 14px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .actions button:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(23, 23, 23, 0.1);
      }
      .actions .success {
        background: var(--green);
        color: var(--greenInk);
        border-color: #b9e4c8;
      }
      .actions .danger {
        background: var(--red);
        color: var(--redInk);
        border-color: #efb8b3;
      }
      .actions .accept {
        background: var(--yellow);
        border-color: #e6ba00;
      }
      .signupGoal { background:#171717; color:#fff; border-radius:16px; padding:16px; margin:0 0 14px; }
      .signupGoalTop { display:flex; justify-content:space-between; align-items:end; gap:12px; }
      .signupGoalTop b { font-size:24px; }
      .signupGoalTop span { font-size:12px; color:#c9c5bc; }
      .signupGoalTrack { height:12px; background:#353535; border-radius:999px; overflow:hidden; margin-top:11px; }
      .signupGoalFill { height:100%; background:var(--yellow); border-radius:999px; }
      .signupSource { cursor:pointer; }
      .signupSource .studentBody { font-size:12px; }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .stat b {
        display: block;
        font-size: 26px;
      }
      .stat span,
      .sub {
        font-size: 12px;
        color: var(--muted);
      }
      .cards {
        display: grid;
        gap: 10px;
      }
      .cardtop,
      .studentHead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .name {
        font-size: 18px;
        font-weight: 800;
      }
      .badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 6px;
        background: #efede8;
      }
      .badge.paid,
      .badge.accepted {
        background: var(--green);
        color: var(--greenInk);
        border: 1px solid #b9e4c8;
      }
      .badge.pending,
      .badge.payment_pending {
        background: var(--orange);
        color: #8a4b00;
        border: 1px solid #f1c889;
      }
      .detail {
        margin: 12px 0;
        padding: 11px;
        background: #faf9f5;
        border-radius: 10px;
        font-size: 13px;
      }
      .studentHead {
        cursor: pointer;
      }
      .studentBody {
        display: none;
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .student.open .studentBody {
        display: block;
      }
      .empty {
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 14px;
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 13px 16px;
        border-radius: 12px;
        background: #171717;
        color: #fff;
        display: none;
      }
      .toast.show {
        display: block;
      }
      .error {
        color: var(--redInk);
        margin-top: 10px;
      }
      .search {
        margin: 0 0 14px;
        width: 100%;
        max-width: 360px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      @media (max-width: 650px) {
        .top {
          padding: 10px 11px;
          gap: 10px;
        }
        .brand {
          gap: 7px;
          min-width: 0;
          font-size: 13px;
          white-space: nowrap;
        }
        .brand img {
          width: 28px;
        }
        .top .actions {
          margin-left: auto;
          flex-wrap: nowrap;
          gap: 5px;
        }
        .top #testPortal,
        .top #logout {
          min-height: 34px;
          height: 34px;
          padding: 0 10px;
          white-space: nowrap;
          font-size: 11px;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .payment,
        .cardtop {
          display: block;
        }
        .payment .actions {
          margin-top: 10px;
        }
      }
      .quick {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        margin: 0;
      }
      .quick a {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 8px;
        padding: 6px 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .quick svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .quick a:hover {
        background: #fff;
        border-color: var(--line);
      }
      .adminHead {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: end;
        flex-wrap: wrap;
      }
      .callDetail {
        display: none;
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .card.open .callDetail {
        display: block;
      }
      .callDetail input,
      .callDetail select,
      .callDetail textarea {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px;
        font: inherit;
        width: 100%;
        margin-top: 5px;
      }
      .callDetail textarea {
        min-height: 70px;
      }
      .callGrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .callFact,
      .answers {
        background: #faf9f5;
        border-radius: 10px;
        padding: 10px;
        font-size: 12px;
      }
      .answers {
        margin: 10px 0;
      }
      .answers div {
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
      }
      .badge.Booked {
        background: var(--orange);
      }
      .badge.Attended,
      .badge.Qualified,
      .badge.Won {
        background: var(--green);
      }
      .badge.No-show,
      .badge.Lost {
        background: var(--red);
      }
      @media (max-width: 650px) {
        .callGrid {
          grid-template-columns: 1fr;
        }
      }
      .cardMeta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .answersHead {
        cursor: pointer;
        align-items: flex-start;
      }
      .answersHead:hover .name {
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }
      .answersToggle {
        min-height: 30px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
        user-select: none;
        transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      }
      .answersHead:hover .answersToggle {
        background: #faf9f5;
        border-color: #c9c3b6;
      }
      .answersToggle .chev {
        display: inline-block;
        font-size: 12px;
        line-height: 1;
        transition: transform 0.15s ease;
      }
      .card.open .answersToggle {
        border-color: #171717;
        background: #171717;
        color: #fff;
      }
      .card.open .answersToggle .chev {
        transform: rotate(180deg);
      }
      .answersPanel {
        display: none;
        margin-top: 14px;
        border-top: 1px solid var(--line);
        padding-top: 14px;
      }
      .card.open .answersPanel {
        display: block;
      }
      .answersTitle {
        margin: 0 0 9px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .answersTitle:not(:first-child) {
        margin-top: 16px;
      }
      .answerGrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 9px;
        align-items: start;
      }
      .answerItem {
        background: #faf9f5;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 11px 12px;
        min-width: 0;
      }
      .answerItem.wide {
        grid-column: 1 / -1;
      }
      .answerQ {
        margin: 0 0 5px;
        font-size: 12px;
        font-weight: 800;
        line-height: 1.4;
        color: var(--muted);
      }
      .answerA {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        word-break: break-word;
      }
      .answerA.empty {
        color: #a49c8e;
        font-style: italic;
      }
      .answerNote {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
      }
      /* Internal reviewer notes. Same visual language as the answers toggle,
         deliberately quieter so it never competes with applicant answers. */
      .notesBar {
        margin-top: 10px;
        border-top: 1px solid var(--line);
        padding-top: 10px;
      }
      .notesHead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 800;
        color: var(--muted);
        user-select: none;
      }
      .notesToggle {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 28px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 5px 11px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
        transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
      }
      .notesHead:hover .notesToggle {
        background: #faf9f5;
        border-color: #c9c3b6;
      }
      .notesToggle .chev {
        display: inline-block;
        font-size: 12px;
        line-height: 1;
        transition: transform 0.15s ease;
      }
      .notesHead[aria-expanded="true"] .notesToggle {
        border-color: #171717;
        background: #171717;
        color: #fff;
      }
      .notesHead[aria-expanded="true"] .chev {
        transform: rotate(180deg);
      }
      .notesPanel {
        display: none;
        margin-top: 11px;
      }
      .notesPanel.open {
        display: block;
      }
      .notesHint {
        margin: 0 0 7px;
        font-size: 12px;
        color: var(--muted);
      }
      .notesInput {
        display: block;
        width: 100%;
        box-sizing: border-box;
        min-height: 74px;
        resize: vertical;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        font-size: 13px;
        line-height: 1.55;
        color: var(--ink);
      }
      .notesInput:focus {
        outline: 2px solid #171717;
        outline-offset: 1px;
        border-color: #171717;
      }
      .notesRow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 9px;
        flex-wrap: wrap;
      }
      .notesSave {
        border: 1px solid #171717;
        background: #171717;
        color: #fff;
        border-radius: 999px;
        padding: 7px 14px;
        font-size: 12px;
        font-weight: 800;
        cursor: pointer;
      }
      .notesSave:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .notesStatus {
        font-size: 12px;
        color: var(--muted);
      }
      .notesStatus.ok {
        color: #1c7a4a;
        font-weight: 800;
      }
      .notesStatus.bad {
        color: #b4232a;
        font-weight: 800;
      }
      @media (max-width: 650px) {
        .cardMeta {
          justify-content: flex-start;
          margin-top: 10px;
        }
        .answerGrid {
          grid-template-columns: 1fr;
        }
      }
    </style>

</head>
  <body>

          <img src="/assistara-logo.svg" /><span>Assistara Admin</span>

    <div id="toast" class="toast"></div>
    <script>
      const LOGIN =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api",
        API =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications",
        ACC =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-accounts",
        PAY =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-gcash-payment",
        DEL =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-delete-application",
        ONBOARD =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-send-onboarding",
        ANSWERS = "/api/admin-application-answers",
        NOTES = "/api/admin-application-notes";
      let token = sessionStorage.getItem("assistara_admin_token") || "",
        apps = [],
        web = [],
        b2b = [],
        accounts = [],
        acquisitionLinks = [],
        tab = "applicants";
      // Every application card keeps its own expand state so reviewing one
      // applicant never opens or closes another.
      const openApps = new Set(),
        answerCache = new Map(),
        answerQueue = new Set(),
        // Reviewer notes are internal only and live behind their own
        // admin-only endpoint, never inside the seven-question answers panel.
        openNotes = new Set(),
        noteCache = new Map(),
        noteQueue = new Set(),
        dirtyNotes = new Set(),
        noteDrafts = new Map(),
        SAFE_APP_ID = /^[A-Za-z0-9_-]{1,64}$/;
      // The canonical application questions, in form order, as sent by the
      // answers endpoint. Filled in on the first successful load.
      let answerSchema = [];
      const $ = (x) => document.getElementById(x),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({

        const trigger = event.target.closest("[data-toggle-answers]");
        if (!trigger) return;
        event.preventDefault();
        window.toggleAppAnswers(trigger.dataset.toggleAnswers);
      });
      // Marks a note as unsaved so a rebuild of the card list cannot discard
      // what the reviewer has typed.
      $("cards").addEventListener("input", (event) => {
        if (!(event.target instanceof Element)) return;
        const input = event.target.closest(".notesInput");
        if (!input) return;
        const id = input.id.replace(/^note-/, "");
        noteDrafts.set(id, input.value);
        dirtyNotes.add(id);
        setNoteStatus(id, "Unsaved changes", "");
      });
      $("cards").addEventListener("keydown", (event) => {
        if (event.key !== "Enter" && event.key !== " " && event.key !== "Spacebar") return;
        if (!(event.target instanceof Element)) return;
        // Let the textarea keep Enter for newlines.
        if (event.target.closest(".notesInput")) return;
        const notes = event.target.closest("[data-toggle-notes]");
        if (notes) {
          event.preventDefault();
          window.toggleAppNotes(notes.dataset.toggleNotes);
          return;
        }
        const trigger = event.target.closest("[data-toggle-answers]");
        if (!trigger) return;
        event.preventDefault();
        window.toggleAppAnswers(trigger.dataset.toggleAnswers);
      });
      window.approvePay = async (id) => {
        if (!confirm("Approve this GCash payment as ₱6,900 PAID?")) return;
        try {
          const d = await req("approve", { id }, PAY);
          toast(
            d.email_sent
              ? "Payment approved + applicant emailed"
              : "Payment approved",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.rejectPay = async (id) => {
        if (
          !confirm(
            "Could not verify this payment? The applicant will be asked for a screenshot.",
          )
        )
          return;
        try {
          const d = await req("reject", { id }, PAY);
          toast(
            d.email_sent
              ? "Screenshot requested by email"
              : "Screenshot requested",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.noResponsePay = async (id) => {
        if (
          !confirm(
            "Send the one final follow-up email? After this, this payment leaves the action-required box and is marked Unverified payment.",
          )
        )
          return;
        try {
          const d = await req("no_response", { id }, PAY);
          toast(
            d.email_sent
              ? "Final follow-up sent. Payment archived as unverified."
              : "Payment archived as unverified.",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.decision = async (id, d, resend = false) => {
        try {
          if (
            !resend &&
            !confirm(
              d === "accepted"
                ? "Accept and send enrollment email?"
                : "Decline and send email?",
            )
          )
            return;
          await req(resend ? "resend_decision" : "decision", {
            id,
            decision: d,
          });
          toast(
            resend
              ? "Email resent"
              : d === "declined"
                ? "Declined"
                : "Accepted + email sent",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.onboard = async (id) => {
        try {
          await req("", { id }, ONBOARD);
          toast("Account setup email sent");
        } catch (e) {
          alert(e.message);
        }
      };
      window.resetPw = async (id) => {
        try {
          await req("send_password_reset", { id });
          toast("Password reset sent");
        } catch (e) {
          alert(e.message);
        }
      };
      window.suspend = async (id, suspended) => {
        try {
          await req("suspend_account", { id, suspended });
          toast(suspended ? "Account suspended" : "Account reactivated");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteAccount = async (id) => {
        if (!confirm("Delete this Academy login account?")) return;
        try {
          await req("delete_account", { id }, ACC);
          toast("Account deleted");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteWebinarSignup = async (id, name, email) => {
        if (!confirm(`Are you sure you want to delete ${name} - ${email}?`)) return;
        try {
          await req("delete_signup", { id });
          toast("Webinar signup deleted");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteApplication = async (id) => {
        if (
          !confirm(
            "Permanently delete this application? This cannot be undone.",
          )
        )
          return;
        try {
          await req("", { id }, DEL);
          toast("Application deleted");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      document.querySelectorAll(".nav button[data-tab]").forEach(
        (b) =>
          (b.onclick = () => {
            tab = b.dataset.tab;
            document
              .querySelectorAll(".nav button")
              .forEach((x) => x.classList.toggle("active", x === b));
            render();
          }),
      );
      $("search").oninput = render;
      $("loginBtn").onclick = async () => {
        try {
          const d = await req(
            "login",
            { username: $("username").value, password: $("password").value },
            LOGIN,
          );
          token = d.token;
          sessionStorage.setItem("assistara_admin_token", token);
          show();
          await load();
        } catch (e) {
          $("loginError").textContent = e.message;
        }
      };
      $("logout").onclick = async () => {
        sessionStorage.removeItem("assistara_admin_token");
        try { await syncTestPortalCookie("logout"); } catch {}
        location.reload();
      };
      $("testPortal").onclick = async () => {
        try {
          await syncTestPortalCookie();
          location.href = "/academy/test-portal";
        } catch (e) {
          alert(e.message);
        }
      };
      function show() {
        $("login").style.display = "none";
        $("dash").style.display = "block";
        $("logout").style.display = "block";
        $("testPortal").style.display = "block";
      }
      if (token) {
        show();
        load().catch((e) => alert(e.message));
      }
      (() => {
        const B =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-b2b-calls";
        let calls = [];
        const previousLoad = load,
          previousRender = render;
        function card(x) {
          const a = Object.entries(x.qualifying_answers || {})
            .map(
              ([k, v]) =>
                "<div><b>" +
                esc((v && v.label) || k) +
                "</b><br>" +
                esc(
                  typeof v === "object"
                    ? (v.value ?? v.answer ?? JSON.stringify(v))
                    : v,
                ) +
                "</div>",
            )
            .join("");
          return (
            '<div class="card" id="call-' +
            x.id +
            '"><div class="cardtop"><div><div class="name">' +
            esc(x.business_name || x.contact_name) +
            '</div><div class="sub">' +
            esc(x.contact_name) +
            " · " +
            esc(x.contact_email) +
            "<br>" +
            esc(
              x.call_start_at
                ? new Date(x.call_start_at).toLocaleString()
                : "Time not supplied",
            ) +
            '</div></div><div class="badges">' +
            badge(x.pipeline_status) +
            badge(x.cal_booking_status) +
            '</div></div><div class="actions"><button onclick="toggleCall(\'' +
            x.id +
            '\')">Open prospect</button></div><div class="callDetail"><div class="callGrid"><div class="callFact"><b>Phone</b><br>' +
            esc(x.contact_phone || "Not supplied") +
            '</div><div class="callFact"><b>Cal.com booking</b><br>' +
            esc(x.cal_booking_id) +
            '</div></div><div class="answers"><b>Qualifying answers</b>' +
            a +
            '</div><div class="callGrid"><label>Pipeline status<select id="s-' +
            x.id +
            '">' +
            [
              "Booked",
              "Attended",
              "No-show",
              "Qualified",
              "Proposal",
              "Won",
              "Lost",
            ]
              .map(
                (s) =>
                  "<option " +
                  (x.pipeline_status === s ? "selected" : "") +
                  ">" +
                  s +
                  "</option>",
              )
              .join("") +
            '</select></label><label>Follow-up date<input id="f-' +
            x.id +
            '" type="datetime-local" value="' +
            (x.follow_up_at ? x.follow_up_at.slice(0, 16) : "") +
            '"></label><label>Deal value<input id="v-' +
            x.id +
            '" type="number" value="' +
            esc(x.deal_value ?? "") +
            '"></label><label>Lost reason<input id="l-' +
            x.id +
            '" value="' +
            esc(x.lost_reason || "") +
            '"></label></div><label>Internal notes<textarea id="n-' +
            x.id +
            '">' +
            esc(x.internal_notes || "") +
            '</textarea></label><div class="actions"><button class="accept" onclick="saveCall(\'' +
            x.id +
            "')\">Save changes</button></div></div></div>"
          );
        }
        load = async () => {
          await previousLoad();
          try {
            calls = (await req("list", {}, B)).calls || [];
          } catch {
            calls = [];
          }
          if (tab === "b2b") render();
        };
        render = () => {
          if (tab !== "b2b") return previousRender();
          drawPending();
          const list = calls.filter(match),
            up = list.filter(
              (x) =>
                x.cal_booking_status === "scheduled" &&
                x.call_start_at &&
                new Date(x.call_start_at) > new Date(),
            );
          stat([
            [list.length, "Discovery calls"],
            [up.length, "Upcoming"],
            [
              list.filter((x) => x.pipeline_status === "Qualified").length,
              "Qualified",
            ],
            [list.filter((x) => x.pipeline_status === "Won").length, "Won"],
          ]);
          $("cards").innerHTML =
            list.map(card).join("") ||
            '<div class="empty">No discovery calls yet. Your first Cal.com booking will appear here automatically.</div>';
        };
        window.toggleCall = (id) => $("call-" + id).classList.toggle("open");
        window.saveCall = async (id) => {
          try {
            await req(
              "update",
              {
                id,
                pipeline_status: $("s-" + id).value,
                follow_up_at: $("f-" + id).value
                  ? new Date($("f-" + id).value).toISOString()
                  : "",
                deal_value: $("v-" + id).value,
                internal_notes: $("n-" + id).value,
                lost_reason: $("l-" + id).value,
              },
              B,
            );
            toast("Discovery call updated");
            await load();
          } catch (e) {
            alert(e.message);
          }
        };
      })();
    </script>
  </body>
</html>
