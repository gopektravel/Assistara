<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara</title><link rel="icon" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--line:#dedbd3;--muted:#716b63;--green:#dff7e8;--red:#fee2e2;--orange:#fff0d8;--purple:#f0e9ff}*{box-sizing:border-box}body{margin:0;background:var(--cream);font-family:"DM Sans",sans-serif;color:var(--ink)}.shell{width:min(1240px,calc(100% - 28px));margin:auto}.nav{margin-top:18px;background:#171717;color:#fff;border-radius:20px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:36px}.nav a,.nav button,.btn{border:0;border-radius:999px;padding:11px 15px;font:700 13px "DM Sans";cursor:pointer}.nav a,.nav button{background:#fff;color:#171717;text-decoration:none}.login{max-width:480px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:30px}.field{display:grid;gap:6px;margin-top:13px}.field span{font-size:12px;font-weight:800}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font:inherit;background:#fff}.field textarea{min-height:80px}.login .btn{width:100%;margin-top:16px;background:var(--yellow)}.dash{display:none;padding:25px 0 70px}h1{font-size:38px;margin:0}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.tab.active{background:#171717;color:#fff}.search{margin-left:auto;padding:10px 14px;border:1px solid var(--line);border-radius:999px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:15px}.stat b{font-size:27px;display:block}.stat span{font-size:12px;color:var(--muted)}.capacity{background:#171717;color:#fff;border-radius:18px;padding:16px;margin-bottom:12px}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.card.unopened{border-color:#d8b700}.summary{width:100%;border:0;background:none;padding:17px 19px;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;font:inherit}.name{font-size:18px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:6px 8px;border-radius:999px;background:#eee}.new{background:#fff2a6}.paid,.accepted,.active,.won{background:var(--green)}.pending,.contacted,.responded,.follow_up{background:var(--orange)}.declined,.lost,.suspended{background:var(--red)}.qualified,.proposal{background:var(--purple)}.body{display:none;border-top:1px solid var(--line);padding:18px}.card.open .body{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.q{background:#faf9f5;padding:12px;border-radius:12px}.q b{display:block;font-size:10px;text-transform:uppercase;color:#858078;margin-bottom:5px}.q span{font-size:13px;white-space:pre-wrap}.ops{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #eee}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;font:700 12px "DM Sans";cursor:pointer}.actions .primary{background:var(--yellow);border:0}.actions .dark{background:#171717;color:#fff}.actions .danger{color:#9b2525;border-color:#e3aaa5}.timeline{margin-top:16px;padding:14px;background:#faf9f5;border-radius:14px}.timeline h3{font-size:13px;margin:0 0 10px}.event{font-size:12px;padding:7px 0;border-top:1px solid #e8e5de}.event:first-of-type{border:0}.event time{color:var(--muted);margin-left:7px}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:18px}.funnel{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.funnel div{background:#fff;border:1px solid var(--line);padding:10px 13px;border-radius:13px;font-size:12px}.funnel b{font-size:19px;display:block}.error{display:none;background:var(--red);padding:10px;border-radius:10px;margin-top:10px}@media(max-width:800px){.stats,.ops,.grid{grid-template-columns:1fr 1fr}.search{width:100%;margin-left:0}}@media(max-width:560px){.stats,.ops,.grid{grid-template-columns:1fr}.summary{display:block}.badges{margin-top:8px}}</style></head><body><div class="shell"><div class="nav"><div class="brand"><img src="/assistara-logo.svg"><span>Assistara Admin</span></div><div><a href="/login" target="_blank">Student login</a> <button id="logout" style="display:none">Log out</button></div></div><section id="login" class="login"><h1>Admin login</h1><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="btn">Log in</button><div id="loginError" class="error"></div></section><section id="dash" class="dash"><h1>Admin</h1><div class="tabs"><button class="tab active" data-tab="applicants">Applicants</button><button class="tab" data-tab="students">Students</button><button class="tab" data-tab="webinar">Free webinar</button><button class="tab" data-tab="b2b">B2B</button><input id="search" class="search" placeholder="Search..."></div><div id="capacity" class="capacity"></div><div id="stats" class="stats"></div><div id="funnel"></div><div id="cards" class="cards"></div></section></div><script>const L='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',A='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications';let token=sessionStorage.getItem('assistara_admin_token')||'',apps=[],web=[],b2b=[],activity=[],cap={},tab='applicants';const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function req(action,p={},api=A){let r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...p})}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function match(...v){let q=$('search').value.toLowerCase().trim();return !q||v.some(x=>String(x||'').toLowerCase().includes(q))}function badge(x){return `<span class="badge ${esc(x)}">${esc(String(x).replaceAll('_',' '))}</span>`}function events(type,id,a){let e=activity.filter(x=>x.entity_type===type&&x.entity_id===id).slice(0,12);if(type==='application'){[['Applied',a.created_at],['Accepted',a.accepted_at],['Paid',a.paid_at],['Payment confirmation sent',a.payment_confirmation_sent_at],['Account created',a.onboarding_completed_at],['Account confirmation sent',a.account_confirmation_sent_at]].forEach(x=>x[1]&&e.push({action:x[0],created_at:x[1]}))}e.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));return `<div class="timeline"><h3>Activity</h3>${e.length?e.slice(0,12).map(x=>`<div class="event">${esc(x.action.replaceAll('_',' '))}<time>${new Date(x.created_at).toLocaleString()}</time></div>`).join(''):'<div class="event">No activity yet</div>'}</div>`}function ops(type,x){return `<div class="ops"><label class="field"><span>Internal notes</span><textarea id="notes-${x.id}">${esc(x.admin_notes||x.notes||'')}</textarea></label><label class="field"><span>Next action</span><input id="next-${x.id}" value="${esc(x.next_action||'')}"></label><label class="field"><span>Follow up</span><input id="follow-${x.id}" type="datetime-local" value="${x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):''}"></label></div>`}function stats(items){$('stats').innerHTML=items.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}function render(){let q=$('search').value;$('capacity').style.display=tab==='applicants'?'block':'none';$('capacity').innerHTML=tab==='applicants'?`<b>${cap.paid||0}/${cap.limit||15} paid places filled</b> · ${cap.spots_left??15} spots left`:'';$('funnel').innerHTML='';if(tab==='applicants'){stats([[apps.length,'Applicants'],[apps.filter(x=>!x.opened_at).length,'New'],[apps.filter(x=>x.decision==='accepted').length,'Accepted'],[apps.filter(x=>x.payment_status==='paid').length,'Paid']]);renderApps(false)}else if(tab==='students'){let s=apps.filter(x=>x.auth_user_id);stats([[s.length,'Accounts'],[s.filter(x=>x.payment_status==='paid').length,'Paid'],[s.filter(x=>x.onboarding_completed_at).length,'Onboarded'],[s.filter(x=>x.suspended_at).length,'Suspended']]);renderApps(true)}else if(tab==='webinar'){let reg=web.length,att=web.filter(x=>x.attended).length,ap=web.filter(x=>x.application_id).length,pur=web.filter(x=>x.purchased).length;stats([[reg,'Registered'],[att,'Attended'],[ap,'Applied'],[pur,'Purchased']]);$('funnel').innerHTML=`<div class="funnel"><div><b>${reg}</b>Registered</div><div><b>${reg?Math.round(att/reg*100):0}%</b>Attend rate</div><div><b>${reg?Math.round(ap/reg*100):0}%</b>Apply rate</div><div><b>${reg?Math.round(pur/reg*100):0}%</b>Purchase rate</div></div>`;renderWeb()}else{stats([[b2b.length,'Leads'],[b2b.filter(x=>x.status==='qualified').length,'Qualified'],[b2b.filter(x=>x.status==='proposal').length,'Proposal'],[b2b.filter(x=>x.status==='won').length,'Won']]);renderB2B()}}function renderApps(students){let l=apps.filter(x=>(!students||x.auth_user_id)&&match(x.name,x.email,x.onboarding_phone,x.status,x.next_action));$('cards').innerHTML=l.length?l.map(x=>`<article class="card ${x.opened_at?'':'unopened'}"><button class="summary" onclick="toggle(this,'${x.id}')"><div><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.email)} · ${new Date(x.created_at).toLocaleDateString()}</div></div><div class="badges">${!x.opened_at?badge('new'):''}${x.decision?badge(x.decision):''}${badge(x.payment_status||'not paid')}${x.auth_user_id?badge(x.suspended_at?'suspended':'active'):''}</div></button><div class="body"><div class="grid"><div class="q"><b>Current situation</b><span>${esc(x.current_situation)}</span></div><div class="q"><b>Why remote work</b><span>${esc(x.why_remote_work)}</span></div><div class="q"><b>Obstacle</b><span>${esc(x.biggest_obstacle)}</span></div><div class="q"><b>Payment preference</b><span>${esc(x.payment_readiness)}</span></div><div class="q"><b>Phone</b><span>${esc(x.onboarding_phone||'Not added')}</span></div><div class="q"><b>Goal</b><span>${esc(x.onboarding_goal||'Not added')}</span></div></div>${ops('application',x)}<div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button onclick="saveApp('${x.id}')">Save notes & follow-up</button>${students?`<button onclick="resetPw('${x.id}')">Send password reset</button><button onclick="suspend('${x.id}',${!x.suspended_at})">${x.suspended_at?'Reactivate':'Suspend'} account</button><button class="danger" onclick="delAccount('${x.id}')">Delete account</button>`:x.decision==='accepted'?`<button disabled>Accepted</button><button onclick="decision('${x.id}','accepted',true)">Resend acceptance</button>`:x.decision==='declined'?`<button disabled>Declined</button><button onclick="decision('${x.id}','declined',true)">Resend decline</button>`:`<button class="primary" onclick="decision('${x.id}','accepted')">Accept + email</button><button onclick="decision('${x.id}','declined')">Decline</button>`}<button class="danger" onclick="delApp('${x.id}')">Delete applicant${x.auth_user_id?' + account':''}</button></div>${events('application',x.id,x)}</div></article>`).join(''):'<div class="empty">Nothing here yet.</div>'}function renderWeb(){let l=web.filter(x=>match(x.name,x.email,x.phone,x.lead_status,x.next_action));$('cards').innerHTML=l.length?l.map(x=>`<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.name||'No name')}</div><div class="sub">${esc(x.email)} · ${new Date(x.created_at).toLocaleString()}</div></div><div class="badges">${badge(x.lead_status||'registered')}${x.attended?badge('attended'):''}${x.application_id?badge('applied'):''}${x.purchased?badge('paid'):''}</div></button><div class="body"><div class="grid"><div class="q"><b>Phone</b><span>${esc(x.phone||'')}</span></div><div class="q"><b>Source</b><span>${esc(x.source||x.utm_source||'')}</span></div></div><div class="ops"><label class="field"><span>Status</span><select id="status-${x.id}">${['registered','attended','follow_up','applied','qualified','purchased','not_interested'].map(s=>`<option ${s===(x.lead_status||'registered')?'selected':''}>${s}</option>`).join('')}</select></label><label class="field"><span>Next action</span><input id="next-${x.id}" value="${esc(x.next_action||'')}"></label><label class="field"><span>Follow up</span><input id="follow-${x.id}" type="datetime-local" value="${x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):''}"></label></div><label class="field"><span>Internal notes</span><textarea id="notes-${x.id}">${esc(x.admin_notes||'')}</textarea></label><div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button onclick="saveWeb('${x.id}')">Save</button><button class="danger" onclick="delWeb('${x.id}')">Delete signup</button></div>${events('webinar',x.id,x)}</div></article>`).join(''):'<div class="empty">No webinar registrations yet.</div>'}function renderB2B(){let l=b2b.filter(x=>match(x.name,x.email,x.company,x.status,x.next_action));$('cards').innerHTML=l.length?l.map(x=>`<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.company||x.name||'B2B lead')}</div><div class="sub">${esc(x.name)} · ${esc(x.email)}</div></div><div>${badge(x.status||'new')}</div></button><div class="body"><div class="grid"><div class="q"><b>Support needed</b><span>${esc(x.support_level)}</span></div><div class="q"><b>Time-consuming tasks</b><span>${esc(x.time_thieves)}</span></div></div><div class="ops"><label class="field"><span>Stage</span><select id="status-${x.id}">${['new','contacted','responded','qualified','proposal','won','lost'].map(s=>`<option ${s===(x.status||'new')?'selected':''}>${s}</option>`).join('')}</select></label><label class="field"><span>Next action</span><input id="next-${x.id}" value="${esc(x.next_action||'')}"></label><label class="field"><span>Follow up</span><input id="follow-${x.id}" type="datetime-local" value="${x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):''}"></label></div><label class="field"><span>Notes</span><textarea id="notes-${x.id}">${esc(x.notes||'')}</textarea></label><div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button onclick="saveB2B('${x.id}')">Save</button><button class="danger" onclick="delB2B('${x.id}')">Delete lead</button></div>${events('b2b',x.id,x)}</div></article>`).join(''):'<div class="empty">No B2B leads yet.</div>'}window.toggle=async(b,id)=>{let c=b.closest('.card'),opening=!c.classList.contains('open');c.classList.toggle('open');if(opening&&id)try{await req('open',{id})}catch{}};function dt(id){let v=$(id)?.value;return v?new Date(v).toISOString():null}async function reload(){let d=await req('list');apps=d.applications||[];web=d.signups||[];b2b=d.b2b||[];activity=d.activity||[];cap=d.capacity||{};render()}window.saveApp=async id=>{await req('update_application',{id,admin_notes:$('notes-'+id).value,next_action:$('next-'+id).value,follow_up_at:dt('follow-'+id)});await reload()};window.saveWeb=async id=>{await req('update_webinar',{id,lead_status:$('status-'+id).value,admin_notes:$('notes-'+id).value,next_action:$('next-'+id).value,follow_up_at:dt('follow-'+id)});await reload()};window.saveB2B=async id=>{await req('update_b2b',{id,status:$('status-'+id).value,notes:$('notes-'+id).value,next_action:$('next-'+id).value,follow_up_at:dt('follow-'+id)});await reload()};window.decision=async(id,d,resend=false)=>{if(!resend&&!confirm(d==='accepted'?'Accept and send enrollment email?':'Decline and send email?'))return;await req(resend?'resend_decision':'decision',{id,decision:d});await reload()};window.resetPw=async id=>{await req('send_password_reset',{id});alert('Password reset sent')};window.suspend=async(id,s)=>{await req('suspend_account',{id,suspended:s});await reload()};window.delApp=async id=>{if(!confirm('Permanently delete this applicant and linked account if one exists?'))return;try{await req('delete_application',{id});await reload()}catch(e){alert(e.message)}};window.delWeb=async id=>{if(!confirm('Delete this webinar signup?'))return;try{await req('delete_signup',{id});await reload()}catch(e){alert(e.message)}};window.delB2B=async id=>{if(!confirm('Delete this B2B lead?'))return;try{await req('delete_b2b',{id});await reload()}catch(e){alert(e.message)}};window.delAccount=async id=>{if(!confirm('Delete this student login account? Payment/application data stays.'))return;await req('delete_account',{id});await reload()};window.copy=async s=>{await navigator.clipboard.writeText(s)};document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;document.querySelectorAll('.tab').forEach(y=>y.classList.toggle('active',y===x));render()});$('search').oninput=render;$('loginBtn').onclick=async()=>{try{let d=await req('login',{username:$('username').value,password:$('password').value},L);token=d.token;sessionStorage.setItem('assistara_admin_token',token);show();await reload()}catch(e){$('loginError').style.display='block';$('loginError').textContent=e.message}};$('logout').onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};function show(){$('login').style.display='none';$('dash').style.display='block';$('logout').style.display='inline-block'}if(token){show();reload().catch(()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()})}</script></body></html>
