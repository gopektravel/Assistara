<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Admin | Assistara</title>
    <link rel="icon" href="/assistara-logo.svg" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #171717;
        --cream: #f7f5ef;
        --line: #e2ded4;
        --muted: #746e65;
        --yellow: #ffd51f;
        --green: #e8f7ed;
        --greenInk: #1d6a3b;
        --red: #fde9e7;
        --redInk: #8b2825;
        --orange: #fff0db;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--cream);
        color: var(--ink);
        font-family: "DM Sans", Arial, sans-serif;
      }
      .shell {
        width: min(1120px, calc(100% - 28px));
        margin: auto;
      }
      .top {
        margin-top: 16px;
        background: #171717;
        color: #fff;
        border-radius: 18px;
        padding: 12px 15px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
      }
      .brand img {
        width: 34px;
      }
      .top .actions {
        margin: 0;
        align-items: center;
      }
      .top button {
        min-height: 40px;
        border: 1px solid rgba(255, 255, 255, 0.26);
        background: transparent;
        color: #fff;
        border-radius: 999px;
        padding: 9px 15px;
        font-weight: 800;
        cursor: pointer;
      }
      .top button:hover {
        background: #2c2c2c;
      }
      .top #testPortal {
        border-color: var(--yellow);
        background: var(--yellow);
        color: var(--ink);
      }
      .top #logout {
        min-height: auto;
        border-color: transparent;
        background: transparent;
        color: #b7b7b7;
        border-radius: 0;
        padding: 8px 5px;
        box-shadow: none;
        transition: color 0.16s ease, transform 0.16s ease;
      }
      .top #logout:hover,
      .top #logout:focus-visible {
        background: transparent;
        color: var(--yellow);
        outline: 0;
        transform: translateX(-2px);
      }
      .login {
        max-width: 460px;
        margin: 70px auto;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 30px;
      }
      .field {
        display: grid;
        gap: 6px;
        margin-top: 12px;
      }
      .field input {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
      }
      .main {
        width: 100%;
        margin-top: 15px;
        background: var(--yellow);
        border: 0;
        border-radius: 10px;
        padding: 13px;
        font-weight: 800;
      }
      .dash {
        display: none;
        padding: 24px 0 60px;
      }
      .nav {
        margin: 18px 0 14px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 15px;
        display: flex;
        gap: 18px;
        padding: 0 14px;
        overflow: auto;
      }
      .nav button {
        border: 0;
        background: none;
        padding: 15px 2px;
        font-weight: 700;
        white-space: nowrap;
      }
      .nav button.active {
        border-bottom: 3px solid #171717;
      }
      .alert {
        background: #fff8dc;
        border: 2px solid var(--yellow);
        border-radius: 18px;
        padding: 17px;
        margin: 14px 0;
      }
      .payment,
      .card,
      .student {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        margin-top: 10px;
      }
      .payment {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .actions button {
        min-height: 38px;
        border: 1px solid #d7d2c8;
        background: #fff;
        color: var(--ink);
        border-radius: 999px;
        padding: 9px 14px;
        font-weight: 800;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .actions button:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 10px rgba(23, 23, 23, 0.1);
      }
      .actions .success {
        background: var(--green);
        color: var(--greenInk);
        border-color: #b9e4c8;
      }
      .actions .danger {
        background: var(--red);
        color: var(--redInk);
        border-color: #efb8b3;
      }
      .actions .accept {
        background: var(--yellow);
        border-color: #e6ba00;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 14px;
      }
      .stat {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .stat b {
        display: block;
        font-size: 26px;
      }
      .stat span,
      .sub {
        font-size: 12px;
        color: var(--muted);
      }
      .cards {
        display: grid;
        gap: 10px;
      }
      .cardtop,
      .studentHead {
        display: flex;
        justify-content: space-between;
        gap: 10px;
      }
      .name {
        font-size: 18px;
        font-weight: 800;
      }
      .badges {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        line-height: 1;
        padding: 4px 6px;
        border-radius: 6px;
        background: #efede8;
      }
      .badge.paid,
      .badge.accepted {
        background: var(--green);
        color: var(--greenInk);
        border: 1px solid #b9e4c8;
      }
      .badge.pending,
      .badge.payment_pending {
        background: var(--orange);
        color: #8a4b00;
        border: 1px solid #f1c889;
      }
      .detail {
        margin: 12px 0;
        padding: 11px;
        background: #faf9f5;
        border-radius: 10px;
        font-size: 13px;
      }
      .studentHead {
        cursor: pointer;
      }
      .studentBody {
        display: none;
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .student.open .studentBody {
        display: block;
      }
      .empty {
        background: #fff;
        border: 1px dashed var(--line);
        border-radius: 14px;
        padding: 28px;
        text-align: center;
        color: var(--muted);
      }
      .toast {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 13px 16px;
        border-radius: 12px;
        background: #171717;
        color: #fff;
        display: none;
      }
      .toast.show {
        display: block;
      }
      .error {
        color: var(--redInk);
        margin-top: 10px;
      }
      .search {
        margin: 0 0 14px;
        width: 100%;
        max-width: 360px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
      }
      @media (max-width: 650px) {
        .stats {
          grid-template-columns: 1fr 1fr;
        }
        .payment,
        .cardtop {
          display: block;
        }
        .payment .actions {
          margin-top: 10px;
        }
      }
      .quick {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
        margin: 0;
      }
      .quick a {
        min-height: 32px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid transparent;
        background: transparent;
        border-radius: 8px;
        padding: 6px 8px;
        color: var(--ink);
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
        transition: background 0.15s ease, color 0.15s ease;
      }
      .quick svg {
        width: 15px;
        height: 15px;
        stroke: currentColor;
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .quick a:hover {
        background: #fff;
        border-color: var(--line);
      }
      .adminHead {
        display: flex;
        justify-content: space-between;
        gap: 14px;
        align-items: end;
        flex-wrap: wrap;
      }
      .callDetail {
        display: none;
        border-top: 1px solid var(--line);
        margin-top: 14px;
        padding-top: 14px;
      }
      .card.open .callDetail {
        display: block;
      }
      .callDetail input,
      .callDetail select,
      .callDetail textarea {
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 9px;
        font: inherit;
        width: 100%;
        margin-top: 5px;
      }
      .callDetail textarea {
        min-height: 70px;
      }
      .callGrid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .callFact,
      .answers {
        background: #faf9f5;
        border-radius: 10px;
        padding: 10px;
        font-size: 12px;
      }
      .answers {
        margin: 10px 0;
      }
      .answers div {
        padding: 7px 0;
        border-bottom: 1px solid var(--line);
      }
      .badge.Booked {
        background: var(--orange);
      }
      .badge.Attended,
      .badge.Qualified,
      .badge.Won {
        background: var(--green);
      }
      .badge.No-show,
      .badge.Lost {
        background: var(--red);
      }
      @media (max-width: 650px) {
        .callGrid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="top">
        <div class="brand">
          <img src="/assistara-logo.svg" /><span>Assistara Admin</span>
        </div>
        <div class="actions">
          <button id="testPortal" style="display: none">
            Test student portal
          </button>
          <button id="logout" style="display: none">Log out</button>
        </div>
      </div>
      <section id="login" class="login">
        <h1>Admin login</h1>
        <p>Manage Assistara operations.</p>
        <label class="field"
          ><span>Username</span><input id="username" value="admin" /></label
        ><label class="field"
          ><span>Password</span><input id="password" type="password" /></label
        ><button id="loginBtn" class="main">Log in</button>
        <div id="loginError" class="error"></div>
      </section>
      <section id="dash" class="dash">
        <div class="adminHead">
          <div>
            <h1>Admin</h1>
            <div class="sub">
              Applications, payments and B2B discovery calls.
            </div>
          </div>
          <div class="quick">
            <a href="https://mail.nameslink.com/" target="_blank"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a
            ><a
              href="https://app.clickup.com/1300450000003242/home"
              target="_blank"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 7 7 7 7-7"/><path d="m8 12 4 4 4-4"/><path d="m11 17 1 1 1-1"/></svg>ClickUp</a
            ><a
              href="https://supabase.com/dashboard/project/jhmmwleejgidrxavzdlq"
              target="_blank"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="5.5" rx="7" ry="3"/><path d="M5 5.5v7c0 1.7 3.1 3 7 3s7-1.3 7-3v-7"/><path d="M5 12.5v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>Database</a
            >
          </div>
        </div>
        <div class="nav">
          <button class="active" data-tab="applicants">
            Applications <span id="payCount"></span></button
          ><button data-tab="students">Students</button
          ><button data-tab="webinar">Free webinar</button
          ><button data-tab="b2b">B2B</button>
        </div>
        <div id="pendingBox"></div>
        <input id="search" class="search" placeholder="Search..." />
        <div id="stats" class="stats"></div>
        <div id="cards" class="cards"></div>
      </section>
    </div>
    <div id="toast" class="toast"></div>
    <script>
      const LOGIN =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api",
        API =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications",
        ACC =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-accounts",
        PAY =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-gcash-payment",
        DEL =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-delete-application",
        ONBOARD =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-send-onboarding";
      let token = sessionStorage.getItem("assistara_admin_token") || "",
        apps = [],
        web = [],
        b2b = [],
        accounts = [],
        tab = "applicants";
      const $ = (x) => document.getElementById(x),
        esc = (s) =>
          String(s ?? "").replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;",
              })[c],
          );
      async function req(action, p = {}, api = API) {
        const body = api === ONBOARD || api === DEL ? p : { action, ...p };
        const r = await fetch(api, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(token ? { Authorization: "Bearer " + token } : {}),
            },
            body: JSON.stringify(body),
          }),
          j = await r.json().catch(() => ({}));
        if (!r.ok) throw Error(j.error || "Request failed");
        return j;
      }
      function toast(s) {
        $("toast").textContent = s;
        $("toast").className = "toast show";
        setTimeout(() => ($("toast").className = "toast"), 2500);
      }
      function badge(s) {
        return `<span class="badge ${esc(s)}">${esc(String(s || "").replaceAll("_", " "))}</span>`;
      }
      function stat(a) {
        $("stats").innerHTML = a
          .map(
            (x) => `<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`,
          )
          .join("");
      }
      function match(x) {
        const q = $("search").value.toLowerCase();
        return !q || JSON.stringify(x).toLowerCase().includes(q);
      }
      function activeApps() {
        return apps.filter((x) => x.decision !== "declined" && !x.auth_user_id);
      }
      function actionablePending() {
        return activeApps().filter(
          (x) =>
            x.payment_method === "gcash" &&
            x.payment_status === "pending" &&
            !["followup_sent", "no_response"].includes(
              x.gcash_followup_status || "",
            ),
        );
      }
      function paymentRow(x) {
        const f = x.gcash_followup_status || "";
        let status = "Payment pending",
          buttons = `<button class="success" onclick="approvePay('${x.id}')">✓ Approve payment</button>`;
        if (!f)
          buttons += `<button class="danger" onclick="rejectPay('${x.id}')">✕ Could not verify</button>`;
        else if (f === "screenshot_requested") {
          status = "Screenshot requested";
          buttons += `<button onclick="noResponsePay('${x.id}')">No response</button>`;
        }
        return `<div class="payment"><div><b>${esc(x.name)}</b><div class="sub">GCash · ₱6,900 · Ref: <strong>${esc(x.gcash_reference || "Not provided")}</strong><br><strong>Status: ${esc(status)}</strong>${x.gcash_submitted_at ? "<br>" + new Date(x.gcash_submitted_at).toLocaleString() : ""}</div></div><div class="actions">${buttons}</div></div>`;
      }
      function drawPending() {
        const p = actionablePending();
        $("payCount").textContent = p.length ? "🔔 " + p.length : "";
        $("pendingBox").innerHTML =
          p.length && tab === "applicants"
            ? `<div class="alert"><h2>🔔 PAYMENT PENDING VERIFICATION (${p.length})</h2><div class="sub">Only payments that still need an action appear here. After the final no-response follow-up, the record is archived below as Unverified payment.</div>${p.map(paymentRow).join("")}</div>`
            : "";
      }
      function appCard(x) {
        const unverified =
          x.payment_method === "gcash" &&
          x.payment_status === "pending" &&
          ["followup_sent", "no_response"].includes(
            x.gcash_followup_status || "",
          );
        const paymentLabel = unverified ? "unverified_payment" : x.payment_status === "pending" ? "payment_pending" : x.payment_status || "not_requested";
        return `<div class="card"><div class="cardtop"><div><div class="name">${esc(x.name || "No name")}</div><div class="sub">${esc(x.email || "")}</div></div><div class="badges">${badge(x.decision || x.status || "new")}${badge(paymentLabel)}</div></div>${x.gcash_reference ? `<div class="detail"><b>GCash reference:</b> ${esc(x.gcash_reference)}${unverified ? "<br><b>Payment:</b> Unverified payment. Final follow-up sent." : ""}</div>` : ""}<div class="actions">${unverified ? `<button class="success" onclick="approvePay('${x.id}')">✓ Approve payment</button>` : ""}${!x.decision ? `<button class="accept" onclick="decision('${x.id}','accepted')">Accept + email</button><button onclick="decision('${x.id}','declined')">Decline + email</button>` : ""}${x.decision === "accepted" ? `<button onclick="decision('${x.id}','accepted',true)">Resend acceptance</button>` : ""}${x.payment_status === "paid" ? `<button class="success" onclick="onboard('${x.id}')">Send account setup</button>` : ""}<button class="danger" onclick="deleteApplication('${x.id}')">Delete application</button></div></div>`;
      }
      function studentCard(x) {
        const suspended = !!x.suspended_at;
        return `<div class="student" id="student-${x.id}"><div class="studentHead" onclick="toggleStudent('${x.id}')"><div class="name">${esc(x.name || "Student")}</div><span>⌄</span></div><div class="studentBody"><div class="sub">${esc(x.email || "")}</div><div class="detail"><b>Account:</b> ${suspended ? "Suspended" : "Active"}${x.receipt_number ? `<br><b>Receipt:</b> ${esc(x.receipt_number)}` : ""}</div><div class="actions"><button onclick="resetPw('${x.id}')">Password reset</button><button onclick="suspend('${x.id}',${suspended ? "false" : "true"})">${suspended ? "Reactivate" : "Suspend"} account</button><button class="danger" onclick="deleteAccount('${x.id}')">Delete account</button></div></div></div>`;
      }
      function render() {
        drawPending();
        if (tab === "applicants") {
          const a = activeApps().filter(match);
          stat([
            [a.length, "Active applications"],
            [actionablePending().length, "Payment needs action"],
            [
              a.filter((x) => x.decision === "accepted").length,
              "Accepted / enrolling",
            ],
            [
              a.filter((x) => x.payment_status === "paid").length,
              "Paid / setup pending",
            ],
          ]);
          $("cards").innerHTML = a.length
            ? a.map(appCard).join("")
            : '<div class="empty">No active applications.</div>';
          return;
        }
        if (tab === "students") {
          const s = apps.filter((x) => x.auth_user_id).filter(match);
          stat([
            [s.length, "Students"],
            [s.filter((x) => !x.suspended_at).length, "Active"],
            [s.filter((x) => x.suspended_at).length, "Suspended"],
            [s.filter((x) => x.onboarding_completed_at).length, "Onboarded"],
          ]);
          $("cards").innerHTML = s.length
            ? s.map(studentCard).join("")
            : '<div class="empty">No students yet.</div>';
          return;
        }
        if (tab === "webinar") {
          stat([
            [web.length, "Registered"],
            [web.filter((x) => x.attended).length, "Attended"],
            [web.filter((x) => x.application_id).length, "Applied"],
            [web.filter((x) => x.purchased).length, "Purchased"],
          ]);
          $("cards").innerHTML =
            '<div class="card">Webinar funnel is connected and reporting from Supabase.</div>';
          return;
        }
        stat([
          [b2b.length, "Leads"],
          [b2b.filter((x) => x.status === "responded").length, "Responded"],
          [b2b.filter((x) => x.status === "qualified").length, "Qualified"],
          [b2b.filter((x) => x.status === "won").length, "Won"],
        ]);
        $("cards").innerHTML =
          b2b
            .filter(match)
            .map(
              (x) =>
                `<div class="card"><div class="name">${esc(x.company || x.name || "B2B lead")}</div><div class="sub">${esc(x.name)} · ${esc(x.email)}</div>${badge(x.status || "new")}</div>`,
            )
            .join("") || '<div class="empty">No B2B leads.</div>';
      }
      async function load() {
        const d = await req("list");
        apps = d.applications || [];
        web = d.signups || [];
        b2b = d.b2b || [];
        try {
          accounts = (await req("list", {}, ACC)).accounts || [];
        } catch {
          accounts = [];
        }
        render();
      }
      window.toggleStudent = (id) => {
        const e = $("student-" + id);
        if (e) e.classList.toggle("open");
      };
      window.approvePay = async (id) => {
        if (!confirm("Approve this GCash payment as ₱6,900 PAID?")) return;
        try {
          const d = await req("approve", { id }, PAY);
          toast(
            d.email_sent
              ? "Payment approved + applicant emailed"
              : "Payment approved",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.rejectPay = async (id) => {
        if (
          !confirm(
            "Could not verify this payment? The applicant will be asked for a screenshot.",
          )
        )
          return;
        try {
          const d = await req("reject", { id }, PAY);
          toast(
            d.email_sent
              ? "Screenshot requested by email"
              : "Screenshot requested",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.noResponsePay = async (id) => {
        if (
          !confirm(
            "Send the one final follow-up email? After this, this payment leaves the action-required box and is marked Unverified payment.",
          )
        )
          return;
        try {
          const d = await req("no_response", { id }, PAY);
          toast(
            d.email_sent
              ? "Final follow-up sent. Payment archived as unverified."
              : "Payment archived as unverified.",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.decision = async (id, d, resend = false) => {
        try {
          if (
            !resend &&
            !confirm(
              d === "accepted"
                ? "Accept and send enrollment email?"
                : "Decline and send email?",
            )
          )
            return;
          await req(resend ? "resend_decision" : "decision", {
            id,
            decision: d,
          });
          toast(
            resend
              ? "Email resent"
              : d === "declined"
                ? "Declined"
                : "Accepted + email sent",
          );
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.onboard = async (id) => {
        try {
          await req("", { id }, ONBOARD);
          toast("Account setup email sent");
        } catch (e) {
          alert(e.message);
        }
      };
      window.resetPw = async (id) => {
        try {
          await req("send_password_reset", { id });
          toast("Password reset sent");
        } catch (e) {
          alert(e.message);
        }
      };
      window.suspend = async (id, suspended) => {
        try {
          await req("suspend_account", { id, suspended });
          toast(suspended ? "Account suspended" : "Account reactivated");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteAccount = async (id) => {
        if (!confirm("Delete this Academy login account?")) return;
        try {
          await req("delete_account", { id });
          toast("Account deleted");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      window.deleteApplication = async (id) => {
        if (
          !confirm(
            "Permanently delete this application? This cannot be undone.",
          )
        )
          return;
        try {
          await req("", { id }, DEL);
          toast("Application deleted");
          await load();
        } catch (e) {
          alert(e.message);
        }
      };
      document.querySelectorAll(".nav button").forEach(
        (b) =>
          (b.onclick = () => {
            tab = b.dataset.tab;
            document
              .querySelectorAll(".nav button")
              .forEach((x) => x.classList.toggle("active", x === b));
            render();
          }),
      );
      $("search").oninput = render;
      $("loginBtn").onclick = async () => {
        try {
          const d = await req(
            "login",
            { username: $("username").value, password: $("password").value },
            LOGIN,
          );
          token = d.token;
          sessionStorage.setItem("assistara_admin_token", token);
          show();
          await load();
        } catch (e) {
          $("loginError").textContent = e.message;
        }
      };
      $("logout").onclick = () => {
        sessionStorage.removeItem("assistara_admin_token");
        location.reload();
      };
      $("testPortal").onclick = () => (location.href = "/academy/test-portal");
      function show() {
        $("login").style.display = "none";
        $("dash").style.display = "block";
        $("logout").style.display = "block";
        $("testPortal").style.display = "block";
      }
      if (token) {
        show();
        load().catch((e) => alert(e.message));
      }
      (() => {
        const B =
          "https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-b2b-calls";
        let calls = [];
        const previousLoad = load,
          previousRender = render;
        function card(x) {
          const a = Object.entries(x.qualifying_answers || {})
            .map(
              ([k, v]) =>
                "<div><b>" +
                esc((v && v.label) || k) +
                "</b><br>" +
                esc(
                  typeof v === "object"
                    ? (v.value ?? v.answer ?? JSON.stringify(v))
                    : v,
                ) +
                "</div>",
            )
            .join("");
          return (
            '<div class="card" id="call-' +
            x.id +
            '"><div class="cardtop"><div><div class="name">' +
            esc(x.business_name || x.contact_name) +
            '</div><div class="sub">' +
            esc(x.contact_name) +
            " · " +
            esc(x.contact_email) +
            "<br>" +
            esc(
              x.call_start_at
                ? new Date(x.call_start_at).toLocaleString()
                : "Time not supplied",
            ) +
            '</div></div><div class="badges">' +
            badge(x.pipeline_status) +
            badge(x.cal_booking_status) +
            '</div></div><div class="actions"><button onclick="toggleCall(\'' +
            x.id +
            '\')">Open prospect</button></div><div class="callDetail"><div class="callGrid"><div class="callFact"><b>Phone</b><br>' +
            esc(x.contact_phone || "Not supplied") +
            '</div><div class="callFact"><b>Cal.com booking</b><br>' +
            esc(x.cal_booking_id) +
            '</div></div><div class="answers"><b>Qualifying answers</b>' +
            a +
            '</div><div class="callGrid"><label>Pipeline status<select id="s-' +
            x.id +
            '">' +
            [
              "Booked",
              "Attended",
              "No-show",
              "Qualified",
              "Proposal",
              "Won",
              "Lost",
            ]
              .map(
                (s) =>
                  "<option " +
                  (x.pipeline_status === s ? "selected" : "") +
                  ">" +
                  s +
                  "</option>",
              )
              .join("") +
            '</select></label><label>Follow-up date<input id="f-' +
            x.id +
            '" type="datetime-local" value="' +
            (x.follow_up_at ? x.follow_up_at.slice(0, 16) : "") +
            '"></label><label>Deal value<input id="v-' +
            x.id +
            '" type="number" value="' +
            esc(x.deal_value ?? "") +
            '"></label><label>Lost reason<input id="l-' +
            x.id +
            '" value="' +
            esc(x.lost_reason || "") +
            '"></label></div><label>Internal notes<textarea id="n-' +
            x.id +
            '">' +
            esc(x.internal_notes || "") +
            '</textarea></label><div class="actions"><button class="accept" onclick="saveCall(\'' +
            x.id +
            "')\">Save changes</button></div></div></div>"
          );
        }
        load = async () => {
          await previousLoad();
          try {
            calls = (await req("list", {}, B)).calls || [];
          } catch {
            calls = [];
          }
          if (tab === "b2b") render();
        };
        render = () => {
          if (tab !== "b2b") return previousRender();
          drawPending();
          const list = calls.filter(match),
            up = list.filter(
              (x) =>
                x.cal_booking_status === "scheduled" &&
                x.call_start_at &&
                new Date(x.call_start_at) > new Date(),
            );
          stat([
            [list.length, "Discovery calls"],
            [up.length, "Upcoming"],
            [
              list.filter((x) => x.pipeline_status === "Qualified").length,
              "Qualified",
            ],
            [list.filter((x) => x.pipeline_status === "Won").length, "Won"],
          ]);
          $("cards").innerHTML =
            list.map(card).join("") ||
            '<div class="empty">No discovery calls yet. Your first Cal.com booking will appear here automatically.</div>';
        };
        window.toggleCall = (id) => $("call-" + id).classList.toggle("open");
        window.saveCall = async (id) => {
          try {
            await req(
              "update",
              {
                id,
                pipeline_status: $("s-" + id).value,
                follow_up_at: $("f-" + id).value
                  ? new Date($("f-" + id).value).toISOString()
                  : "",
                deal_value: $("v-" + id).value,
                internal_notes: $("n-" + id).value,
                lost_reason: $("l-" + id).value,
              },
              B,
            );
            toast("Discovery call updated");
            await load();
          } catch (e) {
            alert(e.message);
          }
        };
      })();
    </script>
  </body>
</html>
