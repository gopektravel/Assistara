<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara</title><link rel="icon" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#171717;--cream:#f7f5ef;--line:#e2ded4;--muted:#746e65;--yellow:#ffd51f;--green:#e8f7ed;--greenInk:#1d6a3b;--red:#fde9e7;--redInk:#8b2825;--orange:#fff0db;--blue:#e9f1ff;--blueInk:#2b528a;--purple:#f2ecff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{width:min(1220px,calc(100% - 28px));margin:auto}.top{margin-top:16px;background:#171717;color:#fff;border-radius:18px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:34px}.top a,.top button{border:0;background:#fff;color:#171717;text-decoration:none;border-radius:10px;padding:9px 12px;font:700 12px "DM Sans";cursor:pointer}.login{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px}.login h1{margin:0;font-size:34px}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin-top:12px}.field span{font-size:12px;font-weight:700}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font:inherit}.field textarea{min-height:86px}.main{width:100%;margin-top:15px;background:var(--yellow);border:0;border-radius:10px;padding:13px;font:800 14px "DM Sans";cursor:pointer}.dash{display:none;padding:24px 0 60px}.head h1{margin:0;font-size:36px}.head p{margin:4px 0 0;color:var(--muted)}.quick-access{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0 2px}.quick-access a{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 13px;text-decoration:none;color:var(--ink);font:700 12px "DM Sans";transition:.2s ease}.quick-access a:hover{transform:translateY(-2px);box-shadow:0 8px 20px #00000010;border-color:#c9c4b9}.quick-access a span{font-size:15px}.nav{margin:18px 0 14px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;align-items:center;gap:22px;padding:0 14px;overflow:auto}.nav button{position:relative;border:0;background:none;padding:15px 2px 13px;font:700 13px "DM Sans";color:#777168;cursor:pointer;white-space:nowrap}.nav button.active{color:#171717}.nav button.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#171717;border-radius:3px}.search{margin-left:auto;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:220px;font:500 13px "DM Sans"}.notice{display:none;margin-bottom:12px;border-radius:12px;padding:12px 14px;font-size:13px}.notice.error{display:block;background:var(--red);color:var(--redInk)}.notice.info{display:block;background:#fff;border:1px solid var(--line);color:#514c45}.capacity{background:#171717;color:#fff;border-radius:15px;padding:14px 16px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.summary{width:100%;border:0;background:none;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;text-align:left;font:inherit;cursor:pointer}.name{font-size:18px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:#efede8}.badge.paid,.badge.accepted,.badge.active,.badge.won,.badge.onboarded{background:var(--green)}.badge.pending,.badge.contacted,.badge.onboarding{background:var(--orange)}.badge.declined,.badge.rejected,.badge.suspended,.badge.lost{background:var(--red)}.badge.responded,.badge.qualified,.badge.proposal{background:var(--purple)}.body{display:none;border-top:1px solid var(--line);padding:17px}.card.open .body{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.q{background:#faf9f5;border-radius:11px;padding:11px}.q b{display:block;font-size:10px;text-transform:uppercase;color:#857f76;margin-bottom:4px}.q span{font-size:13px;white-space:pre-wrap}.b2bops{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px;margin-top:14px;padding:14px;background:#faf9f5;border-radius:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font:700 12px "DM Sans";cursor:pointer}.actions .accept{background:var(--yellow);border-color:#e8bf00}.actions .email{background:var(--blue);color:var(--blueInk);border-color:#bed4f4}.actions .success{background:var(--green);color:var(--greenInk);border-color:#b9e4c8}.actions .dark{background:#171717;color:#fff;border-color:#171717}.actions .danger{background:#fff5f4;color:var(--redInk);border-color:#e1aaa5}.empty,.report{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}.report{text-align:left;border-style:solid}.report h2{margin:0 0 6px;color:var(--ink)}.toast{position:fixed;right:22px;bottom:22px;z-index:1000;border-radius:12px;padding:13px 16px;box-shadow:0 12px 35px #0002;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.toast.success{background:var(--green);color:var(--greenInk);border:1px solid #b9e4c8}.toast.error{background:var(--red);color:var(--redInk);border:1px solid #efb8b3}@media(max-width:780px){.stats,.grid,.b2bops{grid-template-columns:1fr 1fr}.search{width:100%;margin:0 0 10px}.nav{flex-wrap:wrap}}@media(max-width:560px){.stats,.grid,.b2bops{grid-template-columns:1fr}.summary{display:block}.badges{margin-top:8px}}</style></head><body><div class="shell"><div class="top"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><div><a href="/login" target="_blank">Student login</a> <button id="logout" style="display:none">Log out</button></div></div><section id="login" class="login"><h1>Admin login</h1><p class="muted">Manage applicants, students, accounts and webinar reporting.</p><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="main">Log in</button><div id="loginError" class="notice"></div></section><section id="dash" class="dash"><div class="head"><h1>Admin</h1><p>Assistara operations.</p></div><div class="quick-access" aria-label="Resources"><a href="https://mail.nameslink.com/" target="_blank" rel="noopener noreferrer"><span>✉</span>Email</a><a href="https://app.clickup.com/1300450000003242/home" target="_blank" rel="noopener noreferrer"><span>✓</span>ClickUp</a><a href="https://supabase.com/dashboard/project/jhmmwleejgidrxavzdlq/editor" target="_blank" rel="noopener noreferrer"><span>▦</span>Database</a></div><div class="nav"><button class="active" data-tab="applicants">Applicants</button><button data-tab="students">Students</button><button data-tab="accounts">Accounts</button><button data-tab="webinar">Free webinar</button><input id="search" class="search" placeholder="Search..."></div><div id="systemNotice" class="notice"></div><div id="capacity" class="capacity"></div><div id="stats" class="stats"></div><div id="cards" class="cards"></div></section></div><div id="toast" class="toast"></div><script>const LOGIN='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications',ACC='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-accounts',DEL='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-delete-application',ONBOARD='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-send-onboarding';let token=sessionStorage.getItem('assistara_admin_token')||'',apps=[],web=[],b2b=[],accounts=[],cap={},tab='applicants';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function req(action,p={},api=API){const body=(api===DEL||api===ONBOARD)?p:{action,...p};const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||('Request failed '+r.status));return j}function toast(msg,type='success'){const t=$('toast');t.textContent=msg;t.className='toast '+type+' show';clearTimeout(window.__toast);window.__toast=setTimeout(()=>t.className='toast',2800)}function badge(x,label){return `<span class="badge ${esc(x)}">${esc(label||String(x||'').replaceAll('_',' '))}</span>`}function stats(a){$('stats').innerHTML=a.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}function match(...v){const q=$('search').value.trim().toLowerCase();return !q||v.some(x=>String(x||'').toLowerCase().includes(q))}function details(fields){return `<div class="grid">${fields.map(f=>`<div class="q"><b>${f[0]}</b><span>${esc(f[1]||'Not provided')}</span></div>`).join('')}</div>`}function dt(id){const v=$(id)?.value;return v?new Date(v).toISOString():null}function applicantCard(x){return `<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.name||'No name')}</div><div class="sub">${esc(x.email)} · ${new Date(x.created_at).toLocaleString()}</div></div><div class="badges">${x.decision?badge(x.decision):badge('new')}${badge(x.payment_status||'not requested')}</div></button><div class="body">${details([['Current situation',x.current_situation],['Why remote work',x.why_remote_work],['Biggest obstacle',x.biggest_obstacle],['Payment preference',x.payment_readiness]])}<div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button>${x.decision==='accepted'?`<button class="email" onclick="decision('${x.id}','accepted',true)">Resend acceptance</button>`:x.decision==='declined'?`<button class="email" onclick="decision('${x.id}','declined',true)">Resend decline</button>`:`<button class="accept" onclick="decision('${x.id}','accepted')">Accept + email</button><button onclick="decision('${x.id}','declined')">Decline</button>`}<button class="danger" onclick="delPerson('${x.id}','applicant')">Delete applicant${x.auth_user_id?' + account':''}</button></div></div></article>`}function studentCard(x){const pending=x.payment_status==='paid'&&!x.onboarding_completed_at&&!x.auth_user_id;return `<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.name||'Student')}</div><div class="sub">${esc(x.email)}</div></div><div class="badges">${badge(x.payment_status||'unknown')}${badge(x.onboarding_completed_at?'onboarded':'onboarding','onboarding pending')}</div></button><div class="body">${details([['Phone',x.onboarding_phone],['Goal',x.onboarding_goal],['Availability',x.onboarding_availability],['Payment',x.payment_status]])}<div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button>${pending?`<button class="success" onclick="sendOnboarding('${x.id}')">Resend account email</button>`:''}${x.auth_user_id?`<button class="email" onclick="resetPw('${x.id}')">Send password reset</button><button onclick="suspend('${x.id}',${!x.suspended_at})">${x.suspended_at?'Reactivate':'Suspend'} account</button>`:''}<button class="danger" onclick="delPerson('${x.id}','student')">Delete student${x.auth_user_id?' + account':''}</button></div></div></article>`}function accountCard(x){const app=apps.find(a=>a.auth_user_id===x.id)||apps.find(a=>a.id===x.application_id)||{};return `<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.name||app.name||'Student account')}</div><div class="sub">${esc(x.email)}</div></div><div class="badges">${badge(app.suspended_at?'suspended':'active')}</div></button><div class="body">${details([['Account created',x.created_at?new Date(x.created_at).toLocaleString():'Unknown'],['Last login',x.last_sign_in_at?new Date(x.last_sign_in_at).toLocaleString():'Never'],['Phone',app.onboarding_phone],['Payment',app.payment_status]])}<div class="actions">${app.id?`<button class="email" onclick="resetPw('${app.id}')">Send password reset</button><button onclick="suspend('${app.id}',${!app.suspended_at})">${app.suspended_at?'Reactivate':'Suspend'} account</button><button class="danger" onclick="delAccount('${app.id}')">Delete account</button>`:''}</div></div></article>`}function statusLabel(s){return ({new:'Not responded',contacted:'Contacted',responded:'Responded',qualified:'Qualified',proposal:'Proposal sent',won:'Won',lost:'Lost'})[s]||s}function b2bCard(x){const statuses=['new','contacted','responded','qualified','proposal','won','lost'];return `<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.company||x.name||'B2B lead')}</div><div class="sub">${esc(x.name)} · ${esc(x.email)}</div></div><div class="badges">${badge(x.status||'new',statusLabel(x.status||'new'))}</div></button><div class="body">${details([['Support needed',x.support_level],['Time-consuming tasks',x.time_thieves]])}<div class="b2bops"><label class="field"><span>Internal notes</span><textarea id="notes-${x.id}">${esc(x.notes||'')}</textarea></label><label class="field"><span>Current status</span><select id="status-${x.id}">${statuses.map(s=>`<option value="${s}" ${s===(x.status||'new')?'selected':''}>${statusLabel(s)}</option>`).join('')}</select></label><label class="field"><span>Follow up</span><input id="follow-${x.id}" type="datetime-local" value="${x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):''}"></label></div><div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button class="accept" onclick="saveB2B('${x.id}')">Save status</button><button class="danger" onclick="delB2B('${x.id}')">Delete lead</button></div></div></article>`}function render(){$('systemNotice').className='notice';$('systemNotice').textContent='';$('capacity').style.display=tab==='applicants'?'block':'none';if(tab==='applicants'){$('capacity').innerHTML=`<b>${cap.paid||0}/${cap.limit||15} paid places filled</b> · ${cap.spots_left??15} spots left`;stats([[apps.length,'Applicants'],[apps.filter(x=>x.status==='new').length,'New'],[apps.filter(x=>x.decision==='accepted').length,'Accepted'],[apps.filter(x=>x.payment_status==='paid').length,'Paid']]);const l=apps.filter(x=>match(x.name,x.email,x.status));$('cards').innerHTML=l.length?l.map(applicantCard).join(''):'<div class="empty">No applicants found.</div>'}else if(tab==='students'){const l=apps.filter(x=>(x.payment_status==='paid'||x.onboarding_completed_at||x.auth_user_id)&&match(x.name,x.email));stats([[l.length,'Students'],[l.filter(x=>x.payment_status==='paid').length,'Paid'],[l.filter(x=>x.onboarding_completed_at).length,'Onboarded'],[l.filter(x=>x.auth_user_id).length,'With account']]);$('cards').innerHTML=l.length?l.map(studentCard).join(''):'<div class="empty">No students yet.</div>'}else if(tab==='accounts'){const l=accounts.filter(x=>match(x.name,x.email));stats([[l.length,'Accounts'],[l.filter(x=>x.last_sign_in_at).length,'Logged in'],[l.filter(x=>!x.last_sign_in_at).length,'Never logged in'],[apps.filter(x=>x.suspended_at).length,'Suspended']]);$('cards').innerHTML=l.length?l.map(accountCard).join(''):'<div class="empty">No Academy login accounts yet.</div>'}else if(tab==='webinar'){const reg=web.length,att=web.filter(x=>x.attended).length,ap=web.filter(x=>x.application_id).length,pur=web.filter(x=>x.purchased).length;stats([[reg,'Registered'],[att,'Attended'],[ap,'Applied'],[pur,'Purchased']]);$('cards').innerHTML=`<div class="report"><h2>Webinar funnel</h2><div>${reg?Math.round(att/reg*100):0}% attended · ${reg?Math.round(ap/reg*100):0}% applied · ${reg?Math.round(pur/reg*100):0}% purchased</div></div>`}else{stats([[b2b.length,'Leads'],[b2b.filter(x=>x.status==='responded').length,'Responded'],[b2b.filter(x=>x.status==='qualified').length,'Qualified'],[b2b.filter(x=>x.status==='won').length,'Won']]);const l=b2b.filter(x=>match(x.name,x.email,x.company,x.status));$('cards').innerHTML=l.length?l.map(b2bCard).join(''):'<div class="empty">No B2B leads yet.</div>'}}async function load(){try{const d=await req('list');apps=d.applications||[];web=d.signups||[];b2b=d.b2b||[];cap=d.capacity||{};render()}catch(e){$('systemNotice').className='notice error';$('systemNotice').textContent='Could not load admin data: '+e.message;return}try{const a=await req('list',{},ACC);accounts=a.accounts||[]}catch(e){accounts=[];$('systemNotice').className='notice info';$('systemNotice').textContent='Main admin data loaded. Account data is temporarily unavailable.'}render()}window.toggle=b=>b.closest('.card').classList.toggle('open');window.copy=async s=>{await navigator.clipboard.writeText(s);toast('Email copied')};window.decision=async(id,d,resend=false)=>{try{if(!resend&&!confirm(d==='accepted'?'Accept and send enrollment email?':'Decline and send email?'))return;await req(resend?'resend_decision':'decision',{id,decision:d});toast(resend?'Email resent':d==='accepted'?'Applicant accepted and emailed':'Applicant declined and emailed');await load()}catch(e){toast(e.message,'error')}};window.sendOnboarding=async id=>{try{await req('',{id},ONBOARD);toast('Account setup email sent');await load()}catch(e){toast(e.message,'error')}};window.resetPw=async id=>{try{await req('send_password_reset',{id});toast('Password reset email sent')}catch(e){toast(e.message,'error')}};window.suspend=async(id,s)=>{try{await req('suspend_account',{id,suspended:s});toast(s?'Account suspended':'Account reactivated');await load()}catch(e){toast(e.message,'error')}};window.delPerson=async(id,type)=>{const msg=type==='student'?'Permanently delete this student, their application and linked account if one exists?':'Permanently delete this applicant and linked account if one exists?';if(!confirm(msg))return;try{await req('',{id},DEL);toast(type==='student'?'Student deleted':'Applicant deleted');await load()}catch(e){toast(e.message,'error')}};window.delAccount=async id=>{if(!confirm('Delete login account but keep payment and application history?'))return;try{await req('delete_account',{id});toast('Account deleted');await load()}catch(e){toast(e.message,'error')}};window.saveB2B=async id=>{try{await req('update_b2b',{id,status:$('status-'+id).value,notes:$('notes-'+id).value,next_action:'',follow_up_at:dt('follow-'+id)});toast('B2B status saved');await load()}catch(e){toast(e.message,'error')}};window.delB2B=async id=>{if(!confirm('Delete this B2B lead?'))return;try{await req('delete_b2b',{id});toast('B2B lead deleted');await load()}catch(e){toast(e.message,'error')}};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;$('loginBtn').onclick=async()=>{try{const d=await req('login',{username:$('username').value,password:$('password').value},LOGIN);token=d.token;sessionStorage.setItem('assistara_admin_token',token);show();await load()}catch(e){$('loginError').className='notice error';$('loginError').textContent=e.message}};$('logout').onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};function show(){$('login').style.display='none';$('dash').style.display='block';$('logout').style.display='inline-block'}if(token){show();load().catch(e=>{$('systemNotice').className='notice error';$('systemNotice').textContent=e.message})}</script></body></html>
