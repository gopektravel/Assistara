<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara Academy</title><link rel="icon" type="image/svg+xml" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--line:#dedbd3;--muted:#716b63;--green:#dff7e8;--red:#fee2e2;--blue:#eef3ff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.nav{background:#171717;color:#fff;border-radius:20px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}.brand img{width:36px;height:36px}.logout{border:0;background:#fff;color:#171717;border-radius:999px;padding:10px 15px;font:700 13px "DM Sans";cursor:pointer}.login{width:min(500px,100%);margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.07)}h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px;font-weight:800}.muted{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-top:16px}.field span{font-size:13px;font-weight:700}.field input{padding:15px;border:1px solid var(--line);border-radius:14px;font:inherit}.btn{border:0;border-radius:999px;background:var(--yellow);padding:15px 19px;font:800 14px "DM Sans";cursor:pointer}.login .btn{width:100%;margin-top:18px}.error{display:none;background:var(--red);padding:12px;border-radius:12px;margin-top:12px;color:#8c1d1d}.dash{display:none;padding:18px 0 70px}.dash-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:16px 0 20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em}.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left}.stat.active{border-color:#171717;box-shadow:0 0 0 1px #171717}.stat b{display:block;font-size:28px;line-height:1;margin-bottom:6px}.stat span{font-size:12px;color:var(--muted);font-weight:700}.apps{display:grid;gap:12px}.app{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.app.unopened{border-color:#d8b700;box-shadow:0 0 0 1px rgba(216,183,0,.25)}.app-summary{width:100%;border:0;background:transparent;text-align:left;padding:18px 20px;display:flex;justify-content:space-between;gap:18px;align-items:center;cursor:pointer;font:inherit}.app-summary:hover{background:#faf9f5}.name{font-size:19px;font-weight:800}.email{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:6px 9px;border-radius:999px;background:#f0eee9;font-size:11px;font-weight:800;text-transform:uppercase}.badge.new{background:#fff2a6}.badge.accepted{background:var(--green)}.badge.declined{background:var(--red)}.badge.plan{background:var(--blue)}.app-body{display:none;border-top:1px solid var(--line);padding:20px}.app.open .app-body{display:block}.payment-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#171717;color:#fff;border-radius:14px;padding:15px 16px;margin-bottom:16px}.payment-choice small{color:#aaa;display:block;font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:4px}.payment-choice strong{font-size:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.q{background:#faf9f5;border-radius:13px;padding:13px}.q b{display:block;font-size:11px;text-transform:uppercase;color:#858078;margin-bottom:6px}.q span{font-size:14px;line-height:1.5;white-space:pre-wrap}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions button{border-radius:999px;padding:11px 15px;font:800 13px "DM Sans";cursor:pointer}.accept{border:0;background:var(--yellow)}.decline{background:#fff;border:1px solid #c9c4b9}.copy{border:0;background:#171717;color:#fff}.notice{display:none;margin-top:12px;padding:11px 13px;background:#edf7ef;border-radius:12px;font-size:13px}.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:34px;text-align:center;color:var(--muted)}@media(max-width:900px){.statgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:680px){.grid{grid-template-columns:1fr}.app-summary,.dash-head{display:block}.badges{justify-content:flex-start;margin-top:10px}.statgrid{grid-template-columns:repeat(2,1fr)}.login{margin-top:35px;padding:24px}h1{font-size:32px}}
</style></head><body>
<div class="shell top"><div class="nav"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><button id="logout" class="logout" style="display:none">Log out</button></div></div>
<main class="shell">
<section id="login" class="login"><h1>Admin login</h1><p class="muted">Review Academy applications and manage enrollment.</p><label class="field"><span>Username</span><input id="username" autocomplete="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="btn">Log in</button><div id="loginError" class="error"></div></section>
<section id="dash" class="dash"><div class="dash-head"><div><div class="eyebrow">ACADEMY APPLICATIONS</div><h1>Applicants</h1></div><div class="muted">Click an applicant to review. Opening it removes the New status.</div></div><div id="stats" class="statgrid"></div><div id="apps" class="apps"></div></section>
</main>
<script>
const LOGIN_API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api';
const APPS_API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications';
const login=document.getElementById('login'),dash=document.getElementById('dash'),apps=document.getElementById('apps'),logout=document.getElementById('logout'),stats=document.getElementById('stats');let token=sessionStorage.getItem('assistara_admin_token')||'',allApps=[],currentFilter='all';
async function request(api,action,payload={}){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function paymentType(a){const v=String(a.payment_readiness||'').toLowerCase();if(v.includes('payment plan'))return 'Payment plan';if(v.includes('ready at')||v==='yes')return 'Direct payment';return a.payment_readiness||'Not specified'}
function filtered(){return allApps.filter(a=>currentFilter==='all'||(currentFilter==='unopened'&&!a.opened_at)||(currentFilter==='opened'&&a.opened_at)||(currentFilter==='direct'&&paymentType(a)==='Direct payment')||(currentFilter==='plan'&&paymentType(a)==='Payment plan')||(currentFilter==='accepted'&&(a.decision==='accepted'||a.status==='accepted')))}
function renderStats(s){const items=[['all',s.total,'Total'],['unopened',s.unopened,'Unopened'],['opened',s.opened,'Opened'],['direct',s.direct,'Direct payment'],['plan',s.payment_plan,'Payment plan'],['accepted',s.accepted,'Accepted']];stats.innerHTML=items.map(([key,n,label])=>`<button class="stat ${currentFilter===key?'active':''}" onclick="setFilter('${key}')"><b>${n}</b><span>${label}</span></button>`).join('')}
function renderApps(){const list=filtered();apps.innerHTML=list.length?list.map(a=>{const pay=paymentType(a),isPlan=pay==='Payment plan';return `<article class="app ${a.opened_at?'':'unopened'}" data-id="${a.id}"><button class="app-summary" onclick="toggleApp('${a.id}',this)"><div><div class="name">${esc(a.name)}</div><div class="email">${esc(a.email)} · ${new Date(a.created_at).toLocaleString()}</div></div><div class="badges">${!a.opened_at?'<span class="badge new">New</span>':''}<span class="badge ${isPlan?'plan':''}">${esc(pay)}</span><span class="badge ${esc(a.decision||'')}">${esc(a.decision||a.status||'new')}</span><span class="badge">${esc(a.payment_status||'unpaid')}</span>${a.onboarding_completed_at?'<span class="badge accepted">onboarded</span>':''}</div></button><div class="app-body"><div class="payment-choice"><div><small>PAYMENT PREFERENCE</small><strong>${esc(pay)}</strong></div><span>${esc(a.payment_readiness||'')}</span></div><div class="grid"><div class="q"><b>Current situation</b><span>${esc(a.current_situation||'')}</span></div><div class="q"><b>Why remote work</b><span>${esc(a.why_remote_work||'')}</span></div><div class="q"><b>What they tried</b><span>${esc(a.what_tried||'')}</span></div><div class="q"><b>Biggest obstacle</b><span>${esc(a.biggest_obstacle||'')}</span></div><div class="q"><b>Remote work interest</b><span>${esc(a.remote_work_interest||'')}</span></div><div class="q"><b>Weekly commitment</b><span>${esc(a.weekly_commitment||'')}</span></div></div><div class="actions"><button class="accept" onclick="decide('${a.id}','accepted',this)">Accept + send enrollment email</button><button class="decline" onclick="decide('${a.id}','declined',this)">Decline</button>${a.decision==='accepted'?`<button class="copy" onclick="copyLink('${a.enrollment_token}',this)">Copy enrollment link</button>`:''}</div><div class="notice"></div></div></article>`}).join(''):'<div class="empty">No applications in this view.</div>'}
window.setFilter=k=>{currentFilter=k;refreshView()};function refreshView(){const s={total:allApps.length,unopened:allApps.filter(a=>!a.opened_at).length,opened:allApps.filter(a=>a.opened_at).length,direct:allApps.filter(a=>paymentType(a)==='Direct payment').length,payment_plan:allApps.filter(a=>paymentType(a)==='Payment plan').length,accepted:allApps.filter(a=>a.decision==='accepted'||a.status==='accepted').length};renderStats(s);renderApps()}
window.toggleApp=async(id,btn)=>{const card=btn.closest('.app'),opening=!card.classList.contains('open');document.querySelectorAll('.app.open').forEach(x=>{if(x!==card)x.classList.remove('open')});card.classList.toggle('open');if(opening){const a=allApps.find(x=>x.id===id);if(a&&!a.opened_at){try{const j=await request(APPS_API,'open',{id});a.opened_at=j.opened_at||new Date().toISOString();card.classList.remove('unopened');const newBadge=card.querySelector('.badge.new');if(newBadge)newBadge.remove();refreshView();const same=document.querySelector(`.app[data-id="${id}"]`);if(same)same.classList.add('open')}catch(e){}}}}
async function load(){try{const j=await request(APPS_API,'list');allApps=j.applications||[];login.style.display='none';dash.style.display='block';logout.style.display='block';refreshView()}catch(e){sessionStorage.removeItem('assistara_admin_token');token='';login.style.display='block';dash.style.display='none';logout.style.display='none'}}
window.decide=async(id,decision,btn)=>{const card=btn.closest('.app'),notice=card.querySelector('.notice');btn.disabled=true;btn.textContent=decision==='accepted'?'Sending acceptance...':'Updating...';try{const j=await request(APPS_API,'decision',{id,decision});notice.style.display='block';notice.textContent=decision==='accepted'?'Accepted. Enrollment email sent.':'Application declined and email sent.';if(j.enrollment_url)notice.textContent+=' Private enrollment link created.';setTimeout(load,500)}catch(e){notice.style.display='block';notice.textContent=e.message;btn.disabled=false}};
window.copyLink=async(t,btn)=>{await navigator.clipboard.writeText(location.origin+'/academy/checkout?token='+t);const old=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=old,1200)};
document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn'),err=document.getElementById('loginError');b.disabled=true;b.textContent='Logging in...';err.style.display='none';try{const j=await request(LOGIN_API,'login',{username:document.getElementById('username').value.trim(),password:document.getElementById('password').value});token=j.token;sessionStorage.setItem('assistara_admin_token',token);await load()}catch(e){err.textContent=e.message;err.style.display='block'}finally{b.disabled=false;b.textContent='Log in'}};
logout.onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};if(token)load();
</script></body></html>
