<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara</title><link rel="icon" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#171717;--cream:#f7f5ef;--card:#fff;--line:#e2ded4;--muted:#756f66;--yellow:#ffd51f;--green:#e7f8ed;--red:#fde7e5;--orange:#fff1dd;--purple:#f1ebff}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{width:min(1260px,calc(100% - 30px));margin:auto}.topbar{margin-top:16px;background:#171717;color:#fff;border-radius:18px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:34px}.topactions{display:flex;gap:8px}.topactions a,.topactions button{border:0;background:#fff;color:#171717;text-decoration:none;border-radius:10px;padding:9px 13px;font:700 12px "DM Sans";cursor:pointer}.login{max-width:470px;margin:68px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px}.login h1{margin:0 0 6px;font-size:34px}.muted{color:var(--muted)}.field{display:grid;gap:6px;margin-top:13px}.field span{font-size:12px;font-weight:700;color:#5d5851}.field input,.field textarea,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;font:inherit}.field textarea{min-height:78px;resize:vertical}.mainbtn{width:100%;margin-top:16px;border:0;border-radius:11px;background:var(--yellow);padding:13px;font:800 14px "DM Sans";cursor:pointer}.error{display:none;background:var(--red);padding:10px;border-radius:10px;margin-top:10px}.dash{display:none;padding:24px 0 70px}.headrow{display:flex;justify-content:space-between;align-items:end;gap:20px}.headrow h1{font-size:36px;margin:0}.headrow p{margin:6px 0 0;color:var(--muted)}.adminnav{margin:20px 0 16px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 14px;display:flex;align-items:center;gap:24px;overflow:auto}.navitem{position:relative;border:0;background:none;padding:16px 2px 14px;font:700 13px "DM Sans";color:#777168;cursor:pointer;white-space:nowrap}.navitem.active{color:#171717}.navitem.active:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:#171717;border-radius:3px 3px 0 0}.search{margin-left:auto;border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:230px;font:500 13px "DM Sans"}.capacity{background:#171717;color:#fff;border-radius:16px;padding:15px 17px;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px}.stat b{display:block;font-size:27px;line-height:1}.stat span{display:block;margin-top:6px;color:var(--muted);font-size:12px}.funnel{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.funnel div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px 13px;font-size:12px}.funnel b{display:block;font-size:19px}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden}.card.newcard{border-color:#d7b500}.summary{width:100%;border:0;background:transparent;padding:17px 18px;display:flex;justify-content:space-between;align-items:center;text-align:left;cursor:pointer;font:inherit}.summary:hover{background:#fbfaf7}.name{font-size:18px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:5px 8px;border-radius:999px;background:#efede8;font-size:10px;font-weight:800;text-transform:uppercase}.badge.new{background:#fff3a8}.badge.paid,.badge.accepted,.badge.active,.badge.won{background:var(--green)}.badge.pending,.badge.contacted,.badge.responded,.badge.follow_up{background:var(--orange)}.badge.declined,.badge.rejected,.badge.lost,.badge.suspended{background:var(--red)}.badge.qualified,.badge.proposal{background:var(--purple)}.body{display:none;border-top:1px solid var(--line);padding:18px}.card.open .body{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.q{background:#faf9f5;padding:12px;border-radius:11px}.q b{display:block;font-size:10px;text-transform:uppercase;color:#858078;margin-bottom:5px}.q span{font-size:13px;white-space:pre-wrap}.ops{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #eee}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:700 12px "DM Sans";cursor:pointer}.actions .primary{background:var(--yellow);border-color:var(--yellow)}.actions .dark{background:#171717;color:#fff;border-color:#171717}.actions .danger{color:#9b2525;border-color:#e3aaa5}.timeline{margin-top:15px;padding:13px;background:#faf9f5;border-radius:12px}.timeline h3{font-size:12px;margin:0 0 8px}.event{font-size:12px;padding:6px 0;border-top:1px solid #e9e5dd}.event:first-of-type{border:0}.event time{color:var(--muted);margin-left:8px}.empty{padding:30px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.accountbox{display:grid;grid-template-columns:1.2fr .8fr .8fr .8fr;gap:10px}@media(max-width:850px){.stats,.ops,.grid,.accountbox{grid-template-columns:1fr 1fr}.search{min-width:180px}}@media(max-width:650px){.stats,.ops,.grid,.accountbox{grid-template-columns:1fr}.summary{display:block}.badges{margin-top:9px}.search{width:100%;margin:0 0 12px}.adminnav{align-items:flex-start;flex-wrap:wrap;gap:14px;padding-top:8px}}</style></head><body><div class="shell"><div class="topbar"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><div class="topactions"><a href="/login" target="_blank">Student login</a><button id="logout" style="display:none">Log out</button></div></div><section id="login" class="login"><h1>Admin login</h1><p class="muted">Manage leads, applicants, students and access.</p><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="mainbtn">Log in</button><div id="loginError" class="error"></div></section><section id="dash" class="dash"><div class="headrow"><div><h1>Admin</h1><p>One place to run Assistara.</p></div></div><div class="adminnav"><button class="navitem active" data-tab="applicants">Applicants</button><button class="navitem" data-tab="students">Students</button><button class="navitem" data-tab="accounts">Accounts</button><button class="navitem" data-tab="webinar">Free webinar</button><button class="navitem" data-tab="b2b">B2B</button><input id="search" class="search" placeholder="Search name, email, company..."></div><div id="capacity" class="capacity"></div><div id="stats" class="stats"></div><div id="funnel"></div><div id="cards" class="cards"></div></section></div><script>const LOGIN='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications',ACC='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-accounts';let token=sessionStorage.getItem('assistara_admin_token')||'',apps=[],web=[],b2b=[],activity=[],accounts=[],cap={},tab='applicants';const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function req(action,p={},api=API){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify({action,...p})}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function match(...v){const q=$('search').value.trim().toLowerCase();return !q||v.some(x=>String(x||'').toLowerCase().includes(q))}function badge(x){return `<span class="badge ${esc(x)}">${esc(String(x||'').replaceAll('_',' '))}</span>`}function stats(items){$('stats').innerHTML=items.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}function events(type,id,a){let e=activity.filter(x=>x.entity_type===type&&x.entity_id===id);if(type==='application'){[['Applied',a.created_at],['Accepted',a.accepted_at],['Paid',a.paid_at],['Account created',a.onboarding_completed_at]].forEach(x=>x[1]&&e.push({action:x[0],created_at:x[1]}))}e.sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));return `<div class="timeline"><h3>Activity</h3>${e.length?e.slice(0,10).map(x=>`<div class="event">${esc(String(x.action).replaceAll('_',' '))}<time>${new Date(x.created_at).toLocaleString()}</time></div>`).join(''):'<div class="event">No activity yet</div>'}</div>`}function ops(x,notes=x.admin_notes||x.notes||''){return `<div class="ops"><label class="field"><span>Internal notes</span><textarea id="notes-${x.id}">${esc(notes)}</textarea></label><label class="field"><span>Next action</span><input id="next-${x.id}" value="${esc(x.next_action||'')}"></label><label class="field"><span>Follow up</span><input id="follow-${x.id}" type="datetime-local" value="${x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):''}"></label></div>`}function dt(id){const v=$(id)?.value;return v?new Date(v).toISOString():null}function render(){ $('capacity').style.display=tab==='applicants'?'block':'none'; $('capacity').innerHTML=tab==='applicants'?`<b>${cap.paid||0}/${cap.limit||15} paid places filled</b> · ${cap.spots_left??15} spots left`:'';$('funnel').innerHTML='';if(tab==='applicants'){stats([[apps.length,'Applicants'],[apps.filter(x=>!x.opened_at).length,'New'],[apps.filter(x=>x.decision==='accepted').length,'Accepted'],[apps.filter(x=>x.payment_status==='paid').length,'Paid']]);renderApps(false)}else if(tab==='students'){let s=apps.filter(x=>x.payment_status==='paid'||x.onboarding_completed_at);stats([[s.length,'Students'],[s.filter(x=>x.onboarding_completed_at).length,'Onboarded'],[s.filter(x=>x.auth_user_id).length,'With account'],[s.filter(x=>x.suspended_at).length,'Suspended']]);renderStudents()}else if(tab==='accounts'){stats([[accounts.length,'Accounts'],[accounts.filter(x=>x.last_sign_in_at).length,'Have logged in'],[apps.filter(x=>x.suspended_at).length,'Suspended'],[accounts.filter(x=>!x.last_sign_in_at).length,'Never logged in']]);renderAccounts()}else if(tab==='webinar'){let reg=web.length,att=web.filter(x=>x.attended).length,ap=web.filter(x=>x.application_id).length,pur=web.filter(x=>x.purchased).length;stats([[reg,'Registered'],[att,'Attended'],[ap,'Applied'],[pur,'Purchased']]);$('funnel').innerHTML=`<div class="funnel"><div><b>${reg}</b>Registered</div><div><b>${reg?Math.round(att/reg*100):0}%</b>Attend rate</div><div><b>${reg?Math.round(ap/reg*100):0}%</b>Apply rate</div><div><b>${reg?Math.round(pur/reg*100):0}%</b>Purchase rate</div></div>`;renderWeb()}else{stats([[b2b.length,'Leads'],[b2b.filter(x=>x.status==='qualified').length,'Qualified'],[b2b.filter(x=>x.status==='proposal').length,'Proposal'],[b2b.filter(x=>x.status==='won').length,'Won']]);renderB2B()}}function renderApps(studentOnly){const l=apps.filter(x=>(!studentOnly||x.auth_user_id)&&match(x.name,x.email,x.status,x.payment_status,x.next_action));$('cards').innerHTML=l.length?l.map(x=>`<article class="card ${x.opened_at?'':'newcard'}"><button class="summary" onclick="toggle(this,'${x.id}')"><div><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.email)} · ${new Date(x.created_at).toLocaleDateString()}</div></div><div class="badges">${!x.opened_at?badge('new'):''}${x.decision?badge(x.decision):''}${badge(x.payment_status||'not paid')}</div></button><div class="body"><div class="grid"><div class="q"><b>Current situation</b><span>${esc(x.current_situation)}</span></div><div class="q"><b>Why remote work</b><span>${esc(x.why_remote_work)}</span></div><div class="q"><b>Biggest obstacle</b><span>${esc(x.biggest_obstacle)}</span></div><div class="q"><b>Payment preference</b><span>${esc(x.payment_readiness)}</span></div></div>${ops(x)}<div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button onclick="saveApp('${x.id}')">Save notes & follow-up</button>${x.decision==='accepted'?`<button disabled>Accepted</button><button onclick="decision('${x.id}','accepted',true)">Resend acceptance</button>`:x.decision==='declined'?`<button disabled>Declined</button><button onclick="decision('${x.id}','declined',true)">Resend decline</button>`:`<button class="primary" onclick="decision('${x.id}','accepted')">Accept + email</button><button onclick="decision('${x.id}','declined')">Decline</button>`}<button class="danger" onclick="delApp('${x.id}')">Delete applicant${x.auth_user_id?' + account':''}</button></div>${events('application',x.id,x)}</div></article>`).join(''):'<div class="empty">Nothing here yet.</div>'}function renderStudents(){const l=apps.filter(x=>(x.payment_status==='paid'||x.onboarding_completed_at)&&match(x.name,x.email,x.onboarding_phone,x.onboarding_goal));$('cards').innerHTML=l.length?l.map(x=>`<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.name)}</div><div class="sub">${esc(x.email)}</div></div><div class="badges">${badge(x.payment_status||'not paid')}${x.onboarding_completed_at?badge('onboarded'):badge('onboarding pending')}${x.auth_user_id?badge('account'):''}</div></button><div class="body"><div class="grid"><div class="q"><b>Phone</b><span>${esc(x.onboarding_phone||'Not added')}</span></div><div class="q"><b>Goal</b><span>${esc(x.onboarding_goal||'Not added')}</span></div><div class="q"><b>Availability</b><span>${esc(x.onboarding_availability||'Not added')}</span></div><div class="q"><b>Payment</b><span>${esc(x.payment_status||'')}</span></div></div>${ops(x)}<div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button onclick="saveApp('${x.id}')">Save student notes</button>${x.auth_user_id?`<button onclick="resetPw('${x.id}')">Send password reset</button><button onclick="suspend('${x.id}',${!x.suspended_at})">${x.suspended_at?'Reactivate account':'Suspend account'}</button>`:''}</div>${events('application',x.id,x)}</div></article>`).join(''):'<div class="empty">No students yet.</div>'}function renderAccounts(){const l=accounts.filter(a=>match(a.name,a.email));$('cards').innerHTML=l.length?l.map(a=>{const app=apps.find(x=>x.auth_user_id===a.id)||apps.find(x=>x.id===a.application_id)||{};return `<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(a.name||app.name||'Student account')}</div><div class="sub">${esc(a.email)}</div></div><div class="badges">${badge(app.suspended_at?'suspended':'active')}${a.last_sign_in_at?badge('logged in'):badge('never logged in')}</div></button><div class="body"><div class="accountbox"><div class="q"><b>Account created</b><span>${a.created_at?new Date(a.created_at).toLocaleString():'Unknown'}</span></div><div class="q"><b>Last login</b><span>${a.last_sign_in_at?new Date(a.last_sign_in_at).toLocaleString():'Never'}</span></div><div class="q"><b>Phone</b><span>${esc(app.onboarding_phone||'Not added')}</span></div><div class="q"><b>Payment</b><span>${esc(app.payment_status||'Unknown')}</span></div></div><label class="field"><span>Display name</span><input id="accname-${a.id}" value="${esc(a.name||app.name||'')}"></label><div class="actions"><button class="dark" onclick="copy('${esc(a.email)}')">Copy email</button><button onclick="saveAccount('${a.id}','${app.id||''}')">Save name</button>${app.id?`<button onclick="resetPw('${app.id}')">Send password reset</button><button onclick="suspend('${app.id}',${!app.suspended_at})">${app.suspended_at?'Reactivate':'Suspend'} account</button><button class="danger" onclick="delAccount('${app.id}')">Delete account</button>`:''}</div>${app.id?events('application',app.id,app):''}</div></article>`}).join(''):'<div class="empty">No Academy accounts yet.</div>'}function renderWeb(){const l=web.filter(x=>match(x.name,x.email,x.phone,x.lead_status,x.next_action));$('cards').innerHTML=l.length?l.map(x=>`<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.name||'No name')}</div><div class="sub">${esc(x.email)}</div></div><div class="badges">${badge(x.lead_status||'registered')}${x.attended?badge('attended'):''}${x.application_id?badge('applied'):''}${x.purchased?badge('paid'):''}</div></button><div class="body"><div class="grid"><div class="q"><b>Phone</b><span>${esc(x.phone||'Not provided')}</span></div><div class="q"><b>Source</b><span>${esc(x.source||x.utm_source||'')}</span></div></div><div class="ops"><label class="field"><span>Status</span><select id="status-${x.id}">${['registered','attended','follow_up','applied','qualified','purchased','not_interested'].map(s=>`<option ${s===(x.lead_status||'registered')?'selected':''}>${s}</option>`).join('')}</select></label><label class="field"><span>Next action</span><input id="next-${x.id}" value="${esc(x.next_action||'')}"></label><label class="field"><span>Follow up</span><input id="follow-${x.id}" type="datetime-local" value="${x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):''}"></label></div><label class="field"><span>Internal notes</span><textarea id="notes-${x.id}">${esc(x.admin_notes||'')}</textarea></label><div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button onclick="saveWeb('${x.id}')">Save</button><button class="danger" onclick="delWeb('${x.id}')">Delete signup</button></div>${events('webinar',x.id,x)}</div></article>`).join(''):'<div class="empty">No webinar registrations yet.</div>'}function renderB2B(){const l=b2b.filter(x=>match(x.name,x.email,x.company,x.status,x.next_action));$('cards').innerHTML=l.length?l.map(x=>`<article class="card"><button class="summary" onclick="toggle(this)"><div><div class="name">${esc(x.company||x.name||'B2B lead')}</div><div class="sub">${esc(x.name)} · ${esc(x.email)}</div></div><div class="badges">${badge(x.status||'new')}</div></button><div class="body"><div class="grid"><div class="q"><b>Support needed</b><span>${esc(x.support_level)}</span></div><div class="q"><b>Time-consuming tasks</b><span>${esc(x.time_thieves)}</span></div></div><div class="ops"><label class="field"><span>Stage</span><select id="status-${x.id}">${['new','contacted','responded','qualified','proposal','won','lost'].map(s=>`<option ${s===(x.status||'new')?'selected':''}>${s}</option>`).join('')}</select></label><label class="field"><span>Next action</span><input id="next-${x.id}" value="${esc(x.next_action||'')}"></label><label class="field"><span>Follow up</span><input id="follow-${x.id}" type="datetime-local" value="${x.follow_up_at?new Date(x.follow_up_at).toISOString().slice(0,16):''}"></label></div><label class="field"><span>Notes</span><textarea id="notes-${x.id}">${esc(x.notes||'')}</textarea></label><div class="actions"><button class="dark" onclick="copy('${esc(x.email)}')">Copy email</button><button onclick="saveB2B('${x.id}')">Save</button><button class="danger" onclick="delB2B('${x.id}')">Delete lead</button></div>${events('b2b',x.id,x)}</div></article>`).join(''):'<div class="empty">No B2B leads yet.</div>'}window.toggle=(b,id)=>{b.closest('.card').classList.toggle('open');if(id)req('open',{id}).catch(()=>{})};window.saveApp=async id=>{await req('update_application',{id,admin_notes:$('notes-'+id).value,next_action:$('next-'+id).value,follow_up_at:dt('follow-'+id)});await load()};window.saveWeb=async id=>{await req('update_webinar',{id,lead_status:$('status-'+id).value,admin_notes:$('notes-'+id).value,next_action:$('next-'+id).value,follow_up_at:dt('follow-'+id)});await load()};window.saveB2B=async id=>{await req('update_b2b',{id,status:$('status-'+id).value,notes:$('notes-'+id).value,next_action:$('next-'+id).value,follow_up_at:dt('follow-'+id)});await load()};window.saveAccount=async(uid,appId)=>{const name=$('accname-'+uid).value;await req('update_profile',{user_id:uid,name},ACC);if(appId)await req('update_application',{id:appId,name});await load()};window.decision=async(id,d,resend=false)=>{if(!resend&&!confirm(d==='accepted'?'Accept and send enrollment email?':'Decline and send email?'))return;await req(resend?'resend_decision':'decision',{id,decision:d});await load()};window.resetPw=async id=>{await req('send_password_reset',{id});alert('Password reset sent')};window.suspend=async(id,s)=>{await req('suspend_account',{id,suspended:s});await load()};window.delApp=async id=>{if(!confirm('Permanently delete this applicant and linked account if one exists?'))return;try{await req('delete_application',{id});await load()}catch(e){alert(e.message)}};window.delWeb=async id=>{if(!confirm('Delete this webinar signup?'))return;try{await req('delete_signup',{id});await load()}catch(e){alert(e.message)}};window.delB2B=async id=>{if(!confirm('Delete this B2B lead?'))return;try{await req('delete_b2b',{id});await load()}catch(e){alert(e.message)}};window.delAccount=async id=>{if(!confirm('Delete this login account? Application and payment history stay.'))return;await req('delete_account',{id});await load()};window.copy=s=>navigator.clipboard.writeText(s);async function load(){const[d,a]=await Promise.all([req('list'),req('list',{},ACC)]);apps=d.applications||[];web=d.signups||[];b2b=d.b2b||[];activity=d.activity||[];cap=d.capacity||{};accounts=a.accounts||[];render()}document.querySelectorAll('.navitem').forEach(x=>x.onclick=()=>{tab=x.dataset.tab;document.querySelectorAll('.navitem').forEach(y=>y.classList.toggle('active',y===x));render()});$('search').oninput=render;$('loginBtn').onclick=async()=>{try{const d=await req('login',{username:$('username').value,password:$('password').value},LOGIN);token=d.token;sessionStorage.setItem('assistara_admin_token',token);show();await load()}catch(e){$('loginError').style.display='block';$('loginError').textContent=e.message}};$('logout').onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};function show(){$('login').style.display='none';$('dash').style.display='block';$('logout').style.display='inline-block'}if(token){show();load().catch(()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()})}</script></body></html>
