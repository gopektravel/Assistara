<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Assistara</title>
<link rel="icon" href="/assistara-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--line:#dedbd3;--muted:#716b63;--green:#dff7e8;--greenInk:#17603a;--red:#fee2e2;--redInk:#9b2525;--orange:#fff0d8;--orangeInk:#9a5a00;--blue:#eef3ff;--purple:#f0e9ff;--purpleInk:#5d3a9b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{width:min(1220px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.nav{background:#171717;color:#fff;border-radius:20px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}.brand img{width:36px;height:36px}.logout{border:0;background:#fff;color:#171717;border-radius:999px;padding:10px 15px;font:700 13px "DM Sans";cursor:pointer}.login{width:min(500px,100%);margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.07)}h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-top:16px}.field span{font-size:13px;font-weight:700}.field input{padding:15px;border:1px solid var(--line);border-radius:14px;font:inherit}.btn{border:0;border-radius:999px;background:var(--yellow);padding:15px 19px;font:800 14px "DM Sans";cursor:pointer}.login .btn{width:100%;margin-top:18px}.error{display:none;background:var(--red);padding:12px;border-radius:12px;margin-top:12px;color:var(--redInk)}.dash{display:none;padding:18px 0 70px}.dash-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:16px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font:800 13px "DM Sans";cursor:pointer}.tab.active{background:#171717;color:#fff;border-color:#171717}.search{margin-left:auto;min-width:250px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font:500 13px "DM Sans"}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left}.stat.click{cursor:pointer}.stat.active{border-color:#171717;box-shadow:0 0 0 1px #171717}.stat b{display:block;font-size:28px;line-height:1;margin-bottom:6px}.stat span{font-size:12px;color:var(--muted);font-weight:700}.capacity{background:#171717;color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.capacity strong{font-size:20px}.capacity span{color:#bbb;font-size:13px}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.card.unopened{border-color:#d8b700}.summary{width:100%;border:0;background:transparent;text-align:left;padding:18px 20px;display:flex;justify-content:space-between;gap:18px;align-items:center;font:inherit}.summary.click{cursor:pointer}.summary.click:hover{background:#faf9f5}.name{font-size:19px;font-weight:800}.email{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:6px 9px;border-radius:999px;background:#f0eee9;font-size:11px;font-weight:800;text-transform:uppercase}.badge.new{background:#fff2a6}.badge.accepted,.badge.account,.badge.paid{background:var(--green);color:var(--greenInk)}.badge.declined{background:var(--red);color:var(--redInk)}.badge.plan{background:var(--blue)}.badge.pending{background:var(--orange);color:var(--orangeInk)}.badge.waitlisted{background:var(--purple);color:var(--purpleInk)}.body{display:none;border-top:1px solid var(--line);padding:20px}.card.open .body{display:block}.payment-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#171717;color:#fff;border-radius:14px;padding:15px 16px;margin-bottom:16px}.payment-choice small{color:#aaa;display:block;font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.q{background:#faf9f5;border-radius:13px;padding:13px}.q b{display:block;font-size:11px;text-transform:uppercase;color:#858078;margin-bottom:6px}.q span{font-size:14px;line-height:1.5;white-space:pre-wrap}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions button{border-radius:999px;padding:11px 15px;font:800 13px "DM Sans";cursor:pointer}.accept{border:0;background:var(--yellow)}.accepted-btn{border:0;background:var(--green);color:var(--greenInk);cursor:default!important}.decline{background:#fff;border:1px solid #c9c4b9}.declined-btn{border:0;background:var(--red);color:var(--redInk);cursor:default!important}.copy{border:0;background:#171717;color:#fff}.secondary{border:1px solid var(--line);background:#fff}.delete{border:1px solid #e3aaa5;background:#fff;color:#9b2525}.notice{display:none;margin-top:12px;padding:11px 13px;background:#edf7ef;border-radius:12px;font-size:13px}.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:34px;text-align:center;color:var(--muted)}.overview-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px}.panel h2{margin:0 0 12px;font-size:19px}.minirow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid #eee}.minirow:first-of-type{border-top:0}.minirow strong{font-size:14px}.minirow span{font-size:13px;color:var(--muted)}@media(max-width:900px){.statgrid,.overview-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.grid,.overview-grid{grid-template-columns:1fr}.summary,.dash-head{display:block}.badges{justify-content:flex-start;margin-top:10px}.capacity{display:block}.capacity span{display:block;margin-top:5px}.login{margin-top:35px;padding:24px}.search{width:100%;margin-left:0}h1{font-size:32px}}
</style>
</head>
<body>
<div class="shell top"><div class="nav"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><button id="logout" class="logout" style="display:none">Log out</button></div></div>
<main class="shell">
<section id="login" class="login"><h1>Admin login</h1><p class="muted">Manage Assistara leads, Academy applicants, students and webinar registrations.</p><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="btn">Log in</button><div id="loginError" class="error"></div></section>
<section id="dash" class="dash"><div class="dash-head"><div><div class="eyebrow">ASSISTARA</div><h1>Admin</h1></div></div><div class="tabs"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="applicants">Academy applicants</button><button class="tab" data-tab="students">Students & accounts</button><button class="tab" data-tab="webinar">Free webinar</button><button class="tab" data-tab="b2b">B2B leads</button><input id="search" class="search" placeholder="Search name, email, company..."></div><div id="capacity" class="capacity"></div><div id="stats" class="statgrid"></div><div id="cards" class="cards"></div></section>
</main>
<script>
const LOGIN_API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications';
const login=document.getElementById('login'),dash=document.getElementById('dash'),cards=document.getElementById('cards'),logout=document.getElementById('logout'),stats=document.getElementById('stats'),capacity=document.getElementById('capacity'),search=document.getElementById('search');
let token=sessionStorage.getItem('assistara_admin_token')||'',apps=[],signups=[],b2b=[],cap={limit:15,paid:0,spots_left:15},tab='overview',filter='all';
async function request(action,payload={},api=API){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function paymentType(a){const v=String(a.payment_readiness||'').toLowerCase();if(v.includes('payment plan'))return'Payment plan';if(v.includes('ready at')||v==='yes')return'Direct payment';return a.payment_readiness||'Not specified'}
function payClass(v){v=String(v||'').toLowerCase();return v==='paid'?'paid':v==='pending'?'pending':''}
function qmatch(...vals){const q=search.value.trim().toLowerCase();return !q||vals.some(v=>String(v||'').toLowerCase().includes(q))}
function setTab(t){tab=t;filter='all';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));search.oninput=()=>render();
function render(){renderStats();renderCards()}
function renderStats(){if(tab==='overview'){capacity.style.display='flex';capacity.innerHTML=`<div><strong>${cap.paid}/${cap.limit} paid Academy places filled</strong><span>Founding Cohort</span></div><div><strong>${cap.spots_left}</strong><span>spots left</span></div>`;const items=[[apps.length,'Academy applicants'],[apps.filter(a=>a.payment_status==='paid').length,'Paid students'],[apps.filter(a=>a.auth_user_id).length,'Accounts'],[signups.length,'Webinar signups'],[b2b.length,'B2B leads'],[apps.filter(a=>a.status==='waitlisted').length,'Waitlist']];stats.innerHTML=items.map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');return}
capacity.style.display=tab==='applicants'?'flex':'none';if(tab==='applicants')capacity.innerHTML=`<div><strong>${cap.paid}/${cap.limit} paid places filled</strong><span>Founding Cohort capacity</span></div><div><strong>${cap.spots_left}</strong><span>spots left</span></div>`;
let items=[];if(tab==='applicants'){items=[['all',apps.length,'Total'],['new',apps.filter(a=>!a.opened_at).length,'New'],['accepted',apps.filter(a=>a.decision==='accepted'||a.status==='accepted').length,'Accepted'],['declined',apps.filter(a=>a.decision==='declined').length,'Declined'],['pending',apps.filter(a=>a.payment_status==='pending').length,'Payment pending'],['paid',apps.filter(a=>a.payment_status==='paid').length,'Paid'],['plan',apps.filter(a=>paymentType(a)==='Payment plan').length,'Payment plan'],['waitlist',apps.filter(a=>a.status==='waitlisted').length,'Waitlist']]}else if(tab==='students'){items=[['all',apps.filter(a=>a.auth_user_id).length,'Accounts'],['paid',apps.filter(a=>a.payment_status==='paid').length,'Paid'],['onboarded',apps.filter(a=>a.onboarding_completed_at).length,'Onboarded']]}else if(tab==='webinar'){items=[['all',signups.length,'Registered'],['attended',signups.filter(x=>x.attended).length,'Attended'],['applied',signups.filter(x=>x.application_id).length,'Applied'],['purchased',signups.filter(x=>x.purchased).length,'Purchased']]}else if(tab==='b2b'){items=[['all',b2b.length,'Leads'],['new',b2b.filter(x=>String(x.status||'new').toLowerCase()==='new').length,'New']]}
stats.innerHTML=items.map(([k,n,l])=>`<button class="stat click ${filter===k?'active':''}" onclick="setFilter('${k}')"><b>${n}</b><span>${l}</span></button>`).join('')}
window.setFilter=k=>{filter=k;render()};
function renderCards(){if(tab==='overview'){cards.innerHTML=`<div class="overview-grid"><section class="panel"><h2>Academy</h2><div class="minirow"><strong>Applicants</strong><span>${apps.length}</span></div><div class="minirow"><strong>Paid places</strong><span>${cap.paid}/${cap.limit}</span></div><div class="minirow"><strong>Student accounts</strong><span>${apps.filter(a=>a.auth_user_id).length}</span></div><div class="minirow"><strong>Payment plans requested</strong><span>${apps.filter(a=>paymentType(a)==='Payment plan').length}</span></div></section><section class="panel"><h2>Lead generation</h2><div class="minirow"><strong>Free webinar registrations</strong><span>${signups.length}</span></div><div class="minirow"><strong>Webinar attendees</strong><span>${signups.filter(x=>x.attended).length}</span></div><div class="minirow"><strong>B2B enquiries</strong><span>${b2b.length}</span></div></section></div>`;return}
if(tab==='applicants')return renderApplicants(false);if(tab==='students')return renderApplicants(true);if(tab==='webinar')return renderWebinar();if(tab==='b2b')return renderB2B()}
function appFiltered(studentOnly){return apps.filter(a=>{if(studentOnly&&!a.auth_user_id)return false;if(!qmatch(a.name,a.email,a.onboarding_phone,a.status,a.payment_status))return false;if(filter==='all')return true;if(filter==='new')return !a.opened_at;if(filter==='accepted')return a.decision==='accepted'||a.status==='accepted';if(filter==='declined')return a.decision==='declined';if(filter==='pending')return a.payment_status==='pending';if(filter==='paid')return a.payment_status==='paid';if(filter==='plan')return paymentType(a)==='Payment plan';if(filter==='waitlist')return a.status==='waitlisted';if(filter==='onboarded')return !!a.onboarding_completed_at;return true})}
function renderApplicants(studentOnly){const list=appFiltered(studentOnly);cards.innerHTML=list.length?list.map(a=>{const pay=paymentType(a),statusClass=a.status==='waitlisted'?'waitlisted':(a.decision||''),accepted=a.decision==='accepted'||a.status==='accepted',declined=a.decision==='declined';return`<article class="card ${a.opened_at?'':'unopened'}" data-id="${a.id}"><button class="summary click" onclick="toggleApp('${a.id}',this)"><div><div class="name">${esc(a.name)}</div><div class="email">${esc(a.email)} · ${new Date(a.created_at).toLocaleString()}</div></div><div class="badges">${!a.opened_at&&!studentOnly?'<span class="badge new">New</span>':''}<span class="badge ${pay==='Payment plan'?'plan':''}">${esc(pay)}</span><span class="badge ${statusClass}">${esc(a.status||a.decision||'new')}</span><span class="badge ${payClass(a.payment_status)}">${esc(a.payment_status||'not paid')}</span>${a.auth_user_id?'<span class="badge account">account</span>':''}</div></button><div class="body"><div class="payment-choice"><div><small>PAYMENT PREFERENCE</small><strong>${esc(pay)}</strong></div><span>${esc(a.payment_readiness||'')}</span></div><div class="grid"><div class="q"><b>Current situation</b><span>${esc(a.current_situation||'')}</span></div><div class="q"><b>Why remote work</b><span>${esc(a.why_remote_work||'')}</span></div><div class="q"><b>What they tried</b><span>${esc(a.what_tried||'')}</span></div><div class="q"><b>Biggest obstacle</b><span>${esc(a.biggest_obstacle||'')}</span></div><div class="q"><b>Remote work interest</b><span>${esc(a.remote_work_interest||'')}</span></div><div class="q"><b>Weekly commitment</b><span>${esc(a.weekly_commitment||'')}</span></div><div class="q"><b>Payment</b><span>${a.payment_status==='paid'?`${esc(a.purchase_currency||'PHP')} ${esc(a.purchase_amount||'')} · ${a.paid_at?new Date(a.paid_at).toLocaleString():''}`:esc(a.payment_status||'not paid')}</span></div><div class="q"><b>Account</b><span>${a.auth_user_id?'Created':'Not created'}</span></div><div class="q"><b>Phone</b><span>${esc(a.onboarding_phone||'Not added')}</span></div><div class="q"><b>Onboarding</b><span>${a.onboarding_completed_at?'Completed '+new Date(a.onboarding_completed_at).toLocaleString():'Not completed'}</span></div><div class="q"><b>Student goal</b><span>${esc(a.onboarding_goal||'Not added')}</span></div><div class="q"><b>Availability</b><span>${esc(a.onboarding_availability||'Not added')}</span></div></div><div class="actions">${accepted?'<button class="accepted-btn" disabled>Accepted</button>':declined?'':'<button class="accept" onclick="decision(\''+a.id+'\',\'accepted\',this)">Accept + send enrollment email</button>'}${declined?'<button class="declined-btn" disabled>Declined</button>':accepted?'':'<button class="decline" onclick="decision(\''+a.id+'\',\'declined\',this)">Decline + send email</button>'}${accepted?`<button class="secondary" onclick="resend('${a.id}','accepted',this)">Resend acceptance email</button><button class="copy" onclick="copyLink('${a.enrollment_token}',this)">Copy enrollment link</button>`:''}${declined?`<button class="secondary" onclick="resend('${a.id}','declined',this)">Resend decline email</button>`:''}${a.auth_user_id?`<button class="secondary" onclick="resetPassword('${a.id}',this)">Send password reset</button>`:''}${a.payment_status!=='paid'&&!a.auth_user_id?`<button class="delete" onclick="deleteApplicant('${a.id}')">Delete applicant</button>`:''}</div><div class="notice"></div></div></article>`}).join(''):'<div class="empty">No records in this view.</div>'}
function renderWebinar(){let list=signups.filter(s=>qmatch(s.name,s.email,s.phone,s.source,s.status));if(filter==='attended')list=list.filter(x=>x.attended);if(filter==='applied')list=list.filter(x=>x.application_id);if(filter==='purchased')list=list.filter(x=>x.purchased);cards.innerHTML=list.length?list.map(s=>`<article class="card"><div class="summary"><div><div class="name">${esc(s.name||'No name')}</div><div class="email">${esc(s.email)} · ${new Date(s.created_at).toLocaleString()}</div></div><div class="badges"><span class="badge">${esc(s.status||'registered')}</span>${s.attended?'<span class="badge paid">attended</span>':''}${s.application_id?'<span class="badge accepted">applied</span>':''}${s.purchased?'<span class="badge paid">purchased</span>':''}</div></div><div class="body" style="display:block"><div class="grid"><div class="q"><b>Phone</b><span>${esc(s.phone||'Not provided')}</span></div><div class="q"><b>Source</b><span>${esc(s.source||'')}</span></div><div class="q"><b>Joined webinar</b><span>${s.joined_at?new Date(s.joined_at).toLocaleString():'Not yet'}</span></div><div class="q"><b>UTM</b><span>${esc([s.utm_source,s.utm_medium,s.utm_campaign,s.utm_content,s.utm_term].filter(Boolean).join(' / ')||'None')}</span></div></div><div class="actions"><button class="delete" onclick="deleteSignup('${s.id}')">Delete signup</button></div></div></article>`).join(''):'<div class="empty">No webinar registrations in this view.</div>'}
function renderB2B(){let list=b2b.filter(x=>qmatch(x.name,x.email,x.company,x.time_thieves,x.support_level,x.status));if(filter==='new')list=list.filter(x=>String(x.status||'new').toLowerCase()==='new');cards.innerHTML=list.length?list.map(x=>`<article class="card"><div class="summary"><div><div class="name">${esc(x.name||'No name')}</div><div class="email">${esc(x.email)} · ${new Date(x.created_at).toLocaleString()}</div></div><div class="badges"><span class="badge new">${esc(x.status||'new')}</span></div></div><div class="body" style="display:block"><div class="grid"><div class="q"><b>Company</b><span>${esc(x.company||'Not provided')}</span></div><div class="q"><b>Support level</b><span>${esc(x.support_level||'')}</span></div><div class="q"><b>Time thieves</b><span>${esc(x.time_thieves||'')}</span></div><div class="q"><b>Source</b><span>${esc(x.source||'')}</span></div><div class="q"><b>Notes</b><span>${esc(x.notes||'')}</span></div></div><div class="actions"><button class="copy" onclick="navigator.clipboard.writeText('${esc(x.email)}')">Copy email</button><button class="delete" onclick="deleteB2B('${x.id}')">Delete lead</button></div></div></article>`).join(''):'<div class="empty">No B2B leads in this view.</div>'}
window.toggleApp=async(id,btn)=>{const card=btn.closest('.card'),opening=!card.classList.contains('open');document.querySelectorAll('.card.open').forEach(x=>{if(x!==card)x.classList.remove('open')});card.classList.toggle('open');if(opening){const a=apps.find(x=>x.id===id);if(a&&!a.opened_at){try{const j=await request('open',{id});a.opened_at=j.opened_at||new Date().toISOString()}catch(e){}}}}
window.decision=async(id,d,btn)=>{if(!confirm(d==='accepted'?'Accept this applicant and send the enrollment email?':'Decline this applicant and send the decline email?'))return;btn.disabled=true;try{await request('decision',{id,decision:d});await load()}catch(e){alert(e.message);btn.disabled=false}}
window.resend=async(id,d,btn)=>{btn.disabled=true;const old=btn.textContent;btn.textContent='Sending...';try{await request('resend_decision',{id,decision:d});btn.textContent='Sent';setTimeout(()=>{btn.textContent=old;btn.disabled=false},1200)}catch(e){alert(e.message);btn.textContent=old;btn.disabled=false}}
window.resetPassword=async(id,btn)=>{if(!confirm('Send this student a secure password reset email?'))return;btn.disabled=true;const old=btn.textContent;btn.textContent='Sending...';try{await request('send_password_reset',{id});btn.textContent='Reset sent';setTimeout(()=>{btn.textContent=old;btn.disabled=false},1500)}catch(e){alert(e.message);btn.textContent=old;btn.disabled=false}}
window.copyLink=async(t,btn)=>{await navigator.clipboard.writeText(location.origin+'/academy/checkout?token='+t);const old=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=old,1200)}
window.deleteApplicant=async id=>{if(!confirm('Delete this applicant? This cannot be undone.'))return;try{await request('delete_application',{id});await load()}catch(e){alert(e.message)}}
window.deleteSignup=async id=>{if(!confirm('Delete this webinar signup?'))return;try{await request('delete_signup',{id});await load()}catch(e){alert(e.message)}}
window.deleteB2B=async id=>{if(!confirm('Delete this B2B lead?'))return;try{await request('delete_b2b',{id});await load()}catch(e){alert(e.message)}}
async function load(){try{const j=await request('list');apps=j.applications||[];signups=j.signups||[];b2b=j.b2b||[];cap=j.capacity||cap;login.style.display='none';dash.style.display='block';logout.style.display='block';render()}catch(e){sessionStorage.removeItem('assistara_admin_token');token='';login.style.display='block';dash.style.display='none';logout.style.display='none'}}
document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn'),err=document.getElementById('loginError');b.disabled=true;b.textContent='Logging in...';err.style.display='none';try{const j=await request('login',{username:document.getElementById('username').value.trim(),password:document.getElementById('password').value},LOGIN_API);token=j.token;sessionStorage.setItem('assistara_admin_token',token);await load()}catch(e){err.textContent=e.message;err.style.display='block'}finally{b.disabled=false;b.textContent='Log in'}};logout.onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};if(token)load();
</script>
</body>
</html>
