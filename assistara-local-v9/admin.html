<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara</title><link rel="icon" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--line:#dedbd3;--muted:#716b63;--green:#dff7e8;--greenInk:#17603a;--red:#fee2e2;--redInk:#9b2525;--orange:#fff0d8;--orangeInk:#9a5a00;--blue:#eef3ff;--purple:#f0e9ff;--purpleInk:#5d3a9b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{width:min(1220px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.nav{background:#171717;color:#fff;border-radius:20px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}.brand img{width:36px;height:36px}.nav-actions{display:flex;gap:8px}.nav a,.logout{border:0;background:#fff;color:#171717;border-radius:999px;padding:10px 15px;font:700 13px "DM Sans";cursor:pointer;text-decoration:none}.login{width:min(500px,100%);margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.07)}h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-top:16px}.field span{font-size:13px;font-weight:700}.field input,.field textarea,.field select{padding:14px;border:1px solid var(--line);border-radius:14px;font:inherit;background:#fff}.field textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:999px;background:var(--yellow);padding:15px 19px;font:800 14px "DM Sans";cursor:pointer}.login .btn{width:100%;margin-top:18px}.error{display:none;background:var(--red);padding:12px;border-radius:12px;margin-top:12px;color:var(--redInk)}.dash{display:none;padding:18px 0 70px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font:800 13px "DM Sans";cursor:pointer}.tab.active{background:#171717;color:#fff;border-color:#171717}.search{margin-left:auto;min-width:250px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font:500 13px "DM Sans"}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left}.stat b{display:block;font-size:28px;line-height:1;margin-bottom:6px}.stat span{font-size:12px;color:var(--muted);font-weight:700}.capacity{background:#171717;color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px;display:flex;justify-content:space-between}.cards{display:grid;gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.card.unopened{border-color:#d8b700}.summary{width:100%;border:0;background:transparent;text-align:left;padding:18px 20px;display:flex;justify-content:space-between;gap:18px;align-items:center;font:inherit;cursor:pointer}.summary:hover{background:#faf9f5}.name{font-size:19px;font-weight:800}.email{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:6px 9px;border-radius:999px;background:#f0eee9;font-size:11px;font-weight:800;text-transform:uppercase}.badge.new{background:#fff2a6}.badge.accepted,.badge.account,.badge.paid,.badge.won{background:var(--green);color:var(--greenInk)}.badge.declined,.badge.lost{background:var(--red);color:var(--redInk)}.badge.pending,.badge.contacted,.badge.responded{background:var(--orange);color:var(--orangeInk)}.badge.qualified,.badge.proposal{background:var(--purple);color:var(--purpleInk)}.badge.plan{background:var(--blue)}.body{display:none;border-top:1px solid var(--line);padding:20px}.card.open .body{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.q{background:#faf9f5;border-radius:13px;padding:13px}.q b{display:block;font-size:11px;text-transform:uppercase;color:#858078;margin-bottom:6px}.q span{font-size:14px;line-height:1.5;white-space:pre-wrap}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions button{border-radius:999px;padding:11px 15px;font:800 13px "DM Sans";cursor:pointer}.accept{border:0;background:var(--yellow)}.accepted-btn{border:0;background:var(--green);color:var(--greenInk)}.decline{background:#fff;border:1px solid #c9c4b9}.declined-btn{border:0;background:var(--red);color:var(--redInk)}.copy{border:0;background:#171717;color:#fff}.secondary{border:1px solid var(--line);background:#fff}.delete{border:1px solid #e3aaa5;background:#fff;color:#9b2525}.notice{display:none;margin-top:12px;padding:11px 13px;background:#edf7ef;border-radius:12px;font-size:13px}.pipeline{display:grid;grid-template-columns:220px 1fr;gap:12px;margin-top:14px}.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:34px;text-align:center;color:var(--muted)}@media(max-width:850px){.statgrid{grid-template-columns:repeat(2,1fr)}.pipeline{grid-template-columns:1fr}}@media(max-width:680px){.grid{grid-template-columns:1fr}.summary{display:block}.badges{justify-content:flex-start;margin-top:10px}.capacity{display:block}.search{width:100%;margin-left:0}h1{font-size:32px}}
</style></head>
<body><div class="shell top"><div class="nav"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><div class="nav-actions"><a href="/login" target="_blank">Student login</a><button id="logout" class="logout" style="display:none">Log out</button></div></div></div><main class="shell"><section id="login" class="login"><h1>Admin login</h1><p class="muted">Manage Assistara leads, applicants, payments and student accounts.</p><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="btn">Log in</button><div id="loginError" class="error"></div></section><section id="dash" class="dash"><div><div style="font-size:12px;font-weight:800;letter-spacing:.1em">ASSISTARA</div><h1>Admin</h1></div><div class="tabs"><button class="tab active" data-tab="applicants">Academy applicants</button><button class="tab" data-tab="students">Students & accounts</button><button class="tab" data-tab="webinar">Free webinar</button><button class="tab" data-tab="b2b">B2B</button><input id="search" class="search" placeholder="Search name, email, company..."></div><div id="capacity" class="capacity"></div><div id="stats" class="statgrid"></div><div id="cards" class="cards"></div></section></main>
<script>
const LOGIN_API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications';
const login=document.getElementById('login'),dash=document.getElementById('dash'),cards=document.getElementById('cards'),logout=document.getElementById('logout'),stats=document.getElementById('stats'),capacity=document.getElementById('capacity'),search=document.getElementById('search');let token=sessionStorage.getItem('assistara_admin_token')||'',apps=[],signups=[],b2b=[],cap={limit:15,paid:0,spots_left:15},tab='applicants';
async function request(action,payload={},api=API){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function qmatch(...v){const q=search.value.trim().toLowerCase();return !q||v.some(x=>String(x||'').toLowerCase().includes(q))}
function payType(a){const v=String(a.payment_readiness||'').toLowerCase();return v.includes('payment plan')?'Payment plan':(v.includes('ready at')||v==='yes'?'Direct payment':a.payment_readiness||'Not specified')}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render()}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>setTab(x.dataset.tab));search.oninput=render;
function render(){renderStats();renderCards()}
function renderStats(){if(tab==='applicants'){capacity.style.display='flex';capacity.innerHTML=`<div><strong>${cap.paid}/${cap.limit} paid places filled</strong><div style="color:#bbb;font-size:13px">Founding Cohort</div></div><div><strong>${cap.spots_left} spots left</strong></div>`;stats.innerHTML=[[apps.length,'Applicants'],[apps.filter(x=>!x.opened_at).length,'New'],[apps.filter(x=>x.decision==='accepted').length,'Accepted'],[apps.filter(x=>x.payment_status==='paid').length,'Paid']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}else if(tab==='students'){capacity.style.display='none';stats.innerHTML=[[apps.filter(x=>x.auth_user_id).length,'Accounts'],[apps.filter(x=>x.onboarding_completed_at).length,'Onboarded'],[apps.filter(x=>x.payment_status==='paid').length,'Paid'],[apps.filter(x=>x.auth_user_id&&x.onboarding_phone).length,'Phone added']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}else if(tab==='webinar'){capacity.style.display='none';stats.innerHTML=[[signups.length,'Registered'],[signups.filter(x=>x.attended).length,'Attended'],[signups.filter(x=>x.application_id).length,'Applied'],[signups.filter(x=>x.purchased).length,'Purchased']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}else{capacity.style.display='none';stats.innerHTML=[[b2b.length,'B2B leads'],[b2b.filter(x=>(x.status||'new')==='new').length,'New'],[b2b.filter(x=>x.status==='qualified').length,'Qualified'],[b2b.filter(x=>x.status==='won').length,'Won']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}}
function renderCards(){if(tab==='applicants')renderApplicants(false);else if(tab==='students')renderApplicants(true);else if(tab==='webinar')renderWebinar();else renderB2B()}
function renderApplicants(studentOnly){let list=apps.filter(a=>(!studentOnly||a.auth_user_id)&&qmatch(a.name,a.email,a.onboarding_phone,a.status,a.payment_status));cards.innerHTML=list.length?list.map(a=>`<article class="card ${a.opened_at?'':'unopened'}" data-id="${a.id}"><button class="summary" onclick="toggleCard(this,'${a.id}')"><div><div class="name">${esc(a.name)}</div><div class="email">${esc(a.email)} · ${new Date(a.created_at).toLocaleString()}</div></div><div class="badges">${!a.opened_at?'<span class="badge new">New</span>':''}${a.decision?`<span class="badge ${a.decision}">${esc(a.decision)}</span>`:''}<span class="badge ${a.payment_status==='paid'?'paid':a.payment_status==='pending'?'pending':''}">${esc(a.payment_status||'not paid')}</span>${a.auth_user_id?'<span class="badge account">account</span>':''}</div></button><div class="body"><div class="grid"><div class="q"><b>Payment preference</b><span>${esc(payType(a))}</span></div><div class="q"><b>Current situation</b><span>${esc(a.current_situation||'')}</span></div><div class="q"><b>Why remote work</b><span>${esc(a.why_remote_work||'')}</span></div><div class="q"><b>Biggest obstacle</b><span>${esc(a.biggest_obstacle||'')}</span></div><div class="q"><b>Remote work interest</b><span>${esc(a.remote_work_interest||'')}</span></div><div class="q"><b>Phone</b><span>${esc(a.onboarding_phone||'Not added')}</span></div><div class="q"><b>Student goal</b><span>${esc(a.onboarding_goal||'Not added')}</span></div><div class="q"><b>Availability</b><span>${esc(a.onboarding_availability||'Not added')}</span></div></div><div class="actions">${studentOnly?`<button class="secondary" onclick="sendReset('${a.id}',this)">Send password reset</button><button class="delete" onclick="deleteAccount('${a.id}')">Delete account</button>`:(a.decision==='accepted'?`<button class="accepted-btn" disabled>Accepted</button><button class="secondary" onclick="resend('${a.id}','accepted',this)">Resend acceptance email</button>`:a.decision==='declined'?`<button class="declined-btn" disabled>Declined</button><button class="secondary" onclick="resend('${a.id}','declined',this)">Resend decline email</button>`:`<button class="accept" onclick="decide('${a.id}','accepted',this)">Accept + send enrollment email</button><button class="decline" onclick="decide('${a.id}','declined',this)">Decline</button>`)}<button class="copy" onclick="copyText('${esc(a.email)}',this)">Copy email</button>${a.decision==='accepted'?`<button class="secondary" onclick="copyText(location.origin+'/academy/checkout?token=${a.enrollment_token}',this)">Copy enrollment link</button>`:''}<button class="delete" onclick="deleteApplicant('${a.id}')">Delete applicant${a.auth_user_id?' + account':''}</button></div><div class="notice"></div></div></article>`).join(''):'<div class="empty">Nothing here yet.</div>'}
function renderWebinar(){let list=signups.filter(s=>qmatch(s.name,s.email,s.phone,s.status));cards.innerHTML=list.length?list.map(s=>`<article class="card"><div class="summary"><div><div class="name">${esc(s.name||'No name')}</div><div class="email">${esc(s.email)}</div></div><div class="badges"><span class="badge">${esc(s.status||'registered')}</span>${s.attended?'<span class="badge paid">attended</span>':''}</div></div><div class="body" style="display:block"><div class="grid"><div class="q"><b>Phone</b><span>${esc(s.phone||'Not provided')}</span></div><div class="q"><b>Source</b><span>${esc(s.source||'')}</span></div><div class="q"><b>Joined</b><span>${s.joined_at?new Date(s.joined_at).toLocaleString():'Not yet'}</span></div><div class="q"><b>UTM</b><span>${esc([s.utm_source,s.utm_medium,s.utm_campaign].filter(Boolean).join(' / ')||'None')}</span></div></div><div class="actions"><button class="copy" onclick="copyText('${esc(s.email)}',this)">Copy email</button><button class="delete" onclick="deleteSignup('${s.id}')">Delete signup</button></div></div></article>`).join(''):'<div class="empty">No webinar signups yet.</div>'}
function renderB2B(){let list=b2b.filter(l=>qmatch(l.name,l.email,l.company,l.status,l.support_level));cards.innerHTML=list.length?list.map(l=>`<article class="card ${l.opened_at?'':'unopened'}" data-b2b="${l.id}"><button class="summary" onclick="toggleB2B(this,'${l.id}')"><div><div class="name">${esc(l.company||l.name||'B2B lead')}</div><div class="email">${esc(l.name)} · ${esc(l.email)}</div></div><div class="badges">${!l.opened_at?'<span class="badge new">New</span>':''}<span class="badge ${esc(l.status||'new')}">${esc(l.status||'new')}</span></div></button><div class="body"><div class="grid"><div class="q"><b>Company</b><span>${esc(l.company||'')}</span></div><div class="q"><b>Support level</b><span>${esc(l.support_level||'')}</span></div><div class="q"><b>What takes their time</b><span>${esc(l.time_thieves||'')}</span></div><div class="q"><b>Source</b><span>${esc(l.source||'')}</span></div></div><div class="pipeline"><label class="field" style="margin:0"><span>Lead stage</span><select id="stage-${l.id}">${['new','contacted','responded','qualified','proposal','won','lost'].map(s=>`<option ${s===(l.status||'new')?'selected':''}>${s}</option>`).join('')}</select></label><label class="field" style="margin:0"><span>Notes / next action</span><textarea id="notes-${l.id}" placeholder="Called, emailed, follow up Friday...">${esc(l.notes||'')}</textarea></label></div><div class="actions"><button class="accept" onclick="saveB2B('${l.id}',this)">Save lead status</button><button class="copy" onclick="copyText('${esc(l.email)}',this)">Copy email</button><button class="delete" onclick="deleteB2B('${l.id}')">Delete B2B lead</button></div><div class="notice"></div></div></article>`).join(''):'<div class="empty">No B2B leads yet.</div>'}
window.toggleCard=async(btn,id)=>{const c=btn.closest('.card'),opening=!c.classList.contains('open');c.classList.toggle('open');if(opening){const a=apps.find(x=>x.id===id);if(a&&!a.opened_at){try{const j=await request('open',{id});a.opened_at=j.opened_at;render()}catch{}}}};
window.toggleB2B=async(btn,id)=>{const c=btn.closest('.card'),opening=!c.classList.contains('open');c.classList.toggle('open');if(opening){const l=b2b.find(x=>x.id===id);if(l&&!l.opened_at){try{const j=await request('open_b2b',{id});l.opened_at=j.opened_at}catch{}}}};
window.copyText=async(t,b)=>{await navigator.clipboard.writeText(t);const o=b.textContent;b.textContent='Copied';setTimeout(()=>b.textContent=o,900)};
window.decide=async(id,decision,b)=>{b.disabled=true;try{await request('decision',{id,decision});await load()}catch(e){alert(e.message);b.disabled=false}};window.resend=async(id,decision,b)=>{b.disabled=true;try{await request('resend_decision',{id,decision});b.textContent='Sent';setTimeout(()=>{b.disabled=false;b.textContent='Resend '+(decision==='accepted'?'acceptance':'decline')+' email'},1000)}catch(e){alert(e.message);b.disabled=false}};
window.sendReset=async(id,b)=>{b.disabled=true;try{await request('send_password_reset',{id});b.textContent='Reset email sent'}catch(e){alert(e.message);b.disabled=false}};
window.deleteAccount=async id=>{if(!confirm('Delete this Academy account? The payment/application record will remain.'))return;try{await request('delete_account',{id});await load()}catch(e){alert(e.message)}};
window.deleteApplicant=async id=>{if(!confirm('Delete this applicant? If an Academy account exists, it will also be deleted.'))return;try{await request('delete_application',{id});await load()}catch(e){alert(e.message)}};window.deleteSignup=async id=>{if(!confirm('Delete this webinar signup?'))return;try{await request('delete_signup',{id});await load()}catch(e){alert(e.message)}};window.deleteB2B=async id=>{if(!confirm('Delete this B2B lead?'))return;try{await request('delete_b2b',{id});await load()}catch(e){alert(e.message)}};
window.saveB2B=async(id,b)=>{b.disabled=true;try{await request('update_b2b',{id,status:document.getElementById('stage-'+id).value,notes:document.getElementById('notes-'+id).value});b.textContent='Saved';setTimeout(load,500)}catch(e){alert(e.message);b.disabled=false}};
async function load(){try{const j=await request('list');apps=j.applications||[];signups=j.signups||[];b2b=j.b2b||[];cap=j.capacity||cap;login.style.display='none';dash.style.display='block';logout.style.display='block';render()}catch(e){sessionStorage.removeItem('assistara_admin_token');token='';login.style.display='block';dash.style.display='none'}}
document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn'),err=document.getElementById('loginError');b.disabled=true;err.style.display='none';try{const j=await request('login',{username:document.getElementById('username').value.trim(),password:document.getElementById('password').value},LOGIN_API);token=j.token;sessionStorage.setItem('assistara_admin_token',token);await load()}catch(e){err.textContent=e.message;err.style.display='block'}finally{b.disabled=false}};logout.onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};if(token)load();
</script></body></html>
