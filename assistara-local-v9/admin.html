<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara</title><link rel="icon" href="/assistara-logo.svg"><style>:root{--ink:#171717;--cream:#f7f5ef;--line:#e2ded4;--muted:#746e65;--yellow:#ffd51f;--green:#e8f7ed;--greenInk:#1d6a3b;--red:#fde9e7;--redInk:#8b2825;--orange:#fff0db}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.shell{width:min(1120px,calc(100% - 28px));margin:auto}.top{margin-top:16px;background:#171717;color:#fff;border-radius:18px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:34px}.top button{border:0;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.login{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px}.field{display:grid;gap:6px;margin-top:12px}.field input{border:1px solid var(--line);border-radius:10px;padding:12px}.main{width:100%;margin-top:15px;background:var(--yellow);border:0;border-radius:10px;padding:13px;font-weight:800}.dash{display:none;padding:24px 0 60px}.nav{margin:18px 0 14px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;gap:18px;padding:0 14px;overflow:auto}.nav button{border:0;background:none;padding:15px 2px;font-weight:700;white-space:nowrap}.nav button.active{border-bottom:3px solid #171717}.alert{background:var(--orange);border:1px solid #efc98f;border-radius:16px;padding:16px;margin:14px 0}.alert h2{margin:0 0 6px;font-size:20px}.payment{background:#fff;border:1px solid #e6c68f;border-radius:13px;padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}.payment b{display:block}.sub{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-weight:700}.actions .success{background:var(--green);color:var(--greenInk);border-color:#b9e4c8}.actions .danger{background:var(--red);color:var(--redInk);border-color:#efb8b3}.actions .accept{background:var(--yellow);border-color:#e8bf00}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.cardtop{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:800}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:#efede8}.badge.paid,.badge.accepted{background:var(--green)}.badge.pending{background:var(--orange)}.badge.declined,.badge.failed{background:var(--red)}.detail{margin:12px 0;padding:11px;background:#faf9f5;border-radius:10px;font-size:13px}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;padding:13px 16px;border-radius:12px;background:#171717;color:#fff;display:none}.toast.show{display:block}.error{color:var(--redInk);margin-top:10px}.search{margin:0 0 14px;width:100%;max-width:360px;padding:10px;border:1px solid var(--line);border-radius:10px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.payment,.cardtop{display:block}.payment .actions,.cardtop .badges{margin-top:10px}}</style></head><body><div class="shell"><div class="top"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><button id="logout" style="display:none">Log out</button></div><section id="login" class="login"><h1>Admin login</h1><p>Manage Assistara operations.</p><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="main">Log in</button><div id="loginError" class="error"></div></section><section id="dash" class="dash"><h1>Admin</h1><div class="nav"><button class="active" data-tab="applicants">Applicants</button><button data-tab="payments">Payments <span id="payCount"></span></button><button data-tab="students">Students</button><button data-tab="accounts">Accounts</button><button data-tab="webinar">Free webinar</button><button data-tab="b2b">B2B</button></div><div id="pendingBox"></div><input id="search" class="search" placeholder="Search..."><div id="stats" class="stats"></div><div id="cards" class="cards"></div></section></div><div id="toast" class="toast"></div><script>const LOGIN='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications',ACC='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-accounts',PAY='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-gcash-payment',ONBOARD='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-send-onboarding';let token=sessionStorage.getItem('assistara_admin_token')||'',apps=[],web=[],b2b=[],accounts=[],cap={},tab='applicants';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function req(action,p={},api=API){const body=api===ONBOARD?p:{action,...p};const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function toast(s){$('toast').textContent=s;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',2500)}function badge(s){return `<span class="badge ${esc(s)}">${esc(String(s||'').replaceAll('_',' '))}</span>`}function stat(a){$('stats').innerHTML=a.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}function match(x){const q=$('search').value.toLowerCase();return !q||JSON.stringify(x).toLowerCase().includes(q)}function pending(){return apps.filter(x=>x.payment_method==='gcash'&&x.payment_status==='pending')}function paymentRow(x){return `<div class="payment"><div><b>${esc(x.name)}</b><div class="sub">GCash · ₱6,900 · Ref: <strong>${esc(x.gcash_reference||'Not provided')}</strong><br>${x.gcash_submitted_at?new Date(x.gcash_submitted_at).toLocaleString():''}</div></div><div class="actions"><button class="success" onclick="approvePay('${x.id}')">✓ Approve payment</button><button class="danger" onclick="rejectPay('${x.id}')">✕ Reject</button></div></div>`}function drawPending(){const p=pending();$('payCount').textContent=p.length?'('+p.length+')':'';$('pendingBox').innerHTML=p.length&&tab!=='payments'?`<div class="alert"><h2>🔔 ${p.length} payment${p.length===1?'':'s'} pending verification</h2><div class="sub">Review GCash references and approve in one click.</div>${p.slice(0,3).map(paymentRow).join('')}</div>`:''}function card(x){return `<div class="card"><div class="cardtop"><div><div class="name">${esc(x.name||'No name')}</div><div class="sub">${esc(x.email||'')}</div></div><div class="badges">${badge(x.decision||x.status||'new')}${badge(x.payment_status||'not_requested')}</div></div>${x.gcash_reference?`<div class="detail"><b>GCash reference:</b> ${esc(x.gcash_reference)}</div>`:''}<div class="actions">${!x.decision?`<button class="accept" onclick="decision('${x.id}','accepted')">Accept + email</button><button onclick="decision('${x.id}','declined')">Decline</button>`:''}${x.decision==='accepted'?`<button onclick="decision('${x.id}','accepted',true)">Resend acceptance</button>`:''}${x.decision==='declined'?`<button onclick="decision('${x.id}','declined',true)">Resend decline</button>`:''}${x.payment_status==='paid'&&!x.auth_user_id?`<button class="success" onclick="onboard('${x.id}')">Send account setup</button>`:''}${x.auth_user_id?`<button onclick="resetPw('${x.id}')">Password reset</button>`:''}</div></div>`}function render(){drawPending();const q=apps.filter(match);if(tab==='payments'){const p=pending().filter(match);stat([[p.length,'Pending'],[apps.filter(x=>x.payment_method==='gcash'&&x.payment_status==='paid').length,'GCash paid'],[apps.filter(x=>x.payment_status==='paid').length,'All paid'],[cap.spots_left??15,'Spots left']]);$('cards').innerHTML=p.length?p.map(paymentRow).join(''):'<div class="empty">No payments waiting for verification.</div>';return}if(tab==='applicants'){stat([[apps.length,'Applicants'],[apps.filter(x=>!x.decision).length,'New'],[apps.filter(x=>x.decision==='accepted').length,'Accepted'],[apps.filter(x=>x.payment_status==='paid').length,'Paid']]);$('cards').innerHTML=q.length?q.map(card).join(''):'<div class="empty">No applicants found.</div>';return}if(tab==='students'){const s=q.filter(x=>x.payment_status==='paid'||x.auth_user_id);stat([[s.length,'Students'],[s.filter(x=>x.payment_status==='paid').length,'Paid'],[s.filter(x=>x.auth_user_id).length,'Accounts'],[s.filter(x=>x.onboarding_completed_at).length,'Onboarded']]);$('cards').innerHTML=s.length?s.map(card).join(''):'<div class="empty">No students yet.</div>';return}if(tab==='accounts'){stat([[accounts.length,'Accounts'],[accounts.filter(x=>x.last_sign_in_at).length,'Logged in'],[accounts.filter(x=>!x.last_sign_in_at).length,'Never logged in'],[0,'Suspended']]);$('cards').innerHTML=accounts.length?accounts.filter(match).map(x=>`<div class="card"><div class="name">${esc(x.name||'Student')}</div><div class="sub">${esc(x.email)}</div></div>`).join(''):'<div class="empty">No accounts yet.</div>';return}if(tab==='webinar'){stat([[web.length,'Registered'],[web.filter(x=>x.attended).length,'Attended'],[web.filter(x=>x.application_id).length,'Applied'],[web.filter(x=>x.purchased).length,'Purchased']]);$('cards').innerHTML='<div class="card">Webinar funnel is connected and reporting from Supabase.</div>';return}stat([[b2b.length,'Leads'],[b2b.filter(x=>x.status==='responded').length,'Responded'],[b2b.filter(x=>x.status==='qualified').length,'Qualified'],[b2b.filter(x=>x.status==='won').length,'Won']]);$('cards').innerHTML=b2b.filter(match).map(x=>`<div class="card"><div class="name">${esc(x.company||x.name||'B2B lead')}</div><div class="sub">${esc(x.name)} · ${esc(x.email)}</div>${badge(x.status||'new')}</div>`).join('')||'<div class="empty">No B2B leads.</div>'}async function load(){const d=await req('list');apps=d.applications||[];web=d.signups||[];b2b=d.b2b||[];cap=d.capacity||{};try{accounts=(await req('list',{},ACC)).accounts||[]}catch{accounts=[]}render()}window.approvePay=async id=>{if(!confirm('Approve this GCash payment as ₱6,900 PAID? This will send the payment confirmation and onboarding link.'))return;try{const d=await req('approve',{id},PAY);toast(d.email_sent?'Payment approved + student emailed':'Payment approved');await load()}catch(e){alert(e.message)}};window.rejectPay=async id=>{const reason=prompt('Reason for rejection:','Payment could not be verified');if(reason===null)return;try{await req('reject',{id,reason},PAY);toast('Payment rejected');await load()}catch(e){alert(e.message)}};window.decision=async(id,d,resend=false)=>{try{if(!resend&&!confirm(d==='accepted'?'Accept and send enrollment email?':'Decline and send email?'))return;await req(resend?'resend_decision':'decision',{id,decision:d});toast(resend?'Email resent':'Decision saved + email sent');await load()}catch(e){alert(e.message)}};window.onboard=async id=>{try{await req('',{id},ONBOARD);toast('Account setup email sent')}catch(e){alert(e.message)}};window.resetPw=async id=>{try{await req('send_password_reset',{id});toast('Password reset sent')}catch(e){alert(e.message)}};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;$('loginBtn').onclick=async()=>{try{const d=await req('login',{username:$('username').value,password:$('password').value},LOGIN);token=d.token;sessionStorage.setItem('assistara_admin_token',token);show();await load()}catch(e){$('loginError').textContent=e.message}};$('logout').onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};function show(){$('login').style.display='none';$('dash').style.display='block';$('logout').style.display='block'}if(token){show();load().catch(e=>alert(e.message))}</script></body></html>
