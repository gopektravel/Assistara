<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara</title><link rel="icon" href="/assistara-logo.svg"><style>:root{--ink:#171717;--cream:#f7f5ef;--line:#e2ded4;--muted:#746e65;--yellow:#ffd51f;--green:#e8f7ed;--greenInk:#1d6a3b;--red:#fde9e7;--redInk:#8b2825;--orange:#fff0db}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}.shell{width:min(1120px,calc(100% - 28px));margin:auto}.top{margin-top:16px;background:#171717;color:#fff;border-radius:18px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:700}.brand img{width:34px}.top button{border:0;background:#fff;border-radius:10px;padding:9px 12px;font-weight:700}.login{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px}.field{display:grid;gap:6px;margin-top:12px}.field input{border:1px solid var(--line);border-radius:10px;padding:12px}.main{width:100%;margin-top:15px;background:var(--yellow);border:0;border-radius:10px;padding:13px;font-weight:800}.dash{display:none;padding:24px 0 60px}.nav{margin:18px 0 14px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;gap:18px;padding:0 14px;overflow:auto}.nav button{border:0;background:none;padding:15px 2px;font-weight:700;white-space:nowrap}.nav button.active{border-bottom:3px solid #171717}.alert{background:#fff8dc;border:2px solid var(--yellow);border-radius:18px;padding:17px;margin:14px 0}.alert h2{margin:0 0 6px;font-size:20px}.payment{background:#fff;border:1px solid #e6c68f;border-radius:13px;padding:14px;margin-top:10px;display:flex;gap:12px;align-items:center;justify-content:space-between}.sub{font-size:12px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;font-weight:700;cursor:pointer}.actions .success{background:var(--green);color:var(--greenInk);border-color:#b9e4c8}.actions .danger{background:var(--red);color:var(--redInk);border-color:#efb8b3}.actions .accept{background:var(--yellow);border-color:#e8bf00}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:var(--muted)}.cards{display:grid;gap:10px}.card,.student{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.cardtop{display:flex;justify-content:space-between;gap:10px}.name{font-size:18px;font-weight:800}.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:#efede8}.badge.paid,.badge.accepted{background:var(--green)}.badge.pending{background:var(--orange)}.badge.declined,.badge.failed,.badge.suspended{background:var(--red)}.detail{margin:12px 0;padding:11px;background:#faf9f5;border-radius:10px;font-size:13px}.studentHead{display:flex;align-items:center;justify-content:space-between;cursor:pointer;min-height:28px}.studentHead .name{font-size:16px}.studentBody{display:none;border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.student.open .studentBody{display:block}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;padding:13px 16px;border-radius:12px;background:#171717;color:#fff;display:none}.toast.show{display:block}.error{color:var(--redInk);margin-top:10px}.search{margin:0 0 14px;width:100%;max-width:360px;padding:10px;border:1px solid var(--line);border-radius:10px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.payment,.cardtop{display:block}.payment .actions,.cardtop .badges{margin-top:10px}}</style></head><body><div class="shell"><div class="top"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><button id="logout" style="display:none">Log out</button></div><section id="login" class="login"><h1>Admin login</h1><p>Manage Assistara operations.</p><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="main">Log in</button><div id="loginError" class="error"></div></section><section id="dash" class="dash"><h1>Admin</h1><div class="nav"><button class="active" data-tab="applicants">Applications <span id="payCount"></span></button><button data-tab="students">Students</button><button data-tab="webinar">Free webinar</button><button data-tab="b2b">B2B</button></div><div id="pendingBox"></div><input id="search" class="search" placeholder="Search..."><div id="stats" class="stats"></div><div id="cards" class="cards"></div></section></div><div id="toast" class="toast"></div><script>const LOGIN='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications',ACC='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-accounts',PAY='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-gcash-payment',ONBOARD='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-send-onboarding';let token=sessionStorage.getItem('assistara_admin_token')||'',apps=[],web=[],b2b=[],accounts=[],cap={},tab='applicants';const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function req(action,p={},api=API){const body=api===ONBOARD?p:{action,...p};const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function toast(s){$('toast').textContent=s;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',2500)}function badge(s){return `<span class="badge ${esc(s)}">${esc(String(s||'').replaceAll('_',' '))}</span>`}function stat(a){$('stats').innerHTML=a.map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}function match(x){const q=$('search').value.toLowerCase();return !q||JSON.stringify(x).toLowerCase().includes(q)}function activeApps(){return apps.filter(x=>x.decision!=='declined'&&!x.auth_user_id)}function pending(){return activeApps().filter(x=>x.payment_method==='gcash'&&x.payment_status==='pending')}function paymentRow(x){return `<div class="payment"><div><b>${esc(x.name)}</b><div class="sub">GCash · ₱6,900 · Ref: <strong>${esc(x.gcash_reference||'Not provided')}</strong><br>${x.gcash_submitted_at?new Date(x.gcash_submitted_at).toLocaleString():''}</div></div><div class="actions"><button class="success" onclick="approvePay('${x.id}')">✓ Approve payment</button><button class="danger" onclick="rejectPay('${x.id}')">✕ Could not verify</button></div></div>`}function drawPending(){const p=pending();$('payCount').textContent=p.length?'🔔 '+p.length:'';$('pendingBox').innerHTML=p.length&&tab==='applicants'?`<div class="alert"><h2>🔔 PAYMENT PENDING VERIFICATION (${p.length})</h2><div class="sub">These remain here until approved or marked as not verified. Email decisions update this same status automatically.</div>${p.map(paymentRow).join('')}</div>`:''}function appCard(x){return `<div class="card"><div class="cardtop"><div><div class="name">${esc(x.name||'No name')}</div><div class="sub">${esc(x.email||'')}</div></div><div class="badges">${badge(x.decision||x.status||'new')}${badge(x.payment_status||'not_requested')}</div></div>${x.gcash_reference?`<div class="detail"><b>GCash reference:</b> ${esc(x.gcash_reference)}</div>`:''}<div class="actions">${!x.decision?`<button class="accept" onclick="decision('${x.id}','accepted')">Accept + email</button><button onclick="decision('${x.id}','declined')">Decline + email</button>`:''}${x.decision==='accepted'?`<button onclick="decision('${x.id}','accepted',true)">Resend acceptance</button>`:''}${x.payment_status==='paid'?`<button class="success" onclick="onboard('${x.id}')">Send account setup</button>`:''}</div></div>`}function studentCard(x){const acc=accounts.find(a=>a.application_id===x.id||a.id===x.auth_user_id);const suspended=!!x.suspended_at;return `<div class="student" id="student-${x.id}"><div class="studentHead" onclick="toggleStudent('${x.id}')"><div class="name">${esc(x.name||acc?.name||'Student')}</div><span>⌄</span></div><div class="studentBody"><div class="sub">${esc(x.email||acc?.email||'')}</div><div class="detail"><b>Account:</b> ${suspended?'Suspended':'Active'}${x.receipt_number?`<br><b>Receipt:</b> ${esc(x.receipt_number)}`:''}</div><div class="actions"><button onclick="resetPw('${x.id}')">Password reset</button><button onclick="suspend('${x.id}',${suspended?'false':'true'})">${suspended?'Reactivate':'Suspend'} account</button><button class="danger" onclick="deleteAccount('${x.id}')">Delete account</button></div></div></div>`}function render(){drawPending();if(tab==='applicants'){const a=activeApps().filter(match);stat([[a.length,'Active applications'],[pending().length,'Payment pending'],[a.filter(x=>x.decision==='accepted').length,'Accepted / enrolling'],[a.filter(x=>x.payment_status==='paid').length,'Paid / setup pending']]);$('cards').innerHTML=a.length?a.map(appCard).join(''):'<div class="empty">No active applications. Everything is handled.</div>';return}if(tab==='students'){const s=apps.filter(x=>x.auth_user_id).filter(match);stat([[s.length,'Students'],[s.filter(x=>!x.suspended_at).length,'Active'],[s.filter(x=>x.suspended_at).length,'Suspended'],[s.filter(x=>x.onboarding_completed_at).length,'Onboarded']]);$('cards').innerHTML=s.length?s.map(studentCard).join(''):'<div class="empty">No students yet.</div>';return}if(tab==='webinar'){stat([[web.length,'Registered'],[web.filter(x=>x.attended).length,'Attended'],[web.filter(x=>x.application_id).length,'Applied'],[web.filter(x=>x.purchased).length,'Purchased']]);$('cards').innerHTML='<div class="card">Webinar funnel is connected and reporting from Supabase. Application history remains stored even after people leave the active Applications queue.</div>';return}stat([[b2b.length,'Leads'],[b2b.filter(x=>x.status==='responded').length,'Responded'],[b2b.filter(x=>x.status==='qualified').length,'Qualified'],[b2b.filter(x=>x.status==='won').length,'Won']]);$('cards').innerHTML=b2b.filter(match).map(x=>`<div class="card"><div class="name">${esc(x.company||x.name||'B2B lead')}</div><div class="sub">${esc(x.name)} · ${esc(x.email)}</div>${badge(x.status||'new')}</div>`).join('')||'<div class="empty">No B2B leads.</div>'}async function load(){const d=await req('list');apps=d.applications||[];web=d.signups||[];b2b=d.b2b||[];cap=d.capacity||{};try{accounts=(await req('list',{},ACC)).accounts||[]}catch{accounts=[]}render()}window.toggleStudent=id=>{const e=$('student-'+id);if(e)e.classList.toggle('open')};window.approvePay=async id=>{if(!confirm('Approve this GCash payment as ₱6,900 PAID? The applicant will be emailed and sent to account setup.'))return;try{const d=await req('approve',{id},PAY);toast(d.email_sent?'Payment approved + applicant emailed':'Payment approved');await load()}catch(e){alert(e.message)}};window.rejectPay=async id=>{if(!confirm('Could not verify this payment? The applicant will be asked by email to reply with a screenshot.'))return;try{const d=await req('reject',{id,reason:'Payment could not be verified. Applicant asked to reply with a screenshot.'},PAY);toast(d.email_sent?'Applicant asked for screenshot':'Marked not verified');await load()}catch(e){alert(e.message)}};window.decision=async(id,d,resend=false)=>{try{if(!resend&&!confirm(d==='accepted'?'Accept and send enrollment email?':'Decline and send email? This application will leave the active queue but its data will be retained.'))return;await req(resend?'resend_decision':'decision',{id,decision:d});toast(resend?'Email resent':d==='declined'?'Declined and archived':'Accepted + email sent');await load()}catch(e){alert(e.message)}};window.onboard=async id=>{try{await req('',{id},ONBOARD);toast('Account setup email sent')}catch(e){alert(e.message)}};window.resetPw=async id=>{try{await req('send_password_reset',{id});toast('Password reset sent')}catch(e){alert(e.message)}};window.suspend=async(id,suspended)=>{if(!confirm(suspended?'Suspend this student account?':'Reactivate this student account?'))return;try{await req('suspend_account',{id,suspended});toast(suspended?'Account suspended':'Account reactivated');await load()}catch(e){alert(e.message)}};window.deleteAccount=async id=>{if(!confirm('Delete this Academy login account? The historical application and payment data will remain.'))return;try{await req('delete_account',{id});toast('Account deleted');await load()}catch(e){alert(e.message)}};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;$('loginBtn').onclick=async()=>{try{const d=await req('login',{username:$('username').value,password:$('password').value},LOGIN);token=d.token;sessionStorage.setItem('assistara_admin_token',token);show();await load()}catch(e){$('loginError').textContent=e.message}};$('logout').onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};function show(){$('login').style.display='none';$('dash').style.display='block';$('logout').style.display='block'}if(token){show();load().catch(e=>alert(e.message))}</script></body></html>
