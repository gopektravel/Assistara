<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara Academy</title><link rel="icon" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--line:#dedbd3;--muted:#716b63;--green:#dff7e8;--greenInk:#17603a;--red:#fee2e2;--redInk:#9b2525;--blue:#eef3ff;--orange:#fff0d8;--orangeInk:#9a5a00;--purple:#f0e9ff;--purpleInk:#5d3a9b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",Arial,sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.nav{background:#171717;color:#fff;border-radius:20px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700}.brand img{width:36px;height:36px}.logout{border:0;background:#fff;color:#171717;border-radius:999px;padding:10px 15px;font:700 13px "DM Sans";cursor:pointer}.login{width:min(500px,100%);margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:32px;box-shadow:0 20px 60px rgba(0,0,0,.07)}h1{font-size:38px;letter-spacing:-.04em;margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-top:16px}.field span{font-size:13px;font-weight:700}.field input{padding:15px;border:1px solid var(--line);border-radius:14px;font:inherit}.btn{border:0;border-radius:999px;background:var(--yellow);padding:15px 19px;font:800 14px "DM Sans";cursor:pointer}.login .btn{width:100%;margin-top:18px}.error{display:none;background:var(--red);padding:12px;border-radius:12px;margin-top:12px;color:var(--redInk)}.dash{display:none;padding:18px 0 70px}.dash-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:16px 0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em}.tabs{display:flex;gap:8px;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:11px 15px;font:800 13px "DM Sans";cursor:pointer}.tab.active{background:#171717;color:#fff;border-color:#171717}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left}.stat.active{border-color:#171717;box-shadow:0 0 0 1px #171717}.stat b{display:block;font-size:28px;line-height:1;margin-bottom:6px}.stat span{font-size:12px;color:var(--muted);font-weight:700}.capacity{background:#171717;color:#fff;border-radius:18px;padding:16px 18px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:16px}.capacity strong{font-size:20px}.capacity span{color:#bbb;font-size:13px}.apps{display:grid;gap:12px}.app{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}.app.unopened{border-color:#d8b700}.app-summary{width:100%;border:0;background:transparent;text-align:left;padding:18px 20px;display:flex;justify-content:space-between;gap:18px;align-items:center;cursor:pointer;font:inherit}.app-summary:hover{background:#faf9f5}.name{font-size:19px;font-weight:800}.email{color:var(--muted);font-size:13px;margin-top:3px}.badges{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:6px 9px;border-radius:999px;background:#f0eee9;font-size:11px;font-weight:800;text-transform:uppercase}.badge.new{background:#fff2a6}.badge.accepted,.badge.account,.badge.paid{background:var(--green);color:var(--greenInk)}.badge.declined{background:var(--red);color:var(--redInk)}.badge.plan{background:var(--blue)}.badge.pending{background:var(--orange);color:var(--orangeInk)}.badge.waitlisted{background:var(--purple);color:var(--purpleInk)}.app-body{display:none;border-top:1px solid var(--line);padding:20px}.app.open .app-body{display:block}.payment-choice{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#171717;color:#fff;border-radius:14px;padding:15px 16px;margin-bottom:16px}.payment-choice small{color:#aaa;display:block;font-size:11px;font-weight:800;letter-spacing:.08em;margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.q{background:#faf9f5;border-radius:13px;padding:13px}.q b{display:block;font-size:11px;text-transform:uppercase;color:#858078;margin-bottom:6px}.q span{font-size:14px;line-height:1.5;white-space:pre-wrap}.actions{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}.actions button{border-radius:999px;padding:11px 15px;font:800 13px "DM Sans";cursor:pointer}.accept{border:0;background:var(--yellow)}.decline{background:#fff;border:1px solid #c9c4b9}.copy{border:0;background:#171717;color:#fff}.delete{border:1px solid #e3aaa5;background:#fff;color:#9b2525}.notice{display:none;margin-top:12px;padding:11px 13px;background:#edf7ef;border-radius:12px;font-size:13px}.empty{background:#fff;border:1px dashed var(--line);border-radius:20px;padding:34px;text-align:center;color:var(--muted)}@media(max-width:900px){.statgrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.grid{grid-template-columns:1fr}.app-summary,.dash-head{display:block}.badges{justify-content:flex-start;margin-top:10px}.capacity{display:block}.capacity span{display:block;margin-top:5px}.login{margin-top:35px;padding:24px}h1{font-size:32px}}</style></head><body><div class="shell top"><div class="nav"><div class="brand"><img src="/assistara-logo.svg" alt="Assistara"><span>Assistara Admin</span></div><button id="logout" class="logout" style="display:none">Log out</button></div></div><main class="shell"><section id="login" class="login"><h1>Admin login</h1><p class="muted">Manage the Academy funnel from signup to student.</p><label class="field"><span>Username</span><input id="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password"></label><button id="loginBtn" class="btn">Log in</button><div id="loginError" class="error"></div></section><section id="dash" class="dash"><div class="dash-head"><div><div class="eyebrow">ASSISTARA</div><h1>Admin</h1></div></div><div class="tabs"><button id="academyTab" class="tab active" onclick="switchTab('academy')">Academy applicants</button><button id="webinarTab" class="tab" onclick="switchTab('webinar')">Free webinar signups</button></div><div id="capacity" class="capacity"></div><div id="stats" class="statgrid"></div><div id="apps" class="apps"></div></section></main><script>const LOGIN_API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',APPS_API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications';const login=document.getElementById('login'),dash=document.getElementById('dash'),apps=document.getElementById('apps'),logout=document.getElementById('logout'),stats=document.getElementById('stats'),capacity=document.getElementById('capacity');let token=sessionStorage.getItem('assistara_admin_token')||'',allApps=[],signups=[],cap={limit:15,paid:0,spots_left:15},currentFilter='all',tab='academy';async function request(api,action,payload={}){const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function paymentType(a){const v=String(a.payment_readiness||'').toLowerCase();if(v.includes('payment plan'))return'Payment plan';if(v.includes('ready at')||v==='yes')return'Direct payment';return a.payment_readiness||'Not specified'}function payClass(v){v=String(v||'').toLowerCase();return v==='paid'?'paid':v==='pending'?'pending':''}function filtered(){if(tab==='webinar')return signups;if(currentFilter==='all')return allApps;return allApps.filter(a=>currentFilter==='unopened'&&!a.opened_at||currentFilter==='opened'&&a.opened_at||currentFilter==='direct'&&paymentType(a)==='Direct payment'||currentFilter==='plan'&&paymentType(a)==='Payment plan'||currentFilter==='accepted'&&(a.decision==='accepted'||a.status==='accepted')||currentFilter==='paid'&&a.payment_status==='paid'||currentFilter==='pending'&&a.payment_status==='pending'||currentFilter==='accounts'&&a.auth_user_id||currentFilter==='waitlist'&&a.status==='waitlisted')}function renderStats(){if(tab==='webinar'){const items=[['all',signups.length,'Registered'],['attended',signups.filter(x=>x.attended).length,'Attended'],['applied',signups.filter(x=>x.application_id).length,'Applied'],['purchased',signups.filter(x=>x.purchased).length,'Purchased']];stats.innerHTML=items.map(([k,n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');capacity.style.display='none';return}capacity.style.display='flex';capacity.innerHTML=`<div><strong>${cap.paid}/${cap.limit} paid places filled</strong><span>Founding Cohort capacity</span></div><div><strong>${cap.spots_left}</strong><span>spots left</span></div>`;const s={total:allApps.length,unopened:allApps.filter(a=>!a.opened_at).length,opened:allApps.filter(a=>a.opened_at).length,direct:allApps.filter(a=>paymentType(a)==='Direct payment').length,plan:allApps.filter(a=>paymentType(a)==='Payment plan').length,accepted:allApps.filter(a=>a.decision==='accepted'||a.status==='accepted').length,paid:allApps.filter(a=>a.payment_status==='paid').length,pending:allApps.filter(a=>a.payment_status==='pending').length,accounts:allApps.filter(a=>a.auth_user_id).length,waitlist:allApps.filter(a=>a.status==='waitlisted').length};const items=[['all',s.total,'Total'],['unopened',s.unopened,'Unopened'],['opened',s.opened,'Opened'],['direct',s.direct,'Direct payment'],['plan',s.plan,'Payment plan'],['accepted',s.accepted,'Accepted'],['pending',s.pending,'Payment pending'],['paid',s.paid,'Paid'],['accounts',s.accounts,'Accounts'],['waitlist',s.waitlist,'Waitlist']];stats.innerHTML=items.map(([k,n,l])=>`<button class="stat ${currentFilter===k?'active':''}" onclick="setFilter('${k}')"><b>${n}</b><span>${l}</span></button>`).join('')}function renderApps(){const list=filtered();if(tab==='webinar'){apps.innerHTML=list.length?list.map(s=>`<article class="app"><div class="app-summary"><div><div class="name">${esc(s.name||'No name')}</div><div class="email">${esc(s.email)} · ${new Date(s.created_at).toLocaleString()}</div></div><div class="badges"><span class="badge">${esc(s.status||'registered')}</span>${s.attended?'<span class="badge paid">attended</span>':''}${s.application_id?'<span class="badge accepted">applied</span>':''}${s.purchased?'<span class="badge paid">purchased</span>':''}</div></div><div class="app-body" style="display:block"><div class="grid"><div class="q"><b>Phone</b><span>${esc(s.phone||'Not provided')}</span></div><div class="q"><b>Source</b><span>${esc(s.source||'')}</span></div><div class="q"><b>Joined webinar</b><span>${s.joined_at?new Date(s.joined_at).toLocaleString():'Not yet'}</span></div><div class="q"><b>UTM</b><span>${esc([s.utm_source,s.utm_medium,s.utm_campaign].filter(Boolean).join(' / ')||'None')}</span></div></div><div class="actions"><button class="delete" onclick="deleteSignup('${s.id}',this)">Delete signup</button></div></div></article>`).join(''):'<div class="empty">No webinar registrations yet.</div>';return}apps.innerHTML=list.length?list.map(a=>{const pay=paymentType(a),statusClass=a.status==='waitlisted'?'waitlisted':(a.decision||'');return`<article class="app ${a.opened_at?'':'unopened'}" data-id="${a.id}"><button class="app-summary" onclick="toggleApp('${a.id}',this)"><div><div class="name">${esc(a.name)}</div><div class="email">${esc(a.email)} · ${new Date(a.created_at).toLocaleString()}</div></div><div class="badges">${!a.opened_at?'<span class="badge new">New</span>':''}<span class="badge ${pay==='Payment plan'?'plan':''}">${esc(pay)}</span><span class="badge ${statusClass}">${esc(a.status||a.decision||'new')}</span><span class="badge ${payClass(a.payment_status)}">${esc(a.payment_status||'not paid')}</span>${a.auth_user_id?'<span class="badge account">account</span>':''}</div></button><div class="app-body"><div class="payment-choice"><div><small>PAYMENT PREFERENCE</small><strong>${esc(pay)}</strong></div><span>${esc(a.payment_readiness||'')}</span></div><div class="grid"><div class="q"><b>Current situation</b><span>${esc(a.current_situation||'')}</span></div><div class="q"><b>Why remote work</b><span>${esc(a.why_remote_work||'')}</span></div><div class="q"><b>What they tried</b><span>${esc(a.what_tried||'')}</span></div><div class="q"><b>Biggest obstacle</b><span>${esc(a.biggest_obstacle||'')}</span></div><div class="q"><b>Remote work interest</b><span>${esc(a.remote_work_interest||'')}</span></div><div class="q"><b>Weekly commitment</b><span>${esc(a.weekly_commitment||'')}</span></div><div class="q"><b>Payment</b><span>${a.payment_status==='paid'?`${esc(a.purchase_currency||'PHP')} ${esc(a.purchase_amount||'')} · paid ${a.paid_at?new Date(a.paid_at).toLocaleString():''}`:esc(a.payment_status||'not paid')}</span></div><div class="q"><b>Account status</b><span>${a.auth_user_id?'Account created':'No account yet'}</span></div><div class="q"><b>Phone</b><span>${esc(a.onboarding_phone||'Not added yet')}</span></div><div class="q"><b>Onboarding</b><span>${a.onboarding_completed_at?'Completed '+new Date(a.onboarding_completed_at).toLocaleString():'Not completed'}</span></div><div class="q"><b>Student goal</b><span>${esc(a.onboarding_goal||'Not added yet')}</span></div><div class="q"><b>Availability</b><span>${esc(a.onboarding_availability||'Not added yet')}</span></div></div><div class="actions"><button class="accept" onclick="decide('${a.id}','accepted',this)">Accept + send enrollment email</button><button class="decline" onclick="decide('${a.id}','declined',this)">Decline</button>${a.decision==='accepted'?`<button class="copy" onclick="copyLink('${a.enrollment_token}',this)">Copy enrollment link</button>`:''}${a.payment_status!=='paid'&&!a.auth_user_id?`<button class="delete" onclick="deleteApplicant('${a.id}',this)">Delete applicant</button>`:''}</div><div class="notice"></div></div></article>`}).join(''):'<div class="empty">No applications in this view.</div>'}window.switchTab=t=>{tab=t;currentFilter='all';document.getElementById('academyTab').classList.toggle('active',t==='academy');document.getElementById('webinarTab').classList.toggle('active',t==='webinar');renderStats();renderApps()};window.setFilter=k=>{currentFilter=k;renderStats();renderApps()};window.toggleApp=async(id,btn)=>{const card=btn.closest('.app'),opening=!card.classList.contains('open');document.querySelectorAll('.app.open').forEach(x=>{if(x!==card)x.classList.remove('open')});card.classList.toggle('open');if(opening){const a=allApps.find(x=>x.id===id);if(a&&!a.opened_at){try{const j=await request(APPS_API,'open',{id});a.opened_at=j.opened_at||new Date().toISOString();renderStats();renderApps();const same=document.querySelector(`.app[data-id="${id}"]`);if(same)same.classList.add('open')}catch(e){}}}};async function load(){try{const j=await request(APPS_API,'list');allApps=j.applications||[];signups=j.signups||[];cap=j.capacity||cap;login.style.display='none';dash.style.display='block';logout.style.display='block';renderStats();renderApps()}catch(e){sessionStorage.removeItem('assistara_admin_token');token='';login.style.display='block';dash.style.display='none';logout.style.display='none'}}window.decide=async(id,decision,btn)=>{const card=btn.closest('.app'),notice=card.querySelector('.notice');btn.disabled=true;btn.textContent=decision==='accepted'?'Sending acceptance...':'Updating...';try{await request(APPS_API,'decision',{id,decision});notice.style.display='block';notice.textContent=decision==='accepted'?'Accepted. Enrollment email sent.':'Application declined and email sent.';setTimeout(load,500)}catch(e){notice.style.display='block';notice.textContent=e.message;btn.disabled=false}};window.deleteApplicant=async(id,btn)=>{if(!confirm('Delete this applicant permanently? This cannot be undone.'))return;try{await request(APPS_API,'delete_application',{id});await load()}catch(e){alert(e.message)}};window.deleteSignup=async(id,btn)=>{if(!confirm('Delete this webinar signup permanently?'))return;try{await request(APPS_API,'delete_signup',{id});await load()}catch(e){alert(e.message)}};window.copyLink=async(t,btn)=>{await navigator.clipboard.writeText(location.origin+'/academy/checkout?token='+t);btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy enrollment link',1200)};document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn'),err=document.getElementById('loginError');b.disabled=true;b.textContent='Logging in...';err.style.display='none';try{const j=await request(LOGIN_API,'login',{username:document.getElementById('username').value.trim(),password:document.getElementById('password').value});token=j.token;sessionStorage.setItem('assistara_admin_token',token);await load()}catch(e){err.textContent=e.message;err.style.display='block'}finally{b.disabled=false;b.textContent='Log in'}};logout.onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};if(token)load();</script></body></html>
