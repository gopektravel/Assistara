<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | Assistara Academy</title><link rel="icon" type="image/svg+xml" href="/assistara-logo.svg">
<style>
:root{--ink:#171717;--cream:#fbfaf6;--yellow:#ffd51f;--line:#ddd8cd;--muted:#6d675f;--green:#dff7e8;--red:#fee2e2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,sans-serif}.shell{width:min(1180px,calc(100% - 28px));margin:auto}.top{padding:18px 0}.nav{background:#171717;color:#fff;border-radius:22px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand img{width:36px;height:36px}.logout{border:0;background:#fff;color:#171717;border-radius:999px;padding:10px 15px;font-weight:800;cursor:pointer}.login{width:min(520px,100%);margin:80px auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px;box-shadow:0 24px 70px rgba(0,0,0,.08)}h1{font-size:42px;letter-spacing:-.05em;margin:0 0 8px}.muted{color:var(--muted);line-height:1.5}.field{display:grid;gap:7px;margin-top:16px}.field span{font-size:13px;font-weight:800}.field input{padding:15px;border:1px solid var(--line);border-radius:14px;font:inherit}.btn{border:0;border-radius:999px;background:var(--yellow);padding:15px 19px;font-weight:900;cursor:pointer}.login .btn{width:100%;margin-top:18px}.error{display:none;background:var(--red);padding:12px;border-radius:12px;margin-top:12px;color:#8c1d1d}.dash{display:none;padding:22px 0 70px}.dash-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:20px 0 24px}.dash-head h1{margin:0}.stats{font-weight:800;color:var(--muted)}.apps{display:grid;gap:16px}.app{background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}.app-top{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.name{font-size:23px;font-weight:900}.email{color:var(--muted);font-size:14px;margin-top:3px}.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.badge{padding:7px 10px;border-radius:999px;background:#f0eee9;font-size:12px;font-weight:900;text-transform:uppercase}.badge.accepted{background:var(--green)}.badge.declined{background:var(--red)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}.q{background:#faf9f5;border-radius:14px;padding:14px}.q b{display:block;font-size:12px;text-transform:uppercase;color:#858078;margin-bottom:6px}.q span{font-size:14px;line-height:1.5;white-space:pre-wrap}.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.accept{background:var(--yellow)}.decline{background:#fff;border:1px solid #c9c4b9}.copy{background:#171717;color:#fff}.actions button{border-radius:999px;padding:12px 16px;font-weight:900;cursor:pointer}.notice{display:none;margin-top:12px;padding:11px 13px;background:#edf7ef;border-radius:12px;font-size:13px}.empty{background:#fff;border:1px dashed var(--line);border-radius:22px;padding:34px;text-align:center;color:var(--muted)}@media(max-width:720px){.grid{grid-template-columns:1fr}.app-top,.dash-head{display:block}.badges{justify-content:flex-start;margin-top:12px}.login{margin-top:35px;padding:24px}h1{font-size:34px}}
</style></head><body>
<div class="shell top"><div class="nav"><div class="brand"><img src="/assistara-logo.svg" alt=""><span>Assistara Admin</span></div><button id="logout" class="logout" style="display:none">Log out</button></div></div>
<main class="shell">
<section id="login" class="login"><h1>Admin login</h1><p class="muted">Review Academy applications, accept students and send their private enrollment link.</p><label class="field"><span>Username</span><input id="username" autocomplete="username" value="admin"></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password"></label><button id="loginBtn" class="btn">Log in</button><div id="loginError" class="error"></div></section>
<section id="dash" class="dash"><div class="dash-head"><div><div style="font-size:12px;font-weight:900;letter-spacing:.1em">ACADEMY APPLICATIONS</div><h1>Review applicants.</h1></div><div id="stats" class="stats"></div></div><div id="apps" class="apps"></div></section>
</main>
<script>
const API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api';
const login=document.getElementById('login'),dash=document.getElementById('dash'),apps=document.getElementById('apps'),logout=document.getElementById('logout');let token=sessionStorage.getItem('assistara_admin_token')||'';
async function call(action,payload={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',...(token?{'Authorization':'Bearer '+token}:{})},body:JSON.stringify({action,...payload})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){try{const j=await call('list');login.style.display='none';dash.style.display='block';logout.style.display='block';document.getElementById('stats').textContent=`${j.applications.length} application${j.applications.length===1?'':'s'}`;apps.innerHTML=j.applications.length?j.applications.map(a=>`<article class="app" data-id="${a.id}"><div class="app-top"><div><div class="name">${esc(a.name)}</div><div class="email">${esc(a.email)} · ${new Date(a.created_at).toLocaleString()}</div></div><div class="badges"><span class="badge ${esc(a.decision||'')}">${esc(a.decision||a.status||'new')}</span><span class="badge">${esc(a.payment_status||'unpaid')}</span>${a.onboarding_completed_at?'<span class="badge accepted">onboarded</span>':''}</div></div><div class="grid"><div class="q"><b>Current situation</b><span>${esc(a.current_situation||'')}</span></div><div class="q"><b>Why remote work</b><span>${esc(a.why_remote_work||'')}</span></div><div class="q"><b>What they tried</b><span>${esc(a.what_tried||'')}</span></div><div class="q"><b>Biggest obstacle</b><span>${esc(a.biggest_obstacle||'')}</span></div><div class="q"><b>Remote work interest</b><span>${esc(a.remote_work_interest||'')}</span></div><div class="q"><b>Weekly commitment</b><span>${esc(a.weekly_commitment||'')}</span></div></div><div class="actions"><button class="accept" onclick="decide('${a.id}','accepted',this)">Accept + send enrollment email</button><button class="decline" onclick="decide('${a.id}','declined',this)">Decline</button>${a.decision==='accepted'?`<button class="copy" onclick="copyLink('${a.enrollment_token}',this)">Copy enrollment link</button>`:''}</div><div class="notice"></div></article>`).join(''):'<div class="empty">No Academy applications yet.</div>'}catch(e){sessionStorage.removeItem('assistara_admin_token');token='';login.style.display='block';dash.style.display='none';logout.style.display='none'}}
window.decide=async(id,decision,btn)=>{const card=btn.closest('.app'),notice=card.querySelector('.notice');btn.disabled=true;btn.textContent=decision==='accepted'?'Sending acceptance...':'Updating...';try{const j=await call('decision',{id,decision});notice.style.display='block';notice.textContent=decision==='accepted'?'Accepted. Enrollment email sent.':'Application declined and email sent.';if(j.enrollment_url){notice.textContent+=' '+j.enrollment_url}setTimeout(load,700)}catch(e){notice.style.display='block';notice.textContent=e.message;btn.disabled=false}};
window.copyLink=async(t,btn)=>{await navigator.clipboard.writeText(location.origin+'/academy/checkout?token='+t);const old=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=old,1200)};
document.getElementById('loginBtn').onclick=async()=>{const b=document.getElementById('loginBtn'),err=document.getElementById('loginError');b.disabled=true;b.textContent='Logging in...';err.style.display='none';try{const j=await call('login',{username:document.getElementById('username').value.trim(),password:document.getElementById('password').value});token=j.token;sessionStorage.setItem('assistara_admin_token',token);await load()}catch(e){err.textContent=e.message;err.style.display='block'}finally{b.disabled=false;b.textContent='Log in'}};
logout.onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};if(token)load();
</script></body></html>
