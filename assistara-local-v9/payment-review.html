<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistara Payment Review</title><style>body{margin:0;background:#f4f3ef;font-family:Arial,sans-serif;color:#171717}.card{max-width:560px;margin:60px auto;background:#fff;border-radius:24px;padding:32px;box-sizing:border-box}.brand{font-size:24px;font-weight:800}.brand span{background:#ffd51f;border-radius:10px;padding:8px 11px;margin-right:8px}h1{margin-top:32px;font-size:30px}.muted{color:#6d6963;line-height:1.6}button{border:0;border-radius:12px;padding:15px 20px;font-weight:800;font-size:16px;cursor:pointer;margin:8px 8px 0 0}.approve{background:#ffd51f;color:#171717}.reject{background:#eeeae4;color:#171717}#msg{margin-top:22px;font-weight:700}</style></head><body><main class="card"><div class="brand"><span>A</span>Assistara</div><h1>GCash payment review</h1><p class="muted">Confirm the payment decision below. The result is written to Admin immediately and the applicant is emailed automatically.</p><div id="actions"><button class="approve" onclick="review('approve')">✓ Approve payment</button><button class="reject" onclick="review('reject')">✕ Could not verify</button></div><div id="msg"></div></main><script>const q=new URLSearchParams(location.search),token=q.get('token'),suggested=q.get('action');async function review(action){if(!token)return show('This review link is invalid.');if(action==='reject'&&!confirm('Could not verify this payment? The applicant will be asked to reply with a screenshot.'))return;document.getElementById('actions').style.pointerEvents='none';show('Saving…');try{const r=await fetch('https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/review-gcash-payment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Could not save decision');show(d.message||'Saved. You can close this page.');if(r.ok)document.getElementById('actions').style.display='none'}catch(e){show(e.message);document.getElementById('actions').style.pointerEvents='auto'}}function show(x){document.getElementById('msg').textContent=x}if(suggested==='approve'||suggested==='reject')document.querySelector('.'+(suggested==='approve'?'approve':'reject')).focus();</script></body></html>
