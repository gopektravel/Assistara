<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Assistara | QR Ph Sandbox</title>
<link rel="icon" href="/assistara-logo.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;background:#fbfaf6;color:#171717;font-family:Manrope,sans-serif;padding:32px 18px}.card{max-width:560px;margin:40px auto;background:#fff;border:1px solid #e8e5dd;border-radius:24px;padding:30px;box-shadow:0 18px 60px rgba(0,0,0,.06)}.logo{width:150px;margin-bottom:24px}.tag{display:inline-block;background:#fff3b0;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.warn{background:#fff5f5;border:1px solid #ffd1d1;border-radius:14px;padding:14px;font-size:13px}.btn{border:0;border-radius:13px;padding:15px 18px;background:#ffd51f;color:#171717;font:800 14px Manrope;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#171717;color:white}.btn:disabled{opacity:.5}.qr{max-width:300px;width:100%;display:block;margin:22px auto}.meta{font-size:12px;color:#6b6862;word-break:break-all}pre{white-space:pre-wrap;word-break:break-word;background:#f5f4f0;border-radius:12px;padding:13px;font-size:12px}</style></head>
<body><main class="card"><img class="logo" src="/assistara-logo.svg" alt="Assistara"><span class="tag">SANDBOX ONLY</span><h1>QR Ph payment test</h1>
<p>Generate a <b>PHP 100.00 test payment</b>. This does not update any Assistara student, application or payment record.</p>
<div class="warn"><b>Do not pay this QR with real money.</b> In PayMongo test mode, use the simulator link returned below.</div><br>
<button class="btn" id="go">Generate PHP 100 test QR</button><section id="out"></section></main>
<script>
const API='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/paymongo-qrph-sandbox-test';
const out=document.getElementById('out'),go=document.getElementById('go');
async function call(body){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw new Error(x.error||'Request failed');return x}
go.onclick=async()=>{go.disabled=true;out.innerHTML='<p>Generating...</p>';try{const x=await call({action:'start'});window.pi=x.payment_intent_id;let h='<hr><h2>QR generated</h2><p class="meta">Payment Intent: '+x.payment_intent_id+'</p>';if(x.qr_image)h+='<img class="qr" src="'+x.qr_image+'" alt="PayMongo QR Ph sandbox QR">';if(x.test_url)h+='<p><a class="btn secondary" target="_blank" rel="noopener" href="'+x.test_url+'">Simulate successful payment</a></p>';else h+='<p><b>No simulator link was returned.</b></p>';h+='<button class="btn" onclick="statusCheck()">Check payment status</button><pre id="status">'+JSON.stringify(x.summary,null,2)+'</pre>';out.innerHTML=h}catch(e){out.innerHTML='<pre>'+String(e)+'</pre>'}finally{go.disabled=false}};
async function statusCheck(){const s=document.getElementById('status');s.textContent='Checking...';try{s.textContent=JSON.stringify(await call({action:'status',payment_intent_id:window.pi}),null,2)}catch(e){s.textContent=String(e)}}
</script></body></html>
