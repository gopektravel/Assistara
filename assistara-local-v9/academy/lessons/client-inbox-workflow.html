<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Build a Client Inbox Workflow | Assistara Academy</title>
  <link rel="icon" href="/assistara-logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/manrope-lock.css" />
  <style>
    :root{--ink:#171717;--cream:#f7f5ef;--yellow:#ffd51f;--line:#e3e0d8;--muted:#716b63;--white:#fff;--mint:#dff5e9;--lav:#e9ddff;--peach:#ffe0cc}
    *{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.55 Manrope,Arial,sans-serif}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:34px;height:34px}.back{font-weight:800;color:var(--muted);text-decoration:none}.crumb{padding:25px 0 10px;color:var(--muted);font-size:13px;font-weight:700}.preview-note{margin:12px 0 0;padding:11px 13px;border-radius:13px;background:#fff5cf;font-size:13px;font-weight:800}.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:end;padding:16px 0 32px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--muted)}h1{font-size:clamp(38px,6vw,64px);line-height:1;letter-spacing:-.055em;margin:10px 0 14px}.lead{font-size:18px;color:var(--muted);max-width:700px;margin:0}.status{border:1px solid var(--line);padding:9px 13px;border-radius:999px;background:#fff;font-size:12px;font-weight:800;white-space:nowrap}.status.done{background:var(--mint);border-color:#a7d9b6}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(270px,.8fr);gap:24px;align-items:start}.main{display:grid;gap:22px}.side{display:grid;gap:16px;position:sticky;top:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:25px}.video{background:var(--ink);color:#fff;min-height:330px;display:grid;place-items:center;position:relative;overflow:hidden}.video::after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:var(--yellow);right:-100px;top:-110px}.video-inner{max-width:470px;text-align:center;z-index:1;padding:34px}.play{width:68px;height:68px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;color:#171717;font-size:24px;margin:0 auto 20px}.video h2{font-size:28px;line-height:1.1;margin:0 0 10px}.video p{color:#c9c6bf;margin:0}.small{font-size:13px;color:var(--muted)}h2{font-size:25px;line-height:1.15;letter-spacing:-.035em;margin:0 0 10px}h3{font-size:17px;margin:0 0 5px}.key{display:grid;gap:12px}.key div{padding:14px 0;border-bottom:1px solid var(--line)}.key div:last-child{border:0;padding-bottom:0}.num{display:inline-grid;place-items:center;width:27px;height:27px;background:var(--yellow);border-radius:9px;font-size:12px;font-weight:800;margin-right:9px}.download{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;color:var(--ink);padding:15px;border-radius:15px;background:var(--cream);font-weight:800}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:13px 18px;background:var(--yellow);font:800 14px Manrope;color:var(--ink);text-decoration:none;cursor:pointer}.button.secondary{background:#fff;border:1px solid var(--line)}.button:disabled{opacity:.45;cursor:not-allowed}.exercise-grid{display:grid;gap:12px}.message{border:1px solid var(--line);border-radius:16px;padding:16px}.message p{margin:5px 0;color:var(--muted);font-size:13px}.row{display:grid;grid-template-columns:190px 1fr;gap:10px;margin-top:12px}select,textarea,input{width:100%;font:14px Manrope;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff;color:var(--ink)}textarea{min-height:106px;resize:vertical}.q input{width:auto;padding:0}.notice{display:none;margin-top:13px;border-radius:13px;padding:12px 14px;font-weight:700;font-size:13px}.notice.show{display:block}.notice.ok{display:block;background:var(--mint)}.notice.warn{display:block;background:#fff5cf}.quiz{display:grid;gap:17px}.q{border-top:1px solid var(--line);padding-top:18px}.q:first-child{border-top:0;padding-top:0}.q label{display:block;margin:7px 0;padding:9px 11px;border-radius:10px;cursor:pointer}.q label:hover{background:var(--cream)}.feedback{display:none;margin-top:8px;padding:10px 12px;border-radius:10px;font-size:13px}.feedback.show{display:block}.feedback.good{background:var(--mint)}.feedback.bad{background:var(--peach)}.progress{height:8px;background:#eceae4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--yellow);transition:.25s}.next{background:var(--ink);color:#fff}.next p{color:#c9c6bf;margin:8px 0 0}.loading{padding:100px 0;text-align:center;color:var(--muted)}@media(max-width:780px){.shell{width:min(100% - 28px,1120px)}.top{padding:13px 0}.hero{display:block;padding-bottom:22px}.hero .status{display:inline-block;margin-top:16px}.layout{grid-template-columns:1fr}.side{position:static;order:-1}.video{min-height:270px}.card{padding:19px;border-radius:18px}.row{grid-template-columns:1fr}.lead{font-size:16px}h1{font-size:42px}.button{min-height:46px}.download{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell" id="app"><div class="loading">Loading your lesson...</div></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
  <script>
  (function(){
    const lessonKey='core-admin-client-inbox-workflow'; const preview=new URLSearchParams(location.search).get('preview')==='1'; let client,user,progress={action_submitted:false,quiz_passed:false};
    const messages=[
      ['Customer delivery issue','Hi, my order #4821 has not arrived. I need it for Friday. Can you help?','reply'],
      ['Meeting confirmation','Can you confirm whether Mia is free Tuesday afternoon?','draft'],
      ['Industry newsletter','September retail trend report: three articles to read.','file'],
      ['Refund request','I want a refund.','task'],
      ['Internal research request','Please find three competitor examples before our Thursday planning call.','task'],
      ['Payment receipt','Receipt: September software subscription paid.','file']
    ];
    const quiz=[
      {q:'Before setting labels or filters, what should you establish?',a:['Your preferred system','The client’s preferences and permissions','A goal of zero unread messages'],c:1,e:'The inbox must reflect the client’s priorities, response rules and access boundaries.'},
      {q:'A customer says an order is late and needs it Friday. What is the strongest first action?',a:['Reply now with a clear next update','Archive it because delivery handles it','Wait for the client to notice it'],c:0,e:'A time-sensitive customer problem needs an acknowledged next step and a clear update time.'},
      {q:'When should you draft a message for review?',a:['When it needs the client’s voice, approval or decision','When the email has no deadline','Whenever you want a cleaner inbox'],c:0,e:'Drafting protects the client’s voice and keeps approval with the right person.'},
      {q:'Which detail makes a reply more useful?',a:['A promise to check without a timeframe','A clear action and the next update','A longer apology'],c:1,e:'The recipient needs to know what happens next and when they can expect an update.'},
      {q:'What should happen to work that needs research before it can be completed?',a:['Turn it into a task with a visible next action','Leave it unread','Answer immediately with a guess'],c:0,e:'Research work needs an owner and a visible follow-up path, not a rushed reply.'},
      {q:'Why should you avoid changing forwarding rules without approval?',a:['They make the inbox look messy','They can change who receives sensitive information','They prevent you from writing replies'],c:1,e:'Forwarding and access settings can expose sensitive information, so the client must approve them.'}
    ];
    function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
    function render(){const app=document.getElementById('app');app.innerHTML=`
      <header class="top"><a class="brand" href="/academy/dashboard"><img src="/assistara-logo.svg" alt=""/>Assistara Academy</a><a class="back" href="/academy/dashboard">← Back to dashboard</a></header>
      <div class="crumb">CORE ADMIN DELIVERY / LESSON 3.2</div>${preview?'<div class="preview-note">Test preview — you can try the full lesson, but progress does not save here.</div>':''}
      <section class="hero"><div><div class="eyebrow">PILOT LESSON</div><h1>Build a Client Inbox Workflow</h1><p class="lead">Turn a busy inbox into clear actions, calm communication and reliable follow-through.</p></div><span class="status ${progress.completed_at?'done':''}" id="status">${progress.completed_at?'Complete':'In progress'}</span></section>
      <div class="layout"><div class="main">
        <section class="card video"><div class="video-inner"><div class="play">▶</div><h2>Lesson video coming soon</h2><p>This space will hold the 9-11 minute teaching video. Read the lesson, complete the simulation and take the knowledge check now.</p></div></section>
        <section class="card"><div class="eyebrow">WHAT YOU WILL LEARN</div><h2>Every message needs a visible next move</h2><div class="key"><div><span class="num">1</span><b>Learn the rules.</b> Ask how the client wants messages handled.</div><div><span class="num">2</span><b>Choose the action.</b> Reply now, draft for review, turn into a task or file it.</div><div><span class="num">3</span><b>Protect trust.</b> Use accurate, clear replies and raise risks early.</div></div></section>
        <section class="card"><div class="eyebrow">PRACTICAL EXERCISE</div><h2>Simulated client inbox</h2><p class="small">You support Maren, owner of a small online store. Choose the best next action for each message. Then draft the reply to the late-delivery customer.</p><div class="exercise-grid">${messages.map((m,i)=>`<article class="message"><h3>${i+1}. ${esc(m[0])}</h3><p>${esc(m[1])}</p><div class="row"><select data-action="${i}"><option value="">Choose next action</option><option value="reply">Reply now</option><option value="draft">Draft for review</option><option value="task">Turn into a task</option><option value="file">File / archive</option></select><input data-note="${i}" aria-label="Next step for message ${i+1}" placeholder="Write the next action in one sentence" /></div></article>`).join('')}</div><h3 style="margin-top:18px">Draft the customer reply</h3><textarea id="replyDraft" placeholder="Write a calm, clear reply to the late-delivery customer."></textarea><button class="button" id="submitAction" style="margin-top:14px">Submit my inbox workflow</button><div class="notice" id="actionNotice"></div></section>
        <section class="card"><div class="eyebrow">KNOWLEDGE CHECK</div><h2>Can you make the right call?</h2><p class="small">You need 80% to pass. You may retry.</p><div class="quiz">${quiz.map((q,i)=>`<div class="q"><h3>${i+1}. ${esc(q.q)}</h3>${q.a.map((a,j)=>`<label><input type="radio" name="q${i}" value="${j}"/> ${esc(a)}</label>`).join('')}<div class="feedback" id="feedback${i}"></div></div>`).join('')}</div><button class="button" id="checkQuiz" style="margin-top:18px">Check my answers</button><div class="notice" id="quizNotice"></div></section>
        <section class="card next"><div class="eyebrow" style="color:#ffd51f">NEXT</div><h2>Core Admin Delivery continues</h2><p>Once you complete this lesson, return to the dashboard. Your next lesson will build calendar and file-management skills.</p></section>
      </div><aside class="side"><section class="card"><div class="eyebrow">YOUR PROGRESS</div><h2 id="progressTitle">${progress.completed_at?'Lesson complete':'Complete the action + quiz'}</h2><div class="progress"><i id="bar"></i></div><p class="small" id="progressText"></p></section><section class="card"><div class="eyebrow">KEEP THIS</div><a class="download" href="/assets/academy/assistara-client-inbox-workflow-checklist.pdf" download>Client Inbox Workflow Checklist <span>↓ PDF</span></a><a class="download" href="/assets/academy/assistara-client-inbox-workflow-lesson-slides.pdf" download style="margin-top:10px">Lesson slides <span>↓ PDF</span></a></section></aside></div>`; bind(); updateProgress();}
    function bind(){document.getElementById('submitAction').onclick=submitAction;document.getElementById('checkQuiz').onclick=checkQuiz;}
    async function save(data){if(preview){progress=Object.assign({},progress,data);updateProgress();return;}const payload=Object.assign({user_id:user.id,lesson_key:lessonKey,updated_at:new Date().toISOString()},progress,data);const {data:row,error}=await client.from('academy_lesson_progress').upsert(payload,{onConflict:'user_id,lesson_key'}).select().single();if(error)throw error;progress=row;updateProgress();}
    function updateProgress(){const action=!!progress.action_submitted, quizOk=!!progress.quiz_passed, complete=action&&quizOk;const pct=complete?100:(action||quizOk?50:0);const bar=document.getElementById('bar');if(bar)bar.style.width=pct+'%';const p=document.getElementById('progressText');if(p)p.textContent=complete?'You completed the pilot lesson.':`${action?'✓ Inbox workflow submitted':'○ Submit your inbox workflow'}  ${quizOk?'✓ Knowledge check passed':'○ Pass the knowledge check'}`;const st=document.getElementById('status');if(st){st.textContent=complete?'Complete':'In progress';st.className='status '+(complete?'done':'');}const t=document.getElementById('progressTitle');if(t)t.textContent=complete?'Lesson complete':'Complete the action + quiz';}
    async function submitAction(){const vals=messages.map((m,i)=>({choice:document.querySelector('[data-action="'+i+'"]').value,note:document.querySelector('[data-note="'+i+'"]').value.trim()}));const draft=document.getElementById('replyDraft').value.trim(),n=document.getElementById('actionNotice');if(vals.some(v=>!v.choice||!v.note)||!draft){n.textContent='Complete every decision, next step and the customer reply before submitting.';n.className='notice show warn';return;}await save({action_submitted:true,completed_at:progress.quiz_passed?new Date().toISOString():null});const correct=vals.filter((v,i)=>v.choice===messages[i][2]).length;n.textContent=`Saved. You made ${correct}/6 recommended action choices. Review the model logic in the knowledge check, then pass it to complete the lesson.`;n.className='notice ok';}
    async function checkQuiz(){let score=0,answered=0;quiz.forEach((q,i)=>{const selected=document.querySelector('input[name="q'+i+'"]:checked');const f=document.getElementById('feedback'+i);if(selected)answered++;const ok=selected&&Number(selected.value)===q.c;if(ok)score++;f.textContent=(ok?'Correct. ':'Not quite. ')+q.e;f.className='feedback show '+(ok?'good':'bad');});const n=document.getElementById('quizNotice');if(answered<quiz.length){n.textContent='Answer every question before checking your work.';n.className='notice show warn';return;}const percent=Math.round(score/quiz.length*100),passed=percent>=80;await save({quiz_score:percent,quiz_passed:passed,completed_at:(passed&&progress.action_submitted)?new Date().toISOString():null});n.textContent=passed?`You scored ${percent}%. ${progress.action_submitted?'Lesson complete.':'Submit the inbox workflow to finish the lesson.'}`:`You scored ${percent}%. Review the feedback and try again; you need 80%.`;n.className='notice '+(passed?'ok':'show warn');}
    async function start(){if(preview){render();return;}if(!window.supabase){document.getElementById('app').innerHTML='<div class="loading">Could not load the Academy. Please refresh.</div>';return;}client=window.supabase.createClient('https://jhmmwleejgidrxavzdlq.supabase.co','sb_publishable_-hXhNTcQ7T2yW0SgVAXSrg_2FaPui1E');const {data:{user:u}}=await client.auth.getUser();if(!u){location.replace('/login?next=/academy/lessons/client-inbox-workflow');return;}user=u;const {data,error}=await client.from('academy_lesson_progress').select('*').eq('lesson_key',lessonKey).maybeSingle();if(error){document.getElementById('app').innerHTML='<div class="loading">Could not load your lesson progress. Please refresh.</div>';return;}progress=data||progress;render();}
    start();
  })();
  </script>
</body>
</html>
