<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F7F1E5"/><rect x="72" y="62" width="48" height="48" rx="12" fill="#FFD928"/><path d="M87 89l10-12 9 10 10-14" fill="none" stroke="#171713" stroke-width="6" stroke-linecap="round"/><text x="138" y="96" font-family="Manrope,Arial" font-size="25" font-weight="800" fill="#171713">Assistara Academy</text><text x="72" y="178" font-family="Manrope,Arial" font-size="18" font-weight="800" letter-spacing="3" fill="#6C695F">CLIENT SCENARIO</text><text x="72" y="270" font-family="Manrope,Arial" font-size="66" font-weight="800" fill="#171713">Put it together.</text><text x="72" y="340" font-family="Manrope,Arial" font-size="30">“Update the onboarding SOP and send the final</text><text x="72" y="380" font-family="Manrope,Arial" font-size="30">version to our contractor.”</text><g><rect x="72" y="440" width="1456" height="250" rx="30" fill="#FFD928"/><text x="120" y="535" font-family="Manrope,Arial" font-size="20" font-weight="800">1. FIND SOP</text><text x="405" y="535" font-family="Manrope,Arial" font-size="20" font-weight="800">2. CHECK ACCESS</text><text x="690" y="535" font-family="Manrope,Arial" font-size="20" font-weight="800">3. COLLABORATE</text><text x="975" y="535" font-family="Manrope,Arial" font-size="20" font-weight="800">4. PRESERVE HISTORY</text><text x="1260" y="535" font-family="Manrope,Arial" font-size="20" font-weight="800">5. SHARE RIGHT ACCESS</text><text x="800" y="780" text-anchor="middle" font-family="Manrope,Arial" font-size="42" font-weight="800">CREATE ORDER. NOT CHAOS.</text></g><text x="1480" y="840" text-anchor="end" font-family="Manrope,Arial" font-size="18" font-weight="700" fill="#6C695F">10 / 10</text></svg>