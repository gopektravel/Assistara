<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Assistara Admin</title>
<link rel="icon" href="/assistara-logo.svg">
<style>
:root{--ink:#171717;--cream:#f7f5ef;--line:#e2ded4;--muted:#746e65;--yellow:#ffd51f;--green:#e8f7ed;--red:#fde9e7;--orange:#fff0db}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 Arial,sans-serif}.shell{width:min(1160px,calc(100% - 28px));margin:auto}.top{margin-top:16px;background:#171717;color:#fff;border-radius:18px;padding:12px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.brand img{width:34px}.topActions,.actions,.quick{display:flex;gap:8px;flex-wrap:wrap}.top button,.quick a,.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;color:var(--ink);font-weight:700;cursor:pointer;text-decoration:none}.top button{border:0}.login{max-width:460px;margin:70px auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px}.field{display:grid;gap:6px;margin-top:12px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff;font:inherit}.field textarea{min-height:90px;resize:vertical}.main{width:100%;margin-top:18px;background:var(--yellow);border:0;border-radius:11px;padding:13px;font-weight:800;cursor:pointer}.dash{display:none;padding:24px 0 60px}.dashHead{display:flex;justify-content:space-between;gap:14px;align-items:end;flex-wrap:wrap}.dashHead h1{margin:0;font-size:32px}.nav{margin:18px 0 14px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;gap:20px;padding:0 14px;overflow:auto}.nav button{border:0;background:none;padding:15px 2px;font-weight:800;white-space:nowrap;cursor:pointer}.nav button.active{border-bottom:3px solid #171717}.quick{margin:14px 0}.quick a{display:inline-flex;align-items:center;gap:6px}.quick a:hover,.actions button:hover{border-color:#aaa}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{display:block;font-size:25px}.stat span,.sub{font-size:12px;color:var(--muted)}.search{margin:0 0 14px;width:100%;max-width:420px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.cards{display:grid;gap:10px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px}.cardTop{display:flex;justify-content:space-between;gap:15px;align-items:start}.name{font-size:18px;font-weight:800}.badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.badge{font-size:10px;font-weight:800;text-transform:uppercase;padding:5px 8px;border-radius:999px;background:#efede8;white-space:nowrap}.badge.Booked{background:#fff0db}.badge.Attended,.badge.Qualified,.badge.Won{background:var(--green)}.badge.No-show,.badge.Lost{background:var(--red)}.badge.Proposal{background:#e9e4ff}.details{display:none;border-top:1px solid var(--line);margin-top:15px;padding-top:15px}.card.open .details{display:block}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.fact{background:#faf9f5;border-radius:10px;padding:10px;font-size:13px}.fact b{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.answers{margin:14px 0;padding:12px;background:#faf9f5;border-radius:10px}.answers div{padding:8px 0;border-bottom:1px solid var(--line)}.answers div:last-child{border:0}.answers b{display:block;font-size:12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions .save{background:var(--yellow);border-color:var(--yellow)}.actions .accept{background:#171717;color:#fff;border-color:#171717}.empty{background:#fff;border:1px dashed var(--line);border-radius:14px;padding:30px;text-align:center;color:var(--muted)}.toast{position:fixed;right:20px;bottom:20px;padding:13px 16px;border-radius:12px;background:#171717;color:#fff;display:none}.toast.show{display:block}.error{color:#8b2825;margin-top:10px}@media(max-width:680px){.stats{grid-template-columns:1fr 1fr}.facts,.formgrid{grid-template-columns:1fr}.cardTop{display:block}.badges{justify-content:start;margin-top:10px}.top{align-items:flex-start}.topActions{justify-content:flex-end}}
</style></head><body><div class="shell">
<header class="top"><div class="brand"><img src="/assistara-logo.svg" alt=""><span>Assistara Admin</span></div><div class="topActions"><button id="testPortal" hidden>Test student portal</button><button id="logout" hidden>Log out</button></div></header>
<section id="login" class="login"><h1>Admin login</h1><p>Manage Assistara operations and discovery calls.</p><label class="field">Username<input id="username" value="admin"></label><label class="field">Password<input id="password" type="password"></label><button id="loginBtn" class="main">Log in</button><div id="loginError" class="error"></div></section>
<main id="dash" class="dash"><div class="dashHead"><div><h1>Admin Console</h1><div class="sub">Applications, students and B2B discovery calls.</div></div><div class="quick"><a href="https://mail.nameslink.com/" target="_blank" rel="noreferrer">Email ↗</a><a href="https://app.clickup.com/1300450000003242/home" target="_blank" rel="noreferrer">ClickUp ↗</a><a href="https://supabase.com/dashboard/project/jhmmwleejgidrxavzdlq" target="_blank" rel="noreferrer">Database ↗</a></div></div>
<nav class="nav"><button class="active" data-tab="applications">Applications</button><button data-tab="b2b">B2B discovery calls</button></nav><input id="search" class="search" placeholder="Search name, email, company or notes…"><div id="stats" class="stats"></div><section id="cards" class="cards"></section></main></div><div id="toast" class="toast"></div>
<script>
const ADMIN='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-api',APPS='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-applications',B2B='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/admin-b2b-calls';let token=sessionStorage.getItem('assistara_admin_token')||'',tab='applications',applications=[],calls=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const format=v=>v?new Date(v).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'—';async function request(url,action,data={}){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Request failed');return j}function toast(text){$('toast').textContent=text;$('toast').className='toast show';setTimeout(()=>$('toast').className='toast',2400)}function matches(x){const q=$('search').value.trim().toLowerCase();return !q||JSON.stringify(x).toLowerCase().includes(q)}function badge(x){return '<span class="badge '+esc(x)+'">'+esc(x)+'</span>'}function stats(items){$('stats').innerHTML=items.map(x=>'<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')}function answers(x){const a=x.qualifying_answers||{};const rows=Object.entries(a).map(([k,v])=>'<div><b>'+esc((v&&v.label)||k)+'</b>'+esc(typeof v==='object'?(v.value??v.answer??JSON.stringify(v)):v)+'</div>');return rows.length?'<div class="answers"><b>Qualifying answers</b>'+rows.join('')+'</div>':''}function renderApps(){const list=applications.filter(matches);stats([[list.length,'Applications'],[list.filter(x=>x.decision==='accepted').length,'Accepted'],[list.filter(x=>x.payment_status==='paid').length,'Paid'],[list.filter(x=>!x.decision).length,'Needs review']]);$('cards').innerHTML=list.length?list.map(x=>'<article class="card"><div class="cardTop"><div><div class="name">'+esc(x.name||'No name')+'</div><div class="sub">'+esc(x.email||'')+'</div></div><div class="badges">'+badge(x.decision||x.status||'new')+badge(x.payment_status||'not requested')+'</div></div><div class="actions"><button class="accept" onclick="reviewApp(\''+x.id+'\',\'accepted\')">Accept</button><button onclick="reviewApp(\''+x.id+'\',\'declined\')">Decline</button></div></article>').join(''):'<div class="empty">No applications match this search.</div>'}function callCard(x){return '<article class="card" id="call-'+x.id+'"><div class="cardTop"><div><div class="name">'+esc(x.business_name||x.contact_name)+'</div><div class="sub">'+esc(x.contact_name)+' · '+esc(x.contact_email)+'</div><div class="sub">'+format(x.call_start_at)+' · '+esc(x.timezone||'Timezone not supplied')+'</div></div><div class="badges">'+badge(x.pipeline_status)+badge(x.cal_booking_status)+'</div></div><div class="actions"><button onclick="toggleCall(\''+x.id+'\')">Open prospect</button></div><div class="details"><div class="facts"><div class="fact"><b>Call</b>'+format(x.call_start_at)+' – '+format(x.call_end_at)+'</div><div class="fact"><b>Phone</b>'+esc(x.contact_phone||'Not supplied')+'</div><div class="fact"><b>Cal.com booking</b>'+esc(x.cal_booking_id)+'</div></div>'+answers(x)+'<div class="formgrid"><label class="field">Pipeline status<select id="status-'+x.id+'">'+['Booked','Attended','No-show','Qualified','Proposal','Won','Lost'].map(s=>'<option '+(x.pipeline_status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><label class="field">Follow-up date<input id="follow-'+x.id+'" type="datetime-local" value="'+(x.follow_up_at?x.follow_up_at.slice(0,16):'')+'"></label><label class="field">Deal value<input id="value-'+x.id+'" type="number" min="0" step="0.01" value="'+esc(x.deal_value??'')+'"></label><label class="field">Lost reason<input id="lost-'+x.id+'" value="'+esc(x.lost_reason||'')+'"></label></div><label class="field">Internal notes<textarea id="notes-'+x.id+'">'+esc(x.internal_notes||'')+'</textarea></label><div class="actions"><button class="save" onclick="saveCall(\''+x.id+'\')">Save changes</button></div></div></article>'}function renderCalls(){const list=calls.filter(matches);const upcoming=list.filter(x=>x.cal_booking_status==='scheduled'&&x.call_start_at&&new Date(x.call_start_at)>new Date());stats([[list.length,'Discovery calls'],[upcoming.length,'Upcoming'],[list.filter(x=>x.pipeline_status==='Qualified').length,'Qualified'],[list.filter(x=>x.pipeline_status==='Won').length,'Won']]);$('cards').innerHTML=list.length?list.map(callCard).join(''):'<div class="empty">No discovery calls yet. Your first Cal.com booking will appear here automatically.</div>'}function render(){tab==='b2b'?renderCalls():renderApps()}async function load(){const [a,b]=await Promise.all([request(APPS,'list'),request(B2B,'list')]);applications=a.applications||[];calls=b.calls||[];render()}window.toggleCall=id=>{$('call-'+id).classList.toggle('open')};window.saveCall=async id=>{try{await request(B2B,'update',{id,pipeline_status:$('status-'+id).value,follow_up_at:$('follow-'+id).value?new Date($('follow-'+id).value).toISOString():'',deal_value:$('value-'+id).value,internal_notes:$('notes-'+id).value,lost_reason:$('lost-'+id).value});toast('Discovery call updated');await load()}catch(e){alert(e.message)}};window.reviewApp=async(id,decision)=>{try{if(!confirm(decision==='accepted'?'Accept this application and send the email?':'Decline this application and send the email?'))return;await request(ADMIN,'decision',{id,decision});toast(decision==='accepted'?'Accepted + email sent':'Declined + email sent');await load()}catch(e){alert(e.message)}};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').oninput=render;$('loginBtn').onclick=async()=>{try{const r=await fetch(ADMIN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',username:$('username').value,password:$('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Login failed');token=d.token;sessionStorage.setItem('assistara_admin_token',token);show();await load()}catch(e){$('loginError').textContent=e.message}};$('logout').onclick=()=>{sessionStorage.removeItem('assistara_admin_token');location.reload()};$('testPortal').onclick=()=>location.href='/academy/test-portal';function show(){$('login').style.display='none';$('dash').style.display='block';$('logout').hidden=false;$('testPortal').hidden=false}if(token){show();load().catch(e=>{sessionStorage.removeItem('assistara_admin_token');$('loginError').textContent=e.message;$('login').style.display='block';$('dash').style.display='none'})}
</script></body></html>
