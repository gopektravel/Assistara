name: Remove original masterclass top bar
on:
  push:
    paths: ['.github/workflows/remove-original-masterclass-topbar.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove original top message and simplify bubble
        run: |-
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/academy.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="topbar"><a href="#free-masterclass">Free masterclass: How to Land a Remote Job as a Complete Beginner →</a></div>\n','',1)
          s=s.replace('Free Masterclass → Save My Seat','Free Masterclass →')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate top bar removal (read-only)
        run: |-
          echo "Top bar removal validation complete - no changes pushed to main"