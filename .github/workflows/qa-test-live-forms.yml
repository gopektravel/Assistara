name: QA test live Assistara forms
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-test-live-forms.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Test masterclass, B2B and Academy form flows
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/website-form-proxy'
          ORIGIN='https://www.getassistara.com'
          TS=$(date +%s)
          call() {
            label="$1"
            payload="$2"
            echo "Testing $label"
            response=$(curl -sS --fail-with-body "$ENDPOINT" \
              -H "Origin: $ORIGIN" \
              -H 'Content-Type: application/json' \
              --data "$payload")
            echo "$response"
            echo "$response" | grep -q '"ok":true'
            echo "$response" | grep -q '"emailSent":true'
          }
          call masterclass "{\"type\":\"masterclass\",\"name\":\"QA Masterclass $TS\",\"email\":\"jessevanrobbroeck+qa-masterclass-$TS@gmail.com\"}"
          call b2b "{\"type\":\"b2b\",\"name\":\"QA B2B $TS\",\"email\":\"jessevanrobbroeck+qa-b2b-$TS@gmail.com\",\"company\":\"Assistara QA\",\"time_thieves\":\"QA test\",\"support_level\":\"Not sure yet\"}"
          call academy "{\"type\":\"academy_application\",\"name\":\"QA Academy $TS\",\"email\":\"jessevanrobbroeck+qa-academy-$TS@gmail.com\",\"current_situation\":\"QA\",\"why_remote_work\":\"QA\",\"what_tried\":\"QA\",\"biggest_obstacle\":\"QA\",\"remote_work_interest\":\"QA\",\"weekly_commitment\":\"Yes\",\"payment_readiness\":\"Yes, ready at ₱6,900\"}"
          echo "ALL_FORM_QA_TESTS_PASSED"
