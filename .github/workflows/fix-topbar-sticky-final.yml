name: Make only small yellow CTA sticky
on:
  push:
    paths: ['.github/workflows/fix-topbar-sticky-final.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix sticky CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/academy.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="topbar-sticky-final">
          /* FINAL: only the small yellow masterclass CTA at the very top is sticky. */
          .topbar{position:sticky!important;top:0!important;z-index:1000!important;margin:0!important;box-shadow:0 2px 8px rgba(0,0,0,.08)!important}
          .header{position:relative!important;top:auto!important;z-index:20!important}
          .masterclass-form button[type="submit"],.masterclass-form .btn-yellow,a[href="/masterclass/join"].btn-yellow,a[href="/masterclass/join/"].btn-yellow{position:static!important;top:auto!important;bottom:auto!important}
          @media(min-width:621px){
            .topbar{padding:8px 16px!important;font-size:12px!important;line-height:18px!important}
            .header{padding:14px 0!important}
            .nav{min-height:64px!important;padding:10px 12px 10px 18px!important}
            .hero{padding-top:78px!important}
          }
          @media(max-width:620px){
            .topbar{padding:6px 10px!important;font-size:9px!important;line-height:13px!important;min-height:25px!important}
            .header{padding:8px 0!important}
          }
          </style>'''
          if 'id="topbar-sticky-final"' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Assistara UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assistara-local-v9/academy.html
          git diff --cached --quiet || git commit -m "Make only small yellow masterclass CTA sticky"
          git push