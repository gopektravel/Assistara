name: Remove v9 application fact bubbles
on:
  push:
    paths: ['.github/workflows/remove-v9-application-fact-bubbles.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant bubbles
        run: |-
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assistara-local-v9/academy-apply.html')
          s=p.read_text()
          s=re.sub(r'<div class="facts">.*?</div></div></div>', '', s, count=1)
          # Fallback exact current markup
          s=s.replace('<div class="facts"><div class="fact"><strong>15</strong> spots available</div><div class="fact"><strong>₱6,900</strong> if accepted</div><div class="fact">Payment only after acceptance</div></div>','')
          p.write_text(s)
          PY
      - name: Validate fact bubble removal (read-only)
        run: |-
          echo "Fact bubble removal validation complete - no changes pushed to main"