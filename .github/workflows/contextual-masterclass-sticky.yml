name: Contextual masterclass sticky CTA
on:
  push:
    paths: ['.github/workflows/contextual-masterclass-sticky.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contextual sticky CTA
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/academy.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="contextual-masterclass-sticky">
          /* The original yellow announcement is normal content, not sticky. */
          .topbar{position:static!important;top:auto!important;z-index:auto!important;box-shadow:none!important}
          .header{position:relative!important;top:auto!important}
          #masterclassStickyCta{position:fixed;left:50%;top:10px;transform:translate(-50%,-16px);z-index:1200;background:#ffd51f;color:#111;border-radius:999px;padding:9px 16px;font:800 12px/1.15 "DM Sans",Arial,sans-serif;box-shadow:0 6px 22px rgba(0,0,0,.16);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,transform .18s ease;white-space:nowrap}
          #masterclassStickyCta.is-visible{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0)}
          @media(max-width:620px){#masterclassStickyCta{top:7px;padding:8px 13px;font-size:10px;max-width:calc(100vw - 24px)}}
          </style>'''
          cta='''<a id="masterclassStickyCta" href="#free-masterclass" aria-label="Save your seat for the free masterclass">Free Masterclass → Save My Seat</a>'''
          js='''<script id="contextual-masterclass-sticky-js">
          (function(){
            var section=document.getElementById('free-masterclass');
            var cta=document.getElementById('masterclassStickyCta');
            if(!section||!cta)return;
            function update(){
              var r=section.getBoundingClientRect();
              var passed=r.bottom<=0;
              cta.classList.toggle('is-visible',passed);
            }
            window.addEventListener('scroll',update,{passive:true});
            window.addEventListener('resize',update);
            update();
          })();
          </script>'''
          if 'id="contextual-masterclass-sticky"' not in s:
              s=s.replace('</head>',css+'\n</head>',1)
          if 'id="masterclassStickyCta"' not in s:
              s=s.replace('<body>','<body>\n'+cta,1)
          if 'id="contextual-masterclass-sticky-js"' not in s:
              s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Assistara UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assistara-local-v9/academy.html
          git diff --cached --quiet || git commit -m "Show masterclass sticky CTA after signup section"
          git push