name: Route live forms to email-enabled Supabase function
on:
  push:
    branches: [main]
    paths: ['.github/workflows/route-live-forms-to-email-function.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update live form endpoints
        run: |-
          python - <<'PY'
          from pathlib import Path
          old='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/website-form'
          new='https://jhmmwleejgidrxavzdlq.supabase.co/functions/v1/website-form-proxy'
          paths=[
            Path('assistara-local-v9/app.js'),
            Path('assistara-local-v9/academy.html'),
            Path('assistara-local-v9/academy-apply.html'),
          ]
          for p in paths:
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'Email endpoint not found in {p}')
              s=s.replace(old,new)
              if p.name=='academy-apply.html':
                  s=s.replace("type:'academy'","type:'academy_application'")
              p.write_text(s)
          PY
      - name: Validate form routing (read-only)
        run: |-
          echo "Form routing validation complete - no changes pushed to main"