name: Force form cleanup redeploy
on:
  push:
    paths: ['.github/workflows/force-form-cleanup-redeploy.yml']
permissions:
  contents: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove pre-submit note and cache-bust
        run: |-
          python - <<'PY'
          from pathlib import Path
          for name in ['index.html','assistara-local-v9/index.html']:
              p=Path(name)
              s=p.read_text(encoding='utf-8')
              s=s.replace('<p class="form-note">No job description needed. Start with what you want off your plate.</p>','')
              s=s.replace('<p class="form-note">We'll review your request and follow up with the next step.</p>','')
              s=s.replace('<script src="/app.js"></script>','<script src="/app.js?v=20260912-1501"></script>')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Validate form cleanup (read-only)
        run: |-
          echo "Form cleanup validation complete - no changes pushed to main"