name: One-time footer CTA swap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/footer-cta-swap.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Swap footer CTAs
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in ['app.js', 'assistara-local-v9/app.js']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('href="#match">Find my virtual assistant <b>→</b></a>', 'href="/academy">Become a Virtual Assistant <b>→</b></a>')
              p.write_text(s)

          for name in ['academy.html', 'assistara-local-v9/academy.html']:
              p = Path(name)
              s = p.read_text()
              s = s.replace('href="#checkout">Explore enrollment <b>→</b></a>', 'href="/#match">Find my virtual assistant <b>→</b></a>')
              s = s.replace('href="#checkout">Explore enrollment →</a>', 'href="/#match">Find my virtual assistant →</a>')
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js assistara-local-v9/app.js academy.html assistara-local-v9/academy.html
          git diff --cached --quiet || git commit -m "Swap footer CTAs between main and Academy"
          git push
