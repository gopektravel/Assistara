name: Assistara UI patch
on:
  push:
    paths: ['.github/workflows/assistara-ui-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update final CTA message
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/index.html')
          s=p.read_text(encoding='utf-8')
          old='<b>Ready to buy back your time?</b><span>30 minutes · No obligation</span>'
          new='<b>You know where your time should go.</b><span>Let us help with the rest.</span>'
          if old not in s: raise SystemExit('Current CTA copy not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "Assistara UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assistara-local-v9/index.html
          git diff --cached --quiet || git commit -m "Update final CTA message"
          git push
