name: Assistara UI patch

on:
  push:
    paths:
      - '.github/workflows/assistara-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Wire discovery call CTAs
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assistara-local-v9/index.html')
          s = p.read_text(encoding='utf-8')
          cal = 'https://cal.com/assistara/assistara-discovery-call'
          replacements = {
            'href="#match">Find your virtual assistant →': f'href="{cal}">Book a Discovery Call →',
            'href="#match">Find my virtual assistant <span>→</span>': f'href="{cal}">Book a Discovery Call <span>→</span>',
            'href="#match">Start my match →': f'href="{cal}">Book a Discovery Call →',
            'href="#match">Take care of the rest →': f'href="{cal}">Book a Discovery Call →',
          }
          changed = 0
          for old,new in replacements.items():
              if old in s:
                  s = s.replace(old,new)
                  changed += 1
          if changed == 0 and cal not in s:
              raise SystemExit('No expected B2B CTA anchors found')
          p.write_text(s, encoding='utf-8')
          print(f'Updated {changed} CTA patterns')
          PY
      - name: Commit patch
        run: |
          git config user.name "Assistara UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assistara-local-v9/index.html
          git diff --cached --quiet || git commit -m "Connect B2B CTAs to Assistara discovery call"
          git push
