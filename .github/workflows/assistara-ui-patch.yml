name: Assistara UI patch
on:
  push:
    paths: ['.github/workflows/assistara-ui-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove obsolete B2B admin UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/admin.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('Manage applicants, students, accounts, webinar reporting and B2B leads.','Manage applicants, students, accounts and webinar reporting.')
          s=s.replace('<button data-tab="b2b">B2B</button>','')
          if s==old: raise SystemExit('Expected B2B admin UI not found')
          p.write_text(s,encoding='utf-8')
          print('Removed visible B2B admin tab and B2B wording')
          PY
      - name: Commit patch
        run: |
          git config user.name "Assistara UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assistara-local-v9/admin.html
          git diff --cached --quiet || git commit -m "Remove obsolete B2B admin tab"
          git push
