name: Assistara UI patch
on:
  push:
    paths: ['.github/workflows/assistara-ui-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore and improve colorful final section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('assistara-local-v9/index.html')
          s=p.read_text(encoding='utf-8')
          start=s.index('<section class="match-wrap final-close" id="match">')
          end=s.index('</section>',start)+len('</section>')
          new='''<section class="match-wrap" id="match"><div class="shell match section"><div class="match-copy"><div class="section-kicker">FIND YOUR VIRTUAL ASSISTANT</div><h2>What should no longer require you?</h2><p>Tell us what keeps stealing your time. We’ll use it to understand the role and the kind of virtual assistant who could own it.</p><div class="match-points"><div><span>✓</span> No need to write a job description</div><div><span>✓</span> Start from the tasks you want gone</div><div><span>✓</span> We help turn those tasks into a role</div></div><div class="closing-discovery-cta"><div><b>Ready to buy back your time?</b><span>30 minutes · No obligation</span></div><a class="btn btn-dark closing-cta-button" href="https://cal.com/assistara/assistara-discovery-call">Book a Discovery Call <span>→</span></a></div></div></div></section>'''
          s=s[:start]+new+s[end:]
          css='''<style id="closing-cta-polish">.match{grid-template-columns:1fr;max-width:900px}.match-copy{position:static}.match-wrap .section{padding-top:88px;padding-bottom:88px}.match-copy>h2{max-width:700px}.match-copy>p{max-width:650px}.closing-discovery-cta{margin-top:38px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 50px rgba(38,30,55,.08);backdrop-filter:blur(10px);border-radius:22px;padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:28px}.closing-discovery-cta>div{display:flex;flex-direction:column;gap:4px}.closing-discovery-cta b{font-size:20px;letter-spacing:-.02em}.closing-discovery-cta>div>span{font-size:12px;color:#625e59;font-weight:600}.closing-cta-button{padding:15px 20px;white-space:nowrap}.assistara-footer-main{padding-top:40px!important;padding-bottom:28px!important}.assistara-footer-bottom{padding-top:16px!important;padding-bottom:0!important}footer{padding-top:0!important;padding-bottom:18px!important}@media(max-width:760px){.match-wrap .section{padding-top:62px;padding-bottom:62px}.closing-discovery-cta{margin-top:30px;align-items:flex-start;flex-direction:column;padding:20px}.closing-cta-button{width:100%;justify-content:space-between}}</style>'''
          s=re.sub(r'<style id="closing-cta-polish">.*?</style>',css,s,count=1,flags=re.S)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "Assistara UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assistara-local-v9/index.html
          git diff --cached --quiet || git commit -m "Restore colorful final section with improved CTA"
          git push
