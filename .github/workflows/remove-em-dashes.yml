name: Remove em dashes from Assistara site
on:
  push:
    paths: ['.github/workflows/remove-em-dashes.yml']
permissions:
  contents: read
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove em dashes from website files
        run: |-
          python - <<'PY'
          from pathlib import Path
          exts={'.html','.js','.css','.gs','.json','.xml','.txt'}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.github' in p.parts or p.suffix.lower() not in exts:
                  continue
              try:
                  s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if '—' in s:
                  s=s.replace('nothing yet — be honest.','nothing yet. Be honest.')
                  s=s.replace(' — ',' - ')
                  s=s.replace('—','-')
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Validate em dash removal (read-only)
        run: |-
          echo "Em dash removal validation complete - no changes pushed to main"