name: Lock Manrope everywhere in V9

on:
  push:
    branches:
      - main
    paths:
      - 'assistara-local-v9/**'
      - '.github/workflows/restore-manrope-everywhere.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate Manrope lock (read-only)
        shell: bash
        run: |
          set -e
          cd assistara-local-v9
          mismatches=0
          echo "Checking for DM Sans (forbidden) in academy HTML/CSS files..."
          for file in *.html; do
            if grep -q 'DM Sans' "$file" || grep -q 'DM+Sans' "$file"; then
              echo "WARNING: DM Sans found in $file - Manrope lock NOT applied"
              mismatches=$((mismatches + 1))
            else
              echo "  OK: $file - Manrope lock applied"
            fi
          done
          for file in *.css; do
            if grep -q 'DM Sans' "$file" || grep -q 'DM+Sans' "$file"; then
              echo "WARNING: DM Sans found in $file - Manrope lock NOT applied"
              mismatches=$((mismatches + 1))
            else
              echo "  OK: $file - Manrope lock applied"
            fi
          done
          if [ "$mismatches" -gt 0 ]; then
            echo "Font validation FAILED: $mismatches page(s) still use DM Sans"
          else
            echo "Font validation PASSED: All pages locked to Manrope"
          fi
      - name: Validation complete (dry-run)
        run: echo "Manrope font validation check complete - no changes pushed to main"
