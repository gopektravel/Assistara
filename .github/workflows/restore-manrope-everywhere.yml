name: Lock Manrope everywhere in V9

on:
  push:
    branches:
      - main
    paths:
      - 'assistara-local-v9/**'
      - '.github/workflows/restore-manrope-everywhere.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock-font:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject Manrope lock into every HTML page
        shell: bash
        run: |
          set -e
          cd assistara-local-v9
          for file in *.html; do
            sed -i 's/DM Sans/Manrope/g; s/DM+Sans/Manrope/g; s/""Manrope",sans-serif"/"Manrope",sans-serif/g' "$file"
            if ! grep -q 'manrope-lock.css' "$file"; then
              sed -i 's#</head>#<link rel="stylesheet" href="/manrope-lock.css?v=20260917-3" />\n</head>#I' "$file"
            fi
          done
          sed -i 's/DM Sans/Manrope/g; s/DM+Sans/Manrope/g; s/""Manrope",sans-serif"/"Manrope",sans-serif/g' *.css || true
          for file in *.html; do grep -q 'manrope-lock.css' "$file" || exit 1; done
      - name: Commit all page fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistara-local-v9
          git commit -m "Apply Manrope lock page by page across V9"
          git push origin main
