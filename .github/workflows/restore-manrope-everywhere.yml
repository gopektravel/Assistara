name: Lock Manrope everywhere in V9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-manrope-everywhere.yml'

permissions:
  contents: write

jobs:
  restore-font:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Enforce Manrope across every V9 page and control
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('assistara-local-v9')
          text_exts = {'.html', '.css', '.js', '.json', '.md', '.svg'}

          # One global lock file, loaded last on every HTML page.
          lock = root / 'manrope-lock.css'
          lock.write_text('''/* Assistara typography lock: Manrope is the only UI font. */
html, body, body *, button, input, textarea, select, option, label, a, p, span, div, section, article, header, footer, nav, main, aside, h1, h2, h3, h4, h5, h6, strong, b, small, em, i, output, table, thead, tbody, tr, th, td, ul, ol, li, form, fieldset, legend, summary, details, dialog, [class], [id], [class]::before, [class]::after, [id]::before, [id]::after {
  font-family: "Manrope", sans-serif !important;
}
''', encoding='utf-8')

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  original = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              updated = original.replace('DM Sans', 'Manrope').replace('DM+Sans', 'Manrope')
              if path.suffix.lower() == '.html' and 'manrope-lock.css' not in updated:
                  tag = '<link rel="stylesheet" href="/manrope-lock.css" />'
                  updated = re.sub(r'</head>', tag + '\n</head>', updated, count=1, flags=re.I)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')

          # Hard guard: every HTML page must load the lock and forbidden font names cannot survive.
          errors = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in text_exts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if 'DM Sans' in text or 'DM+Sans' in text:
                  errors.append(f'forbidden font remains: {path}')
              if path.suffix.lower() == '.html' and 'manrope-lock.css' not in text:
                  errors.append(f'font lock missing: {path}')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Commit typography lock
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No font changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistara-local-v9
          git commit -m "Enforce Manrope everywhere in Assistara V9"
          git push origin main
