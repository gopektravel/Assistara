name: Keep acquisition tracker connected
on:
  push:
    paths:
      - '.github/workflows/add-academy-acquisition-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Connect Acquisition Tracker in admin
        run: |
          python - <<'PY'
          from pathlib import Path
          admin=Path('assistara-local-v9/admin.html')
          s=admin.read_text()
          s=s.replace('>Free webinar</button', '>Webinar Signups</button')
          s=s.replace('>Academy acquisition</button', '>Acquisition Tracker</button')
          s=s.replace('>Acquisition Tool</button', '>Acquisition Tracker</button')
          s=s.replace("onclick=\"location.href='/admin/acquisition'\">Acquisition Tool</button", "onclick=\"location.href='/admin/acquisition'\">Acquisition Tracker</button")
          s=s.replace('Applications, students, Academy acquisition and B2B discovery calls.', 'Applications, students, acquisition tracking and B2B discovery calls.')
          admin.write_text(s)
          PY
      - name: Commit admin navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistara-local-v9/admin.html
          git diff --cached --quiet || git commit -m "Connect Acquisition Tracker in admin"
          git push origin main
