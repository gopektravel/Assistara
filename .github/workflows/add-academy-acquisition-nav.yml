name: Fix admin acquisition routing
on:
  push:
    paths:
      - '.github/workflows/add-academy-acquisition-nav.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Separate tracker from webinar CRM
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/admin.html')
          s=p.read_text()
          s=s.replace("document.querySelectorAll(\".nav button\").forEach(", "document.querySelectorAll(\".nav button[data-tab]\").forEach(")
          old='''          $("cards").innerHTML =\n            '<div class="card">Webinar funnel is connected and reporting from Supabase.</div>';'''
          new='''          const w = web.filter(match);\n          $("cards").innerHTML = w.length\n            ? w.map((x) => `<div class="card"><div class="cardtop"><div><div class="name">${esc(x.name || "No name")}</div><div class="sub">${esc(x.email || "")}${x.phone ? " · " + esc(x.phone) : ""}</div></div><div class="badges">${badge(x.attended ? "Attended" : "Registered")}${x.application_id ? badge("Applied") : ""}${x.purchased ? badge("Purchased") : ""}</div></div><div class="detail"><b>Registered:</b> ${x.created_at ? new Date(x.created_at).toLocaleString() : "—"}${x.source ? "<br><b>Source:</b> " + esc(x.source) : ""}${x.utm_source ? "<br><b>Campaign source:</b> " + esc(x.utm_source) : ""}${x.tracking_token ? "<br><b>Tracking:</b> " + esc(x.tracking_token) : ""}</div></div>`).join("")\n            : '<div class="empty">No webinar signups yet.</div>';'''
          if old not in s:
              raise SystemExit('Expected webinar block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit admin fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistara-local-v9/admin.html
          git diff --cached --quiet || git commit -m "Separate Acquisition Tracker from webinar signups"
          git push origin main
