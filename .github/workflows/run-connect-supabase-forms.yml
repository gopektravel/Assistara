name: Run Supabase form connection
on:
  push:
    paths: ['.github/workflows/run-connect-supabase-forms.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch forms
        run: python scripts/connect_supabase_forms.py
      - name: Commit (dry-run only)
        run: |-
          echo "Forms connection validation complete - no changes pushed to main"