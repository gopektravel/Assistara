name: Outcome-first Academy CTA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/outcome-first-academy-cta.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Academy CTA copy
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['academy.html','assistara-local-v9/academy.html']
          replacements={
            '<h2>Apply for the Founding Cohort.</h2>':'<h2>Ready to get your first client?</h2>',
            '<p>We’re selecting up to 15 committed beginners for the first Assistara Academy cohort. Apply now. If you’re selected, you’ll receive a private enrollment and payment link.</p>':'<p>Turn your remote-work goal into a real path toward your first client. Apply now. If you’re selected, you’ll receive a private invitation to enroll.</p>',
            '<a class="btn btn-yellow full" href="/academy/apply">Apply for the Founding Cohort →</a>':'<a class="btn btn-yellow full" href="/academy/apply">Apply now →</a>'
          }
          for name in files:
              p=Path(name)
              s=p.read_text()
              for old,new in replacements.items():
                  s=s.replace(old,new)
              p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add academy.html assistara-local-v9/academy.html
          git diff --cached --quiet || git commit -m "Make Academy application CTA outcome-first"
          git push
