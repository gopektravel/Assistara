name: V9 Academy scarcity cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v9-academy-scarcity-cleanup.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update v9 Academy application
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/academy-apply.html')
          s=p.read_text()
          s=s.replace('<h1>Apply for one of the first 15 spots.</h1>','<h1>Be one of the first 15.</h1>')
          s=s.replace('<p>We’re keeping the first Assistara Academy cohort intentionally small. We’re looking for beginners who are serious about building a remote career and willing to do the work.</p>','<p>Only 15 spots. Once they’re filled, applications close.</p>')
          s=s.replace('<div class="facts"><div class="fact"><strong>15</strong> spots maximum</div><div class="fact"><strong>₱6,900</strong> if accepted</div><div class="fact">Payment only after acceptance</div></div>','<div class="facts"><div class="fact"><strong>ONLY 15</strong> SPOTS</div><div class="fact"><strong>₱6,900</strong> if accepted</div></div>')
          s=s.replace('<div class="intro"><strong>How it works</strong>Submit your application. We’ll review it for fit. If you’re selected, you’ll receive an acceptance email with your private enrollment and payment link. Applying does not charge you.</div>','<div class="intro"><strong>How it works</strong>Apply for one of the 15 spots. If selected, you’ll receive your private enrollment link.</div>')
          s=s.replace('<div class="price-note"><small>FOUNDING COHORT INVESTMENT</small><strong>₱6,900</strong><p>You do not pay to apply. If selected, you’ll receive an invitation to enroll at the Founding Cohort price.</p></div>','<div class="price-note"><small>FOUNDING COHORT INVESTMENT</small><strong>₱6,900</strong></div>')
          s=s.replace('<p class="fine">Submitting an application does not guarantee acceptance or charge you. Up to 15 applicants will be selected for the Founding Cohort.</p>','<p class="fine">Only 15 spots. Once they’re filled, applications close.</p>')
          s=s.replace(' — ',' - ')
          p.write_text(s)
          PY
      - name: Commit v9 change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assistara-local-v9/academy-apply.html
          git diff --cached --quiet || git commit -m "Make v9 Academy application concise and scarce"
          git push
