name: Refresh Assistara freedom copy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/copy-refresh.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update copy
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
            'Buy back your time. Keep your attention on the work that needs you.': 'Buy back your time. More room to grow. More freedom to live.',
            'Keep your attention on the work that needs you. Assistara helps take care of the repeatable work around it, with a trained virtual assistant matched to your business.': 'More room to grow. More freedom to live. Assistara helps take care of the repeatable work around you, with a trained virtual assistant matched to your business.',
            'Keep your attention on the high-leverage 20%, and delegate the repeatable work around it.': 'Create more room for the high-leverage 20%, and delegate the repeatable work around it.',
            'Protect your attention. Delegate the repeatable work.': 'More room to grow. More freedom to live.',
            'Keep your attention on the work that needs you.': 'More room to grow. More freedom to live.'
          }
          for name in ['index.html','assistara-local-v9/index.html','app.js','assistara-local-v9/app.js']:
              p=Path(name)
              s=p.read_text()
              for old,new in replacements.items(): s=s.replace(old,new)
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assistara-local-v9/index.html app.js assistara-local-v9/app.js
          git diff --cached --quiet || git commit -m "Use growth and freedom positioning across main site"
          git push
