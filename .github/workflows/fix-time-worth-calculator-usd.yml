name: Fix time worth calculator USD
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-time-worth-calculator-usd.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch calculator
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('id="valueOut">€100</output>','id="valueOut">$100</output>')
          s=s.replace('id="delegateOut">€28</output>','id="delegateOut">$28</output>')
          s=s.replace('id="valueYear">€52,000</strong>','id="valueYear">$52,000</strong>')
          s=s.replace('id="netYear">€37,440</strong>','id="netYear">$37,440</strong>')
          script='''<script id="time-worth-usd-fix">(function(){var r=document.getElementById('savingsCalculator');if(!r)return;var h=r.querySelector('#hoursRange'),v=r.querySelector('#valueRange'),d=r.querySelector('#delegateRange'),ho=r.querySelector('#hoursOut'),vo=r.querySelector('#valueOut'),do_=r.querySelector('#delegateOut'),ty=r.querySelector('#timeYear'),vy=r.querySelector('#valueYear'),ny=r.querySelector('#netYear');function usd(n){return '$'+Math.round(n).toLocaleString('en-US')}function render(){var hv=Number(h.value)||0,vv=Number(v.value)||0,dv=d?(Number(d.value)||0):0,annual=hv*52;ho.textContent=hv+' hrs';vo.textContent=usd(vv);if(do_)do_.textContent=usd(dv);ty.textContent=annual.toLocaleString('en-US')+' hrs';vy.textContent=usd(annual*vv);if(ny)ny.textContent=usd(annual*Math.max(0,vv-dv))}[h,v,d].filter(Boolean).forEach(function(x){x.addEventListener('input',render)});render()})();</script>'''
          if 'id="time-worth-usd-fix"' not in s:
              s=s.replace('</body>',script+'\n</body>',1)
          s=s.replace('/app.js?v=20260912-2030','/app.js?v=20260917-USD-FIX')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "Assistara UI Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assistara-local-v9/index.html
          git diff --cached --quiet || git commit -m "Fix live time worth calculator in USD"
          git push origin main
