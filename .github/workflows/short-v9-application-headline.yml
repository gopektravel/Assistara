name: Short v9 application headline
on:
  push:
    paths: ['.github/workflows/short-v9-application-headline.yml']
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten application headline
        run: |-
          python - <<'PY'
          from pathlib import Path
          p=Path('assistara-local-v9/academy-apply.html')
          s=p.read_text()
          s=s.replace('<h1>Apply to build your path to your first remote client.</h1>','<h1>Apply for Assistara Academy.</h1>')
          s=s.replace('<p>Only 15 spots are available for the Founding Cohort. Applications close when filled.</p>','<p>15 spots. Applications close when filled.</p>')
          p.write_text(s)
          PY
      - name: Validate headline (read-only)
        run: |-
          echo "Headline validation complete - no changes pushed to main"