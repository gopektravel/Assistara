                - generic [ref=f73e859]: VP of Engineering at MrBeast
          - listitem [ref=f73e860]:
            - blockquote [ref=f73e861]:
              - generic [ref=f73e862]: "\"Our partnership with Resend has been a great experience. They've made sure we can focus on what we do best—building our product and growing our business.\""
