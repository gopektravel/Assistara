                - generic [ref=f73e870]: Sahil Lavingia
                - generic [ref=f73e871]: CEO of Gumroad
          - listitem [ref=f73e872]:
            - blockquote [ref=f73e873]:
              - generic [ref=f73e874]: "\"Switching over to Resend from SendGrid marked a significant improvement in our email management. We started with a small test - waitlist emails for our iOS and Windows apps. Within 30 minutes, we were done.\""
