                - generic [ref=f73e835]: Co-founder of Infisical
          - listitem [ref=f73e836]:
            - blockquote [ref=f73e837]:
              - generic [ref=f73e838]: "\"As a developer I love the approach that the Resend team is taking. Its so refreshing. They are also extremely user-centric and helpful in terms of getting you up and running, sending beautiful emails that deliver.\""
              - generic [ref=f73e845]:
                - generic [ref=f73e846]: Hahnbee Lee
                - generic [ref=f73e847]: Co-Founder at Mintlify
          - listitem [ref=f73e848]:
            - blockquote [ref=f73e849]:
              - generic [ref=f73e850]: "\"We value tools that feel stable, well thought out, and aligned with the standards we expect across our stack. Resend meets those expectations. It lets our team stay focused on building the larger platform rather than getting pulled into the overhead that typically comes with legacy email infrastructure.\""
