          - listitem [ref=f73e824]:
            - blockquote [ref=f73e825]:
              - generic [ref=f73e826]: "\"Our team loves Resend. It makes email sending so easy and reliable. After we switched to Dedicated IPs, our deliverability improved tremendously and we don't hear complaints about emails landing on spam anymore.\""
