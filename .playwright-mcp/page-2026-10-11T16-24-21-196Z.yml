                - generic [ref=f73e882]: Thomas Mann
                - generic [ref=f73e883]: Founder & CEO of Raycast
          - listitem [ref=f73e884]:
            - blockquote [ref=f73e885]:
              - generic [ref=f73e886]: "\"The simplicity and reliability of Resend allowed our engineers to focus on building features rather than troubleshooting email infrastructure.\""
              - generic [ref=f73e893]:
                - generic [ref=f73e894]: Amadeo Pellicce
                - generic [ref=f73e895]: Connectors, Agents and Automations Lead at Replit
          - listitem [ref=f73e896]:
            - blockquote [ref=f73e897]:
              - generic [ref=f73e898]: "\"We're a small team with a lot on our plates. Email infrastructure is something we don't want to think about, and with Resend we don't have to.\""
