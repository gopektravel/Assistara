                - /url: /docs/api-reference/webhooks/create-webhook
              - text: .
            - generic [ref=f110e78]: "Webhooks deliver a JSON payload with metadata like the from, to, and status of your email event that can be used by your application. Use webhook feeds for common workflows such as:"
