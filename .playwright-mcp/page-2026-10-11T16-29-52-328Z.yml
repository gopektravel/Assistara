            - generic [ref=f110e76]:
              - text: Resend provides webhooks, which are real-time HTTPS requests that tell your application an event occurred, such as an email delivery notification or subscription status update. This allows you to receive real-time and actionable updates on the delivery, open, bounce, and click events of your emails. You can create, update, observe, and retry webhooks from the dashboard or
