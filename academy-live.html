<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistara Academy</title><style>html,body{margin:0;background:#fbfaf6}body{min-height:100vh}</style></head><body><script>(async()=>{try{const r=await fetch('/academy.html',{cache:'no-store'});let h=await r.text();h=h.replace('Start at the founding price.','Apply for the Founding Cohort.').replace('Join the first Assistara Academy cohort at a lower launch price while we build the Academy and Talent Network with our first graduates.','The first Assistara Academy cohort is intentionally small. Apply for one of up to 15 founding spots. We review every application for fit before inviting selected applicants to enroll.').replace('<div class="price-badge">FOUNDING PRICE</div>','<div class="price-badge">FOUNDING COHORT · UP TO 15 SPOTS</div>').replace('<div class="price">₱4,990</div>','<div class="price">₱6,900</div>').replace('<p class="price-sub">One-time payment</p>','<p class="price-sub">Founding Cohort investment · only if accepted</p>').replace('<span class="old-price">Standard price after the founding cohort: ₱7,990.</span>\n<br>\n<strong>Founding members save ₱3,000.</strong>','<span class="old-price">Application required. Payment is only requested after acceptance.</span>\n<br>\n<strong>Up to 15 applicants will be selected.</strong>').replace('<a class="btn btn-yellow full" id="stripeCheckout" href="#checkout">Enroll in Assistara Academy →</a>','<a class="btn btn-yellow full" id="academyApply" href="/academy/apply">Apply for the Founding Cohort →</a>').replace('Secure checkout will open through Stripe once the payment link is connected.','No payment to apply. Selected applicants receive a private enrollment and payment link.').replace('NOT READY TO ENROLL YET?','NOT READY TO APPLY YET?');document.open();document.write(h);document.close()}catch(e){location.replace('/academy.html')}})();</script></body></html>
