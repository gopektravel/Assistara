<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>Assistara Live Chat</title>
  <link rel="icon" type="image/svg+xml" href="/assistara-logo.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#151515;
      --cream:#fbfaf6;
      --yellow:#ffd51f;
      --muted:#68635d;
      --line:#dfdcd5;
      --green:#22c55e;
      --red:#ef4444;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:"Manrope",sans-serif}
    .shell{width:min(900px,calc(100% - 24px));margin:auto;height:100%;display:flex;flex-direction:column}
    .header{padding:16px 0;text-align:center}
    .header h1{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.03em;margin:0}
    .chat-wrapper{flex:1;display:flex;flex-direction:column;min-height:0}
  </style>
</head>
<body>
  <div class="shell">
    <header class="header">
      <h1>Assistara Live Chat</h1>
    </header>
    <div class="chat-wrapper">
      <div id="assistara-live-chat"></div>
    </div>
  </div>
  <script type="module" src="/dist/chat.js"></script>
</body>
</html>
