<!-- Concept 2 — CINEMATIC -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistara Masterclass Thumbnail — Cinematic</title>
<style>__MANROPE_CSS__</style>
<style>
  :root{
    --yellow:#FFD51F;
    --yellow-2:#FFF1A8;
    --ink:#151515;
    --cream:#FBFAF6;
    --muted:#66625F;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#0A0A0C}
  body{font-family:"Manrope",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .stage{position:relative;width:1280px;height:720px;color:var(--cream);overflow:hidden;
    background:
      radial-gradient(1150px 780px at 79% 12%, rgba(255,213,31,.16) 0%, rgba(255,213,31,.06) 34%, rgba(255,213,31,0) 62%),
      radial-gradient(900px 700px at 8% 108%, rgba(166,120,255,.10) 0%, rgba(166,120,255,0) 55%),
      radial-gradient(1400px 900px at 50% 40%, #16161A 0%, #0D0D10 55%, #08080A 100%);
  }

  /* dramatic key light */
  .keylight{position:absolute;right:-190px;top:-230px;width:760px;height:760px;border-radius:50%;
    background:radial-gradient(circle, rgba(255,213,31,.30) 0%, rgba(255,213,31,.10) 38%, rgba(255,213,31,0) 68%);
    filter:blur(6px)}
  .streak{position:absolute;right:-140px;top:60px;width:760px;height:2px;transform:rotate(-24deg);
    background:linear-gradient(90deg, rgba(255,213,31,0) 0%, rgba(255,213,31,.5) 45%, rgba(255,232,122,.9) 62%, rgba(255,213,31,0) 100%);
    filter:blur(1.5px);opacity:.85}
  .ring{position:absolute;right:96px;top:150px;width:352px;height:352px;border:2px solid rgba(255,213,31,.34);border-radius:50%}
  .ring-glow{position:absolute;right:92px;top:146px;width:360px;height:360px;border-radius:50%;
    box-shadow:0 0 90px 30px rgba(255,213,31,.14)}
  /* floor reflection line */
  .floor{position:absolute;left:0;right:0;bottom:0;height:200px;
    background:linear-gradient(180deg, rgba(255,213,31,0) 0%, rgba(255,213,31,.045) 100%)}

  /* lockup */
  .lockup{position:absolute;top:56px;left:76px;display:flex;align-items:center;gap:14px}
  .lockup svg{width:40px;height:40px;display:block}
  .lockup .name{color:#D6D6D6;font-weight:800;font-size:13px;letter-spacing:.22em}

  /* live pill */
  .live{position:absolute;top:56px;right:76px;display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.15);border-radius:999px;padding:11px 19px;
    backdrop-filter:blur(4px)}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 14px rgba(255,213,31,.95)}
  .live .txt{color:var(--yellow);font-weight:800;font-size:13px;letter-spacing:.18em;line-height:1}

  /* headline */
  .h{position:absolute;top:186px;left:76px}
  .h .l1{display:block;font-weight:800;font-size:44px;letter-spacing:.10em;color:rgba(251,250,246,.66)}
  .h .l2{display:block;margin-top:14px;font-weight:800;font-size:126px;line-height:.98;letter-spacing:-.045em;
    color:#FBFAF6;text-shadow:0 16px 48px rgba(0,0,0,.55)}
  .h .l3{display:block;font-weight:800;font-size:126px;line-height:.98;letter-spacing:-.045em;
    background:linear-gradient(180deg,#FFE97A 0%,#FFD51F 52%,#F2B90A 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 38px rgba(255,213,31,.30))}

  .sub{position:absolute;top:556px;left:76px;display:flex;align-items:center;gap:16px;
    font-weight:500;font-size:28px;letter-spacing:-.005em;color:#B7B7B7}
  .sub .dash{width:30px;height:3px;background:var(--yellow);border-radius:2px;box-shadow:0 0 14px rgba(255,213,31,.6)}

  /* hero mark */
  .mark-logo{position:absolute;right:88px;bottom:64px;width:148px;height:148px;
    filter:drop-shadow(0 0 54px rgba(255,213,31,.45))}
</style>
</head>
<body>
<div class="stage">
  <div class="keylight"></div>
  <div class="streak"></div>
  <div class="ring-glow"></div>
  <div class="ring"></div>
  <div class="floor"></div>

  <div class="lockup" data-m="lockup">
    <!-- REAL Assistara logo (assistara-logo.svg) -->
    <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="Assistara">
      <rect width="96" height="96" rx="27" fill="#FFD51F"/>
      <path d="M24 69.5 42.2 31.8c2.2-4.5 5.1-6.8 8.8-6.8 3.8 0 6.8 2.3 9 6.8l18.5 37.7c2.1 4.4-.8 8.5-5.2 8.5-2.7 0-4.9-1.5-6.1-4L52.8 45.3c-.8-1.6-2.8-1.6-3.6 0L35.2 74c-1.2 2.5-3.4 4-6 4-4.5 0-7.4-4.2-5.2-8.5Z" fill="#151515"/>
      <circle cx="48" cy="68" r="7.4" fill="#151515"/>
    </svg>
    <span class="name">ASSISTARA ACADEMY</span>
  </div>

  <div class="live" data-m="live"><span class="dot"></span><span class="txt">LIVE</span></div>

  <div class="h" data-m="h">
    <span class="l1" data-m="l1">HOW TO LAND YOUR</span>
    <span class="l2" data-m="l2">FIRST REMOTE</span>
    <span class="l3" data-m="l3">CLIENT</span>
  </div>

  <div class="sub" data-m="sub"><span class="dash"></span>Even as a complete beginner</div>

  <!-- REAL Assistara logo -->
  <svg class="mark-logo" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="Assistara">
    <rect width="96" height="96" rx="27" fill="#FFD51F"/>
    <path d="M24 69.5 42.2 31.8c2.2-4.5 5.1-6.8 8.8-6.8 3.8 0 6.8 2.3 9 6.8l18.5 37.7c2.1 4.4-.8 8.5-5.2 8.5-2.7 0-4.9-1.5-6.1-4L52.8 45.3c-.8-1.6-2.8-1.6-3.6 0L35.2 74c-1.2 2.5-3.4 4-6 4-4.5 0-7.4-4.2-5.2-8.5Z" fill="#151515"/>
    <circle cx="48" cy="68" r="7.4" fill="#151515"/>
  </svg>
</div>
</body>
</html>
