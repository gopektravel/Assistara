<!-- Concept 1 — EDITORIAL -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assistara Masterclass Thumbnail — Editorial</title>
<style>__MANROPE_CSS__</style>
<style>
  :root{
    --yellow:#FFD51F;
    --yellow-2:#FFF1A8;
    --ink:#151515;
    --ink-2:#171717;
    --cream:#FBFAF6;
    --muted:#66625F;
    --line:#DEDBD3;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--cream)}
  body{font-family:"Manrope",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .stage{position:relative;width:1280px;height:720px;background:var(--cream);color:var(--ink);overflow:hidden}

  /* ---------- right ink panel ---------- */
  .panel{position:absolute;top:0;right:0;width:424px;height:720px;background:var(--ink)}
  .panel .ring{position:absolute;left:50%;top:262px;width:292px;height:292px;transform:translate(-50%,-50%);
    border:1.5px solid rgba(255,255,255,.10);border-radius:50%}
  .panel .ring2{position:absolute;left:50%;top:262px;width:380px;height:380px;transform:translate(-50%,-50%);
    border:1px solid rgba(255,255,255,.05);border-radius:50%}
  .panel .logo{position:absolute;left:50%;top:262px;transform:translate(-50%,-50%);width:152px;height:152px}
  .panel .wordmark{position:absolute;top:452px;left:0;right:0;text-align:center;color:#FFFFFF;
    font-weight:800;font-size:20px;letter-spacing:.01em}
  .panel .wordmark-sub{position:absolute;top:484px;left:0;right:0;text-align:center;color:#9A9A9A;
    font-weight:700;font-size:11px;letter-spacing:.26em}

  .live{position:absolute;left:50%;top:556px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
    background:#232323;border:1px solid #383838;border-radius:999px;padding:12px 20px}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--yellow);box-shadow:0 0 12px rgba(255,213,31,.9)}
  .live .txt{color:var(--yellow);font-weight:800;font-size:13px;letter-spacing:.18em;line-height:1}

  /* ---------- left editorial column ---------- */
  .kicker{position:absolute;top:180px;left:64px;display:flex;align-items:center;gap:12px;
    font-weight:800;font-size:14px;letter-spacing:.20em;color:var(--muted)}
  .kicker .sq{width:11px;height:11px;background:var(--yellow);border-radius:3px}
  .kicker .rule{width:52px;height:1px;background:var(--line)}

  .h{position:absolute;top:234px;left:64px;font-weight:800;letter-spacing:-.045em;line-height:1.0}
  .h .l1{font-size:50px;letter-spacing:-.02em;color:var(--ink);display:block}
  .h .l2{font-size:108px;display:block;margin-top:12px}
  .h .l3{font-size:108px;display:block;margin-top:8px}

  .mark{position:relative;isolation:isolate;display:inline-block}
  .mark::after{content:"";position:absolute;left:-10px;right:-10px;bottom:12px;height:32px;
    background:var(--yellow);border-radius:12px;transform:rotate(-1.1deg);z-index:-1}

  .sub{position:absolute;top:576px;left:64px;display:flex;align-items:center;gap:16px;
    font-weight:600;font-size:27px;letter-spacing:-.01em;color:var(--muted)}
  .sub .dash{width:34px;height:4px;background:var(--yellow);border-radius:2px}
</style>
</head>
<body>
<div class="stage">
  <!-- right ink panel: real Assistara logo lockup -->
  <div class="panel">
    <div class="ring2"></div>
    <div class="ring"></div>
    <!-- REAL Assistara logo (assistara-logo.svg) -->
    <svg class="logo" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="Assistara">
      <rect width="96" height="96" rx="27" fill="#FFD51F"/>
      <path d="M24 69.5 42.2 31.8c2.2-4.5 5.1-6.8 8.8-6.8 3.8 0 6.8 2.3 9 6.8l18.5 37.7c2.1 4.4-.8 8.5-5.2 8.5-2.7 0-4.9-1.5-6.1-4L52.8 45.3c-.8-1.6-2.8-1.6-3.6 0L35.2 74c-1.2 2.5-3.4 4-6 4-4.5 0-7.4-4.2-5.2-8.5Z" fill="#151515"/>
      <circle cx="48" cy="68" r="7.4" fill="#151515"/>
    </svg>
    <div class="wordmark">Assistara Academy</div>
    <div class="wordmark-sub">MASTERCLASS</div>
    <div class="live"><span class="dot"></span><span class="txt">LIVE</span></div>
  </div>

  <div class="kicker" data-m="kicker"><span class="sq"></span>FREE MASTERCLASS<span class="rule"></span></div>

  <div class="h" data-m="h">
    <span class="l1" data-m="l1">HOW TO LAND YOUR</span>
    <span class="l2" data-m="l2">FIRST REMOTE</span>
    <span class="l3" data-m="l3"><span class="mark">CLIENT</span></span>
  </div>

  <div class="sub" data-m="sub"><span class="dash"></span>Even as a complete beginner</div>
</div>
</body>
</html>
